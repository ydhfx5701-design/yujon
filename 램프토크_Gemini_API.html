function ChatRoom({ plot, profiles, loreBooks, onBack, onExitToList, onPlotUpdated, onDeleteRoom, onOpenProfileForm, showToast }) {
  const [messages, setMessages] = useState([]);
  const [memory, setMemory] = useState({ shared: "", byChar: {}, promises: [] });
  const [statusEnabled, setStatusEnabled] = useState(null);
  const [scene, setScene] = useState(DEFAULT_SCENE());
  const [jobLog, setJobLog] = useState([]);
  const [presentIds, setPresentIds] = useState([]);
  const [credits, setCredits] = useState(0);
  const [inventory, setInventory] = useState([]);
  const [affection, setAffection] = useState({});
  const [bookmarks, setBookmarks] = useState([]);
  const [activeProfileId, setActiveProfileId] = useState(plot?.defaultProfileId || profiles[0]?.id);
  const [input, setInput] = useState("");
  const [actionMode, setActionMode] = useState(false);
  const [sending, setSending] = useState(false);
  const [typingLabel, setTypingLabel] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [profilePickOpen, setProfilePickOpen] = useState(false);
  const [detailCharId, setDetailCharId] = useState(null);
  const [roomSheet, setRoomSheet] = useState(null);
  const [deleteMode, setDeleteMode] = useState(false);
  const [selectedDeleteId, setSelectedDeleteId] = useState(null);
  const [regeneratingId, setRegeneratingId] = useState(null);
  const [highlightId, setHighlightId] = useState(null);
  const [error, setError] = useState("");
  const scrollRef = useRef(null);
  const sinceMemoryRef = useRef(0);
  const sinceStatusRef = useRef(0);
  const sendingRef = useRef(false);

  const characters = plot?.characters || [];
  const profile = profiles.find((p) => p.id === activeProfileId) || profiles[0];
  const attachedLore = (plot?.loreIds || []).map((id) => loreBooks.find((l) => l.id === id)).filter(Boolean);
  const cfg = plot?.styleConfig || DEFAULT_STYLE_CONFIG;
  const statusOn = statusEnabled === null ? (cfg.scene || STYLE_FIELDS.some((f) => cfg[f.key])) : statusEnabled;
  const jobsDoneToday = jobLog.filter((e) => e.date === scene.date).length;



  useEffect(() => {
    if (!plot) return;
    let cancelled = false;
    (async () => {
      setLoaded(false);
      const data = await storeGet(`chat:${plot.id}`);
      if (cancelled) return;
      if (data) {
        setMessages(data.messages || []);
        const mem = data.memory;
        setMemory(
          mem && typeof mem === "object"
            ? { shared: mem.shared || "", byChar: mem.byChar || {}, promises: mem.promises || [] }
            : { shared: typeof mem === "string" ? mem : "", byChar: {}, promises: [] }
        );
        setActiveProfileId(data.activeProfileId || plot.defaultProfileId || profiles[0]?.id);
        setStatusEnabled(data.statusEnabled === undefined ? null : data.statusEnabled);
        setScene(data.scene || DEFAULT_SCENE());
        setJobLog(data.jobLog || []);
        setPresentIds((data.presentIds || []).filter((id) => (plot.characters || []).some((c) => c.id === id)));
        setCredits(data.credits ?? START_CREDITS);
        setInventory(data.inventory || []);
        setAffection(data.affection || {});
        setBookmarks(data.bookmarks || []);
        sinceMemoryRef.current = data.messages?.length || 0;
      } else {
        const seed = plot.intro ? [{ id: genId(), kind: "narration", content: plot.intro, ts: Date.now() }] : [];
        const freshMem = { shared: "", byChar: {}, promises: [] };
        const freshScene = DEFAULT_SCENE();
        setMessages(seed); setMemory(freshMem); setStatusEnabled(null);
        setScene(freshScene); setJobLog([]); setPresentIds([]);
        setCredits(START_CREDITS); setInventory([]); setAffection({}); setBookmarks([]);
        sinceMemoryRef.current = 0; sinceStatusRef.current = 0;
        await storeSet(`chat:${plot.id}`, {
          messages: seed, memory: freshMem, activeProfileId: plot.defaultProfileId,
          statusEnabled: null, scene: freshScene, jobLog: [], presentIds: [],
          credits: START_CREDITS, inventory: [], affection: {}, bookmarks: [],
        });
      }
      setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, [plot?.id]);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, sending, typingLabel]);

  const persistFull = async (overrides = {}) => {
    await storeSet(`chat:${plot.id}`, {
      messages: overrides.messages ?? messages,
      memory: overrides.memory ?? memory,
      activeProfileId: overrides.activeProfileId ?? activeProfileId,
      statusEnabled: overrides.statusEnabled === undefined ? statusEnabled : overrides.statusEnabled,
      scene: overrides.scene ?? scene,
      jobLog: overrides.jobLog ?? jobLog,
      presentIds: overrides.presentIds ?? presentIds,
      credits: overrides.credits ?? credits,
      inventory: overrides.inventory ?? inventory,
      affection: overrides.affection ?? affection,
      bookmarks: overrides.bookmarks ?? bookmarks,
    });
  };
  const updatePlotPreview = async (lastMsg) => { await onPlotUpdated({ ...plot, lastMessage: (lastMsg || "").slice(0, 40), lastMessageAt: Date.now() }); };

  const nameOf = (kind, speakerId) => {
    if (kind === "user") return profile?.name || "사용자";
    if (kind === "narration" || kind === "status") return "";
    return characters.find((c) => c.id === speakerId)?.name || "???";
  };
  const memoryTextFor = (character) => [memory.shared, memory.byChar?.[character.id]].filter(Boolean).join("\n");
  const affectionNote = (charId) => {
    const v = affection[charId] ?? AFFECTION_DEFAULT;
    const band = affectionBand(v);
    const name = characters.find((c) => c.id === charId)?.name || "";
    return `\n현재 사용자에 대한 "${name}"의 호감도는 100점 만점에 ${v}점(${band.label} 수준)입니다. 호감도가 낮을수록 차갑거나 무심하거나 경계하는 태도를, 높을수록 다정하고 친밀한 태도를 자연스럽게 반영해서 말하세요.`;
  };

  const maybeUpdateMemory = async (msgs) => {
    sinceMemoryRef.current += 1;
    if (sinceMemoryRef.current < MEMORY_EVERY) return memory;
    sinceMemoryRef.current = 0; sinceStatusRef.current = 0;
    try {
      const recent = msgs.slice(-MEMORY_EVERY * 6).filter((m) => m.kind === "user" || m.kind === "character");
      const transcript = recent.map((m) => `${nameOf(m.kind, m.speakerId)}: ${m.content}`).join("\n");
      const charList = characters.map((c) => `${c.id}:${c.name}`).join(", ");
      const charSchema = characters.map((c) => `"${c.id}":"${c.name}만 특별히 기억하는 것들을 한국어 불릿 목록 텍스트로"`).join(",");
      const sys = `당신은 롤플레잉 채팅방 "${plot.title}"의 기억 정리 보조자입니다. 참여 캐릭터(id:이름): ${charList}. 캐릭터들은 절대 잊으면 안 되는 정보를 매우 잘 기억해야 하고, 서로 나눈 약속도 놓치면 안 됩니다. 아래 JSON 스키마와 정확히 같은 키만 가진 JSON 객체 하나만 출력하세요. 코드블록이나 다른 설명은 절대 쓰지 마세요.\n{"shared":"모두가 함께 아는 사실을 한국어 불릿 목록 텍스트로(각 줄 앞에 -)","characters":{${charSchema}},"promises":[{"characterIds":["관련 캐릭터 id들"],"withUser":true또는false,"description":"약속 내용","when":"언제인지(예: 내일, 다음 주말, 한 달 뒤)"}]}`;
      const raw = await callClaude(sys, [{ role: "user", content:
        `[기존 공통 기억]\n${memory.shared || "(없음)"}\n\n[기존 캐릭터별 기억]\n${JSON.stringify(memory.byChar || {})}\n\n[기존 약속 목록]\n${JSON.stringify(memory.promises || [])}\n\n[최근 대화]\n${transcript}\n\n` +
        `위 대화를 바탕으로 기존 기억과 통합해서 최신 기억 JSON을 만들어줘. 이름, 취향, 관계, 중요한 사건, 감정, 약속, 설정 등 구체적 사실 위주로 자세히 담되 중복은 제거해. 공통 기억은 최대 15줄, 캐릭터별 기억은 각각 최대 8줄. 새로운 대화에서 사용자나 캐릭터끼리 만든 약속・계획이 있으면 promises 목록에 추가하고, 기존 약속 중 이미 지켜졌거나 취소된 것은 목록에서 빼줘. 약속이 없으면 promises는 빈 배열로.` },
      ], 1400);
      const clean = raw.replace(/```json|```/g, "").trim();
      const match = clean.match(/\{[\s\S]*\}/);
      const parsed = JSON.parse(match ? match[0] : clean);
      const next = {
        shared: parsed.shared || memory.shared || "",
        byChar: { ...memory.byChar, ...(parsed.characters || {}) },
        promises: Array.isArray(parsed.promises)
          ? parsed.promises.map((p) => ({ id: genId(), characterIds: p.characterIds || [], withUser: !!p.withUser, description: p.description || "", when: p.when || "" }))
          : (memory.promises || []),
      };
      setMemory(next);
      return next;
    } catch (e) { console.error(e); return memory; }
  };

  const buildHistoryFor = (characterId, msgs) => {
    const trimmed = msgs.slice(-60);
    const mapped = trimmed.filter((m) => m.kind === "user" || m.kind === "character" || m.kind === "narration").map((m) => {
      if (m.kind === "narration") return { role: "user", content: `(상황) ${m.content}` };
      return {
        role: m.kind === "character" && m.speakerId === characterId ? "assistant" : "user",
        content: m.kind === "character" && m.speakerId === characterId ? m.content : `[${nameOf(m.kind, m.speakerId)}] ${m.content}`,
      };
    });
    const normalized = normalizeHistory(mapped);
    if (normalized.length === 0) return [{ role: "user", content: "..." }];
    // 빈 입력으로 대화를 이어갈 때 이 캐릭터 본인의 마지막 대사가 그대로 끝에 남아
    // 이어서 말할 새 계기가 없어지는 경우를 방지.
    if (normalized[normalized.length - 1].role === "assistant") {
      normalized.push({ role: "user", content: "(자연스럽게 이야기를 계속 이어가줘)" });
    }
    return normalized;
  };
  const extraGroupNote = (char, presentSet) => {
    const others = characters
      .filter((c) => c.id !== char.id && (!presentSet || presentSet.has(c.id)))
      .map((c) => c.name);
    if (characters.length <= 1) return "";
    return `\n지금은 "${plot.title}" 장면입니다. 현재 이 장소에 함께 있는 다른 캐릭터: ${others.join(", ") || "없음 (지금은 사용자와 단둘이 있습니다)"}. 대괄호 [이름] 표시는 발화자 구분용 태그이니 그대로 따라 쓰지 마세요. 함께 있는 캐릭터의 말에는 자연스럽게 반응하되, 지금 이 자리에 없는 캐릭터를 마음대로 등장시키거나 그들이 이 자리에 있는 것처럼 말하지 마세요.`;
  };

  const send = async () => {
    if (sendingRef.current || sending || characters.length === 0) return;
    sendingRef.current = true;
    const raw = input.trim();
    setError(""); setInput("");
    let current = messages;
    const excludeIds = new Set();

    if (raw) {
      if (actionMode) {
        current = [...messages, { id: genId(), kind: "user", content: `*${raw}*`, ts: Date.now() }];
      } else {
        const segments = parseScriptedInput(raw, characters);
        if (segments.some((s) => s.type === "character")) {
          for (const seg of segments) {
            if (seg.type === "character") {
              current = [...current, { id: genId(), kind: "character", speakerId: seg.characterId, content: seg.content, ts: Date.now() }];
              excludeIds.add(seg.characterId);
            } else if (seg.content.trim()) {
              current = [...current, { id: genId(), kind: "user", content: seg.content.trim(), ts: Date.now() }];
            }
          }
        } else {
          current = [...current, { id: genId(), kind: "user", content: raw, ts: Date.now() }];
        }
      }
      setMessages(current);
      await persistFull({ messages: current });
      updatePlotPreview(raw);
    }
    setActionMode(false);
    setSending(true);

    try {
      const scanText = [...current.slice(-6).map((m) => m.content || ""), raw].join("\n");
      const loreContext = getLoreContext(attachedLore, scanText);
      const priorSpoken = new Set(current.filter((m) => m.kind === "character").map((m) => m.speakerId));

      // 현재 장면에 함께 있는 캐릭터 관리
      const present = new Set(presentIds.filter((id) => characters.some((c) => c.id === id)));
      excludeIds.forEach((id) => present.add(id)); // @이름으로 직접 대사한 캐릭터는 당연히 이 자리에 있음
      // 사용자가 이름을 부른 캐릭터는 합류
      if (raw) {
        for (const c of characters) {
          if (!present.has(c.id) && c.name && raw.includes(c.name)) present.add(c.id);
        }
      }
      // 아무도 없으면 1~2명으로 시작
      if (present.size === 0 && characters.length > 0) {
        const initial = [...characters].sort(() => Math.random() - 0.5).slice(0, Math.min(2, characters.length));
        initial.forEach((c) => present.add(c.id));
      }
      // 가끔(12%) 한 명만 자연스럽게 합류 - 단체로 튀어나오지 않게
      if (present.size < characters.length && Math.random() < 0.12) {
        const absent = characters.filter((c) => !present.has(c.id));
        const joiner = absent[Math.floor(Math.random() * absent.length)];
        if (joiner) present.add(joiner.id);
      }
      const nextPresentIds = Array.from(present);
      setPresentIds(nextPresentIds);

      const respondPool = characters.filter((c) => present.has(c.id) && !excludeIds.has(c.id));
      const shuffled = [...respondPool].sort(() => Math.random() - 0.5);
      const respondCount = respondPool.length <= MAX_RESPONDERS ? respondPool.length : MAX_RESPONDERS;
      const responders = shuffled.slice(0, respondCount);
      const turnReplies = [];
      let invNow = inventory;
      let failCount = 0;
      let lastErrorMsg = "";

      for (const char of responders) {
        setTypingLabel(char.name);
        let extra = extraGroupNote(char, present) + affectionNote(char.id);
        if (!priorSpoken.has(char.id)) {
          extra += `\n지금이 이 장면에서 "${char.name}"이(가) 처음 등장하는 순간입니다. 자연스럽게 등장하는 동작 묘사로 대사를 시작하세요 (예: *문을 열고 들어오며*).`;
        }
        if (loreContext) extra += `\n\n[세계관 로어북 정보 - 아래 내용을 설정에 반영하세요]\n${loreContext}`;
        const history = buildHistoryFor(char.id, current);
        let reply = "";
        try { reply = await callClaudeWithRetry(buildPersonaSystem(char, memoryTextFor(char), profile, extra), history); }
        catch (e) { console.error(`${char.name} 응답 실패`, e); failCount += 1; lastErrorMsg = e?.message || String(e); continue; }
        const charMsg = { id: genId(), kind: "character", speakerId: char.id, content: reply || "...", ts: Date.now() };
        current = [...current, charMsg];
        turnReplies.push({ character: char, content: reply });
        priorSpoken.add(char.id);
        setMessages(current);
        await persistFull({ messages: current, inventory: invNow, presentIds: nextPresentIds });

        try {
          const giftName = await detectGiftFromReply(reply);
          if (giftName) {
            invNow = [...invNow, { id: genId(), itemId: null, name: giftName, image: "", cost: 0, fromCharacterId: char.id, fromCharacterName: char.name }];
            setInventory(invNow);
            await persistFull({ messages: current, inventory: invNow, presentIds: nextPresentIds });
            showToast?.(`${char.name}에게서 "${giftName}"을(를) 선물받았어요!`);
          }
        } catch (e) { console.error(e); }
      }
      setTypingLabel(null);

      // 아무도 대답하지 못했다면 조용히 넘어가지 않고 바로 알려줘요 (원인은 대부분 네트워크/일시적인 API 오류예요)
      if (responders.length > 0 && turnReplies.length === 0) {
        setError(`캐릭터 응답을 받아오지 못했어요${lastErrorMsg ? ` — ${lastErrorMsg}` : ""}. 잠시 후 다시 시도해주세요.`);
        showToast?.("응답에 실패했어요. 다시 시도해주세요.");
      } else if (failCount > 0) {
        showToast?.(`${failCount}명의 응답을 받아오지 못했어요`);
      }

      let nextScene = scene;
      if (turnReplies.length > 0 && statusOn) {
        sinceStatusRef.current += 1;
        if (sinceStatusRef.current >= STATUS_EVERY) {
          sinceStatusRef.current = 0;
          try {
            const recentText = current.slice(-10).filter((m) => m.kind === "user" || m.kind === "character" || m.kind === "narration")
              .map((m) => (m.kind === "narration" ? `(상황) ${m.content}` : `${nameOf(m.kind, m.speakerId)}: ${m.content}`)).join("\n");
            let sceneBlock = null;
            if (cfg.scene) {
              nextScene = await advanceAndDescribeScene(scene, recentText, showToast);
              setScene(nextScene);
              sceneBlock = { date: formatDateLabel(nextScene.date), time: nextScene.time, location: nextScene.location, weather: nextScene.weather, situation: nextScene.situation };
            }
            const activeFields = STYLE_FIELDS.filter((f) => cfg[f.key]);
            const charBlocks = [];
            for (const r of turnReplies) {
              try {
                const cb = await generateCharacterStatus(r.character, activeFields, recentText, showToast);
                if (cb) charBlocks.push(cb);
              } catch (e) { console.error(e); }
            }
            if (sceneBlock || charBlocks.length > 0) {
              const statusMsg = { id: genId(), kind: "status", scene: sceneBlock, characters: charBlocks, ts: Date.now() };
              current = [...current, statusMsg];
              setMessages(current);
              await persistFull({ messages: current, scene: nextScene, inventory: invNow, presentIds: nextPresentIds });
            }
          } catch (e) {
            console.error("status generation failed", e);
            // 최소한 날짜/시간만이라도 보여줌
            if (cfg.scene) {
              const fb = advanceClock(scene.date || nowDateTime().date, scene.time || nowDateTime().time, 3);
              nextScene = { ...scene, ...fb };
              setScene(nextScene);
              const statusMsg = { id: genId(), kind: "status", scene: { date: formatDateLabel(nextScene.date), time: nextScene.time, location: nextScene.location, weather: nextScene.weather, situation: nextScene.situation }, characters: [], ts: Date.now() };
              current = [...current, statusMsg];
              setMessages(current);
              await persistFull({ messages: current, scene: nextScene, inventory: invNow, presentIds: nextPresentIds });
            }
          }
        }
      }
      if (!raw && turnReplies.length > 0) updatePlotPreview(turnReplies[turnReplies.length - 1]?.content || "");

      const newMem = await maybeUpdateMemory(current);
      if (newMem !== memory) await persistFull({ messages: current, memory: newMem, scene: nextScene, inventory: invNow, presentIds: nextPresentIds });
    } catch (e) {
      console.error(e);
      setError("응답을 받아오지 못했어요. 잠시 후 다시 시도해주세요.");
    } finally {
      setSending(false);
      setTypingLabel(null);
      sendingRef.current = false;
    }
  };

  const regenerateMessage = async (messageId) => {
    const idx = messages.findIndex((m) => m.id === messageId);
    if (idx === -1) return;
    const msg = messages[idx];
    if (msg.kind !== "character") return;
    const character = characters.find((c) => c.id === msg.speakerId);
    if (!character) return;
    setRegeneratingId(messageId);
    try {
      const historyBase = messages.slice(0, idx);
      const history = buildHistoryFor(character.id, historyBase);
      const scanText = historyBase.slice(-6).map((m) => m.content || "").join("\n");
      const loreContext = getLoreContext(attachedLore, scanText);
      let extra = extraGroupNote(character, new Set([...presentIds, character.id])) + affectionNote(character.id);
      if (loreContext) extra += `\n\n[세계관 로어북 정보 - 아래 내용을 설정에 반영하세요]\n${loreContext}`;
      const reply = await callClaudeWithRetry(buildPersonaSystem(character, memoryTextFor(character), profile, extra), history);
      const next = messages.map((m, i) => (i === idx ? { ...m, content: reply || "..." } : m));
      setMessages(next);
      await persistFull({ messages: next });
    } catch (e) { console.error(e); showToast?.(`다시 생성하지 못했어요 (${e?.message || e})`); }
    finally { setRegeneratingId(null); }
  };

  const doRestart = async () => {
    setMenuOpen(false);
    const seed = plot.intro ? [{ id: genId(), kind: "narration", content: plot.intro, ts: Date.now() }] : [];
    const freshMem = { shared: "", byChar: {}, promises: [] };
    const freshScene = DEFAULT_SCENE();
    setMessages(seed); setMemory(freshMem); setScene(freshScene); setJobLog([]);
    setAffection({}); setPresentIds([]);
    sinceMemoryRef.current = 0; sinceStatusRef.current = 0;
    await persistFull({ messages: seed, memory: freshMem, scene: freshScene, jobLog: [], affection: {}, presentIds: [] });
    showToast?.("대화를 새로 시작했어요 (호감도도 초기화됐어요)");
  };
  const toggleStatus = async () => {
    const next = !statusOn;
    setMenuOpen(false);
    setStatusEnabled(next);
    await persistFull({ statusEnabled: next });
    showToast?.(next ? "상태창을 켰어요" : "상태창을 껐어요");
  };
  const stub = (msg) => { setMenuOpen(false); showToast?.(msg || "준비 중인 기능이에요"); };

  const enterDeleteMode = () => { setMenuOpen(false); setDeleteMode(true); setSelectedDeleteId(null); };
  const cancelDeleteMode = () => { setDeleteMode(false); setSelectedDeleteId(null); };
  const confirmDeleteFromPoint = async () => {
    if (!selectedDeleteId) return;
    const idx = messages.findIndex((m) => m.id === selectedDeleteId);
    if (idx === -1) return;
    const next = messages.slice(0, idx);
    setMessages(next);
    await persistFull({ messages: next });
    setDeleteMode(false);
    setSelectedDeleteId(null);
    showToast?.("선택한 지점부터 삭제했어요");
  };

  const toggleBookmark = async (messageId) => {
    const exists = bookmarks.find((b) => b.messageId === messageId);
    const next = exists ? bookmarks.filter((b) => b.messageId !== messageId) : [...bookmarks, { id: genId(), messageId, ts: Date.now() }];
    setBookmarks(next);
    await persistFull({ bookmarks: next });
    showToast?.(exists ? "책갈피를 제거했어요" : "책갈피를 꽂았어요");
  };
  const jumpToMessage = (messageId) => {
    setRoomSheet(null);
    setTimeout(() => {
      document.getElementById(`msg-${messageId}`)?.scrollIntoView({ behavior: "smooth", block: "center" });
      setHighlightId(messageId);
      setTimeout(() => setHighlightId(null), 1600);
    }, 60);
  };

  const doJob = async (job) => {
    if (jobsDoneToday >= MAX_JOBS_PER_DAY) { showToast?.(`오늘은 이미 알바・의뢰를 ${MAX_JOBS_PER_DAY}번 했어요. 내일 다시 시도해보세요.`); return; }

    const targetDate = job.date || scene.date;
    const targetTime = job.time || scene.time;
    const timeChanged = targetDate !== scene.date || targetTime !== scene.time;
    const nextScene = timeChanged ? { ...scene, date: targetDate, time: targetTime } : scene;

    const nextCredits = credits + (job.reward || 0);
    const nextJobLog = [...jobLog, { jobId: job.id, date: targetDate }];
    setCredits(nextCredits);
    setJobLog(nextJobLog);
    if (timeChanged) setScene(nextScene);
    setRoomSheet(null);
    showToast?.(`+${job.reward} 크레딧을 받았어요`);

    const companions = (job.companionIds || []).map((id) => characters.find((c) => c.id === id)).filter(Boolean);
    // 알바 장면에는 동행 캐릭터만 함께 있음
    const jobPresentIds = companions.map((c) => c.id);
    if (companions.length > 0) setPresentIds(jobPresentIds);
    const timeNote = timeChanged ? ` (${formatDateLabel(targetDate)} ${targetTime})` : "";
    const jobMsg = {
      id: genId(), kind: "narration",
      content: `*${profile?.name || "나"}${companions.length ? `가 ${companions.map((c) => c.name).join(", ")}와(과) 함께` : "가"} "${job.name}"${timeNote}을(를) 하러 갔다*`,
      ts: Date.now(),
    };
    let current = [...messages, jobMsg];
    setMessages(current);
    await persistFull({ messages: current, credits: nextCredits, scene: nextScene, jobLog: nextJobLog, presentIds: companions.length > 0 ? jobPresentIds : presentIds });

    if (companions.length === 0) return;
    const presentSet = new Set(jobPresentIds);
    setSending(true);
    for (const comp of companions.slice(0, MAX_RESPONDERS)) {
      setTypingLabel(comp.name);
      try {
        const history = buildHistoryFor(comp.id, current);
        const extra = extraGroupNote(comp, presentSet) + affectionNote(comp.id) +
          `\n[매우 중요] 방금 사용자와 단둘이(또는 위에 명시된 동행끼리만) "${job.name}"을(를) 하고 왔습니다. 당신의 이번 대사는 반드시 이 "${job.name}" 경험에 대한 이야기여야 합니다. 이 자리에 없는 다른 캐릭터를 등장시키지 마세요.`;
        const reply = await callClaudeWithRetry(buildPersonaSystem(comp, memoryTextFor(comp), profile, extra), history);
        const cm = { id: genId(), kind: "character", speakerId: comp.id, content: reply || "...", ts: Date.now() };
        current = [...current, cm];
        setMessages(current);
        await persistFull({ messages: current, credits: nextCredits, scene: nextScene, jobLog: nextJobLog, presentIds: jobPresentIds });
      } catch (e) { console.error(e); }
    }
    setSending(false); setTypingLabel(null);
  };

  const buyItem = async (item) => {
    if (credits < item.cost) { showToast?.("크레딧이 부족해요"); return; }
    const nextCredits = credits - item.cost;
    const nextInventory = [...inventory, { id: genId(), itemId: item.id, name: item.name, image: item.image, cost: item.cost }];
    setCredits(nextCredits);
    setInventory(nextInventory);
    await persistFull({ credits: nextCredits, inventory: nextInventory });
    showToast?.(`${item.name}을(를) 구매했어요`);
  };
  const useItem = async (item) => {
    const idx = inventory.findIndex((x) => x.id === item.id);
    const nextInventory = idx === -1 ? inventory : [...inventory.slice(0, idx), ...inventory.slice(idx + 1)];
    setInventory(nextInventory);
    setRoomSheet(null);
    const useMsg = { id: genId(), kind: "narration", content: `*${profile?.name || "나"}가 "${item.name}"을(를) 사용했다*`, ts: Date.now() };
    let current = [...messages, useMsg];
    setMessages(current);
    await persistFull({ messages: current, inventory: nextInventory });
    if (characters.length === 0) return;
    const presentNow = characters.filter((c) => presentIds.includes(c.id));
    const pool = presentNow.length > 0 ? presentNow : characters;
    const reactor = pool[Math.floor(Math.random() * pool.length)];
    setSending(true); setTypingLabel(reactor.name);
    try {
      const history = buildHistoryFor(reactor.id, current);
      const extra = extraGroupNote(reactor, new Set([...presentIds, reactor.id])) + affectionNote(reactor.id) + `\n방금 사용자가 "${item.name}"을(를) 사용하는 모습을 봤습니다. 그것에 대한 반응을 자연스럽게 표현하며 말하세요.`;
      const reply = await callClaudeWithRetry(buildPersonaSystem(reactor, memoryTextFor(reactor), profile, extra), history);
      const rm = { id: genId(), kind: "character", speakerId: reactor.id, content: reply || "...", ts: Date.now() };
      current = [...current, rm];
      setMessages(current);
      await persistFull({ messages: current, inventory: nextInventory });
    } catch (e) { console.error(e); }
    setSending(false); setTypingLabel(null);
  };
  const giveGift = async (invItem, character) => {
    const idx = inventory.findIndex((x) => x.id === invItem.id);
    const nextInventory = idx === -1 ? inventory : [...inventory.slice(0, idx), ...inventory.slice(idx + 1)];
    const bump = Math.min(10, Math.max(3, Math.round((invItem.cost || 10) / 15) + 3));
    const nextAffection = { ...affection, [character.id]: clamp((affection[character.id] ?? AFFECTION_DEFAULT) + bump, AFFECTION_MIN, AFFECTION_MAX) };
    setInventory(nextInventory);
    setAffection(nextAffection);
    setRoomSheet(null);

    const giftMsg = { id: genId(), kind: "narration", content: `*${profile?.name || "나"}가 ${character.name}에게 "${invItem.name}"을(를) 선물했다*`, ts: Date.now() };
    let current = [...messages, giftMsg];
    setMessages(current);
    await persistFull({ messages: current, inventory: nextInventory, affection: nextAffection });

    setSending(true);
    setTypingLabel(character.name);
    try {
      const presentSet = new Set([...presentIds, character.id]);
      const history = buildHistoryFor(character.id, current);
      const extra = extraGroupNote(character, presentSet) + affectionNote(character.id) +
        `\n[매우 중요] 방금 사용자가 당신에게 "${invItem.name}"을(를) 직접 선물로 건넸습니다. 당신의 이번 대사는 반드시 이 "${invItem.name}" 선물을 받은 것에 대한 반응이어야 합니다. 선물을 받아들고, 그에 대한 감정을 표현하세요. 선물과 무관한 다른 이야기를 하지 마세요.`;
      const reply = await callClaudeWithRetry(buildPersonaSystem(character, memoryTextFor(character), profile, extra), history);
      const charMsg = { id: genId(), kind: "character", speakerId: character.id, content: reply || "...", ts: Date.now() };
      current = [...current, charMsg];
      setMessages(current);
      await persistFull({ messages: current, inventory: nextInventory, affection: nextAffection });
    } catch (e) { console.error(e); }
    setSending(false); setTypingLabel(null);
    showToast?.(`${character.name}에게 선물을 줬어요 (+${bump} 호감도)`);
  };

  if (!plot) return null;

  return (
    <div className="lt-screen-full">
      <div className="lt-chat-header">
        <button className="lt-iconbtn" onClick={onBack}><ChevronLeft size={20} /></button>
        <StackAvatars people={characters} size={32} />
        <div className="lt-chat-header-text">
          <div className="lt-chat-header-name">{plot.title}</div>
          <div className="lt-chat-header-sub">{characters.map((c) => c.name).join(", ")}</div>
        </div>
        <div className="lt-profile-pill-wrap">
          <button className="lt-profile-pill" onClick={() => setProfilePickOpen((v) => !v)}>{profile?.name || "프로필"} <ChevronDown size={13} /></button>
          {profilePickOpen && (
            <div className="lt-profile-pick-menu">
              {profiles.map((p) => (
                <div key={p.id} className={"lt-profile-pick-item" + (p.id === activeProfileId ? " on" : "")}
                  onClick={async () => { setActiveProfileId(p.id); setProfilePickOpen(false); await persistFull({ activeProfileId: p.id }); }}>
                  {p.name}
                </div>
              ))}
              <div className="lt-profile-pick-item add" onClick={() => { setProfilePickOpen(false); onOpenProfileForm(null); }}><Plus size={12} /> 새 프로필</div>
            </div>
          )}
        </div>
        <button className="lt-iconbtn" onClick={() => setMenuOpen((v) => !v)}><Menu size={19} /></button>
      </div>

      {menuOpen && (
        <div className="lt-menu-overlay" onClick={() => setMenuOpen(false)}>
          <div className="lt-menu-panel" onClick={(e) => e.stopPropagation()}>
            <div className="lt-menu-credit-pill">💰 {credits} 크레딧</div>
            <button className="lt-menu-item" onClick={doRestart}>
              <RotateCcw size={16} /><div><div>새로하기</div><div className="lt-menu-item-sub">현재 내용을 초기화하고 다시 시작해요</div></div>
            </button>
            <button className="lt-menu-item danger" onClick={enterDeleteMode}>
              <Trash2 size={16} /><div><div>대화 삭제</div><div className="lt-menu-item-sub">원하는 지점을 선택해서 그 이후를 삭제해요</div></div>
            </button>
            <div className="lt-menu-divider" />
            <button className="lt-menu-item" onClick={() => { setMenuOpen(false); onOpenProfileForm(activeProfileId); }}>
              <Users size={16} /><div style={{ flex: 1 }}>대화 프로필</div><span className="lt-menu-item-value">{profile?.name} <ChevronRight size={14} /></span>
            </button>
            <button className="lt-menu-item" onClick={toggleStatus}>
              <ListChecks size={16} /><div style={{ flex: 1 }}>상태창</div><span className="lt-menu-item-value">{statusOn ? "사용" : "사용 안 함"} <ChevronRight size={14} /></span>
            </button>
            <button className="lt-menu-item" onClick={() => { setMenuOpen(false); setRoomSheet("affection"); }}>
              <Heart size={16} /><div style={{ flex: 1 }}>호감도</div><ChevronRight size={14} />
            </button>
            <div className="lt-menu-divider" />
            <button className="lt-menu-item" onClick={() => { setMenuOpen(false); setRoomSheet("jobs"); }}>
              <Briefcase size={16} /><div style={{ flex: 1 }}>일하기 (알바・의뢰)</div><ChevronRight size={14} />
            </button>
            <button className="lt-menu-item" onClick={() => { setMenuOpen(false); setRoomSheet("shop"); }}>
              <ShoppingBag size={16} /><div style={{ flex: 1 }}>상점</div><ChevronRight size={14} />
            </button>
            <button className="lt-menu-item" onClick={() => { setMenuOpen(false); setRoomSheet("inventory"); }}>
              <Gift size={16} /><div style={{ flex: 1 }}>인벤토리(선물)</div><ChevronRight size={14} />
            </button>
            <div className="lt-menu-divider" />
            <button className="lt-menu-item" onClick={() => { setMenuOpen(false); setRoomSheet("bookmarks"); }}>
              <Bookmark size={16} /><div style={{ flex: 1 }}>책갈피 목록</div><ChevronRight size={14} />
            </button>
            <div className="lt-menu-divider" />
            <button className="lt-menu-item" onClick={onExitToList}><LogOut size={16} /><div>대화방 나가기</div></button>
          </div>
        </div>
      )}

      <button className="lt-fab-back" onClick={onBack} title="뒤로가기"><ChevronLeft size={20} /></button>

      <div className="lt-chat-scroll" ref={scrollRef}>
          {!loaded && <div className="lt-muted lt-pad">불러오는 중…</div>}
          {loaded && messages.length === 0 && <div className="lt-empty-hint lt-pad">{characters.map((c) => c.name).join(", ")}에게 첫 마디를 건네보세요.</div>}
          {messages.map((m) => {
            let content;
            if (m.kind === "narration") {
              content = <div className="lt-narration"><AlignLeft size={13} /><span>{m.content}</span></div>;
            } else if (m.kind === "status") {
              content = <StatusBlockView status={m} />;
            } else {
              const isUser = m.kind === "user";
              const speaker = !isUser ? characters.find((c) => c.id === m.speakerId) : null;
              const bookmarked = bookmarks.some((b) => b.messageId === m.id);
              content = (
                <div className={"lt-turn-row " + (isUser ? "user" : "char")}>
                  {!isUser && (
                    <button className="lt-avatar-btn" onClick={(e) => { if (deleteMode) return; e.stopPropagation(); setDetailCharId(speaker?.id); }}>
                      <Avatar name={speaker?.name} image={speaker?.images?.[0]} size={26} />
                    </button>
                  )}
                  <div className="lt-turn-text">
                    <div className="lt-turn-name">{isUser ? (profile?.name || "나") : speaker?.name}</div>
                    <div className="lt-turn-content">{renderMessageContent(m.content)}</div>
                    {!deleteMode && (
                      <div className="lt-turn-actions">
                        {m.kind === "character" && (
                          <button className="lt-msg-action" onClick={(e) => { e.stopPropagation(); regenerateMessage(m.id); }} disabled={regeneratingId === m.id} title="다시 생성">
                            {regeneratingId === m.id ? <Loader2 size={12} className="lt-spin" /> : <RotateCcw size={12} />}
                          </button>
                        )}
                        <button className="lt-msg-action" onClick={(e) => { e.stopPropagation(); toggleBookmark(m.id); }} title="책갈피">
                          <Bookmark size={12} fill={bookmarked ? "currentColor" : "none"} />
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              );
            }
            return (
              <div key={m.id} id={`msg-${m.id}`}
                className={
                  (deleteMode ? "lt-delete-select" + (selectedDeleteId === m.id ? " selected" : "") : "") +
                  (highlightId === m.id ? " lt-highlight" : "")
                }
                onClick={deleteMode ? () => setSelectedDeleteId(m.id) : undefined}>
                {content}
              </div>
            );
          })}
          {sending && <Typing label={typingLabel} />}
        </div>

      {error && <div className="lt-error lt-pad">{error}</div>}

      {deleteMode ? (
        <div className="lt-input-bar lt-delete-bar">
          <button className="lt-btn" onClick={cancelDeleteMode}>취소</button>
          <div className="lt-muted" style={{ flex: 1, textAlign: "center", fontSize: 12 }}>삭제할 지점을 선택하세요</div>
          <button className="lt-btn danger" disabled={!selectedDeleteId} onClick={confirmDeleteFromPoint}>선택 지점부터 삭제</button>
        </div>
      ) : (
        <div className="lt-input-bar">
          <button className={"lt-action-toggle" + (actionMode ? " on" : "")} onClick={() => setActionMode((v) => !v)} title="행동 묘사로 보내기">*</button>
          <input
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
            placeholder={actionMode ? "행동을 입력해주세요 (예: 문을 조용히 닫는다)" : "내용 입력하기 (@이름: 대사 / 비워두고 보내면 대화가 이어져요)"}
            disabled={sending}
          />
          <button className="lt-send" onClick={send} disabled={sending}>
            {sending ? <Loader2 size={16} className="lt-spin" /> : <Send size={16} />}
          </button>
        </div>
      )}

      <CharacterDetailSheet character={characters.find((c) => c.id === detailCharId)} memory={memory} characters={characters} jobs={plot.jobs} onClose={() => setDetailCharId(null)} />
      {roomSheet === "affection" && <AffectionSheet characters={characters} affection={affection} onClose={() => setRoomSheet(null)} />}
      {roomSheet === "jobs" && <JobsSheet jobs={plot.jobs} characters={characters} jobsDoneToday={jobsDoneToday} onDoJob={doJob} onClose={() => setRoomSheet(null)} />}
      {roomSheet === "shop" && <ShopSheet items={plot.shopItems} credits={credits} onBuy={buyItem} onClose={() => setRoomSheet(null)} />}
      {roomSheet === "inventory" && <InventorySheet inventory={inventory} characters={characters} onUse={useItem} onGive={giveGift} onClose={() => setRoomSheet(null)} />}
      {roomSheet === "bookmarks" && (
        <BookmarksSheet
          bookmarks={bookmarks} messages={messages} characters={characters}
          onJump={jumpToMessage}
          onRemove={async (id) => { const next = bookmarks.filter((b) => b.id !== id); setBookmarks(next); await persistFull({ bookmarks: next }); }}
          onClose={() => setRoomSheet(null)}
        />
      )}
    </div>
  );
}

.lt-chat-scroll { position:relative; z-index:1; flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:14px; }
.lt-narration { display:flex; align-items:flex-start; gap:7px; background:rgba(22,22,28,0.85); border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:12px; color:var(--muted); font-style:italic; line-height:1.6; }
.lt-narration svg { flex-shrink:0; margin-top:2px; }

.lt-turn-row { display:flex; align-items:flex-start; gap:8px; max-width:92%; }
.lt-turn-row.user { align-self:flex-end; flex-direction:row-reverse; text-align:right; }
.lt-turn-row.char { align-self:flex-start; }
.lt-turn-text { display:flex; flex-direction:column; gap:2px; }
.lt-turn-row.user .lt-turn-text { align-items:flex-end; }
.lt-turn-name { font-size:11px; font-weight:700; color:var(--accent); }
.lt-turn-row.user .lt-turn-name { color:#c9bcff; }
.lt-turn-content { font-size:13.5px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
.lt-turn-row.user .lt-turn-content { color:#e9e4ff; }
.lt-action { color: var(--muted); font-style: italic; }
.lt-turn-actions { display:flex; gap:6px; margin-top:3px; }
.lt-msg-action { background:none; border:none; color:var(--muted); cursor:pointer; display:flex; align-items:center; padding:2px; opacity:0.7; }
.lt-msg-action:hover { opacity:1; }

.lt-typing { background:rgba(30,30,38,0.9); border:1px solid var(--border); padding:10px 13px; border-radius:16px; border-bottom-left-radius:4px; display:flex; align-items:center; gap:4px; }
.lt-typing-label { font-size:10px; color:var(--muted); margin-right:6px; }
.lt-typing span { width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:0.5; animation: lt-bounce 1.1s infinite ease-in-out; }
.lt-typing span:nth-child(2) { animation-delay:.15s; }
.lt-typing span:nth-child(3) { animation-delay:.3s; }
@keyframes lt-bounce { 0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-4px); opacity:1;} }

.lt-status-block { align-self:stretch; background:rgba(22,22,28,0.9); border:1px solid var(--border); border-left:2px solid var(--accent); border-radius:12px; padding:10px 14px; display:flex; flex-direction:column; gap:10px; font-size:12px; }
.lt-status-toggle { display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--text); font-size:12px; font-weight:700; cursor:pointer; padding:2px 0; }
.lt-status-toggle span:first-of-type { flex:1; text-align:left; }
.lt-status-scene { display:flex; flex-direction:column; gap:5px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.lt-status-row { display:flex; align-items:baseline; gap:6px; color:var(--muted); }
.lt-status-row b { color:var(--text); font-weight:700; flex-shrink:0; }
.lt-status-val { color:var(--muted); }
.lt-status-char { display:flex; flex-direction:column; gap:5px; }
.lt-status-char-name { font-weight:700; color:var(--accent); font-size:12.5px; }

.lt-detail-sheet { position:absolute; left:0; right:0; bottom:0; max-height:78%; background:var(--surface); border-top:1px solid var(--border); border-radius:20px 20px 0 0; display:flex; flex-direction:column; box-shadow:0 -12px 30px rgba(0,0,0,0.4); }
.lt-detail-head { display:flex; align-items:center; gap:12px; padding:16px; border-bottom:1px solid var(--border); }
.lt-detail-name { flex:1; font-weight:800; font-size:16px; }
.lt-detail-body { overflow-y:auto; padding:16px; }
.lt-detail-desc { font-size:13px; color:var(--text); line-height:1.6; white-space:pre-wrap; }
.lt-detail-memory-label { font-size:11.5px; font-weight:700; color:var(--muted); margin: 12px 0 6px; }
.lt-detail-search { display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:9px 12px; margin-bottom:14px; color:var(--muted); }
.lt-detail-search input { flex:1; background:none; border:none; color:var(--text); font-size:13px; outline:none; }
.lt-detail-search button { background:none; border:none; color:var(--muted); cursor:pointer; display:flex; }
.lt-memory-list { display:flex; flex-direction:column; gap:8px; list-style:none; padding:0; margin:0; }
.lt-memory-list li { font-size:12.5px; line-height:1.6; padding:9px 11px; background:var(--surface-2); border-left:2px solid var(--accent); border-radius:0 8px 8px 0; }
.lt-inventory-detail-img { width:100%; max-height:160px; object-fit:contain; border-radius:12px; background:var(--surface-2); margin-bottom:12px; }
.lt-inventory-actions { display:flex; gap:8px; margin-top:14px; }
.lt-inventory-actions .lt-btn { flex:1; justify-content:center; }

.lt-adjust-body { padding:16px; display:flex; flex-direction:column; gap:14px; align-items:center; overflow-y:auto; }
.lt-adjust-preview { width:180px; height:180px; border-radius:50%; overflow:hidden; position:relative; background:var(--surface-2); cursor:grab; touch-action:none; flex-shrink:0; }
.lt-adjust-preview img { width:100%; height:100%; object-fit:cover; user-select:none; -webkit-user-drag:none; }

.lt-credit-pill { background:var(--accent-soft); border:1px solid var(--accent); color:#fff; border-radius:12px; padding:5px 10px; font-size:12px; font-weight:700; margin-left:auto; margin-right:6px; }
.lt-affection-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
.lt-affection-row:last-of-type { border-bottom:none; }
.lt-affection-info { flex:1; min-width:0; }
.lt-affection-name { font-size:12.5px; font-weight:700; margin-bottom:4px; }
.lt-affection-bar { height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
.lt-affection-bar-fill { height:100%; border-radius:4px; transition:width .3s ease; }
.lt-affection-value { font-size:11.5px; font-weight:700; flex-shrink:0; }

.lt-job-row { display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:8px; gap:10px; }
.lt-job-name { font-size:13px; font-weight:600; }
.lt-job-companions-preview { font-size:11px; color:var(--muted); margin-top:2px; }

.lt-shop-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.lt-shop-card { display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px; cursor:pointer; }
.lt-shop-card img { width:56px; height:56px; border-radius:10px; object-fit:cover; }
.lt-shop-card-noimg { width:56px; height:56px; border-radius:10px; background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--muted); }
.lt-shop-card-name { font-size:12px; font-weight:600; text-align:center; }

.lt-gift-recipient-row { display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border); cursor:pointer; }
.lt-gift-recipient-row:last-of-type { border-bottom:none; }
.lt-gift-recipient-row span { font-size:13px; font-weight:600; }

.lt-bookmark-row { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--border); cursor:pointer; color:var(--accent); }
.lt-bookmark-row:last-of-type { border-bottom:none; }
.lt-bookmark-text { flex:1; min-width:0; }
.lt-bookmark-speaker { font-size:11.5px; font-weight:700; color:var(--text); }
.lt-bookmark-preview { font-size:11.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lt-bookmark-row button { background:none; border:none; color:var(--muted); cursor:pointer; }

.lt-delete-select { border-radius:12px; cursor:pointer; transition:background .15s; padding:2px; }
.lt-delete-select:hover { background:rgba(124,92,255,0.08); }
.lt-delete-select.selected { background:rgba(229,96,122,0.16); outline:1px solid var(--danger); }
.lt-delete-bar { justify-content:space-between; }
.lt-highlight { animation: lt-highlight-pulse 1.6s ease; border-radius:12px; }
@keyframes lt-highlight-pulse { 0%,100%{ background:transparent; } 30%{ background:rgba(124,92,255,0.25); } }

.lt-input-bar { display:flex; align-items:center; gap:7px; padding:10px 12px; border-top:1px solid var(--border); flex-shrink:0; }
.lt-action-toggle { width:34px; height:34px; border-radius:50%; flex-shrink:0; background:var(--surface-2); border:1px solid var(--border); color:var(--muted); font-weight:800; font-size:16px; cursor:pointer; }
.lt-action-toggle.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.lt-input-bar input { flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:20px; padding:10px 15px; font-size:13px; outline:none; font-family:inherit; min-width:0; }
.lt-input-bar input:focus { border-color: var(--accent); }
.lt-send { width:36px; height:36px; border-radius:50%; flex-shrink:0; background:linear-gradient(135deg,var(--accent),#6a4ae0); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.lt-send:disabled { opacity:0.6; }

.lt-toast { position:absolute; bottom:78px; left:50%; transform:translateX(-50%); background:#26262f; border:1px solid var(--border); color:#fff; font-size:12px; padding:9px 16px; border-radius:20px; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,0.4); }

.lt-confirm-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.55); z-index:80; display:flex; align-items:center; justify-content:center; padding:24px; }
.lt-confirm-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px 18px 16px; width:100%; max-width:280px; box-shadow:0 12px 30px rgba(0,0,0,0.5); }
.lt-confirm-msg { font-size:13.5px; line-height:1.6; margin-bottom:16px; text-align:center; }
.lt-confirm-actions { display:flex; gap:8px; }
.lt-confirm-actions .lt-btn { flex:1; justify-content:center; }
`;

/* ============================================================
   API 키 입력 화면 - 독립 실행(GitHub Pages 등)용
============================================================ */
function ApiKeyGate() {
  const [key, setKey] = useState(getApiKey());
  const [saved, setSaved] = useState(!!getApiKey());
  const [showChange, setShowChange] = useState(false);

  if (saved && !showChange) {
    return (
      <div style={{ position: "relative", width: "100%", height: "100%" }}>
        <LampTalkApp />
        <button
          onClick={() => setShowChange(true)}
          style={{
            position: "fixed", right: 10, bottom: 10, zIndex: 999,
            width: 30, height: 30, borderRadius: "50%", background: "#1e1e26",
            border: "1px solid #2a2a34", color: "#8d8b9c", fontSize: 13, opacity: 0.55,
          }}
          title="API 키 변경"
        >⚙</button>
      </div>
    );
  }

  return (
    <div style={{
      minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center",
      justifyContent: "center", padding: 24, background: "#0a0a0e", color: "#f2f1f5",
      fontFamily: "'Pretendard','Noto Sans KR',-apple-system,sans-serif", gap: 14, textAlign: "center",
    }}>
      <div style={{ fontSize: 28 }}>✨</div>
      <h2 style={{ margin: 0 }}>램프토크 - API 키 설정</h2>
      <p style={{ color: "#8d8b9c", fontSize: 13, lineHeight: 1.6, maxWidth: 320 }}>
        Google AI Studio에서 발급받은 본인 Gemini API 키를 입력하세요.<br />
        이 키는 이 브라우저(폰)에만 저장되고, 절대 다른 곳으로 전송되지 않아요.<br />
        <b style={{ color: "#e5607a" }}>이 페이지 링크를 절대 남에게 공유하지 마세요.</b>
      </p>
      <input
        value={key}
        onChange={(e) => setKey(e.target.value)}
        placeholder="Gemini API 키"
        style={{
          width: "100%", maxWidth: 320, background: "#16161c", border: "1px solid #2a2a34",
          color: "#f2f1f5", borderRadius: 12, padding: "12px 14px", fontSize: 14, outline: "none",
        }}
      />
      <button
        onClick={() => { localStorage.setItem("lamptalk:apiKey", key.trim()); setSaved(true); setShowChange(false); }}
        disabled={!key.trim()}
        style={{
          background: "linear-gradient(135deg,#7c5cff,#6a4ae0)", border: "none", color: "#fff",
          borderRadius: 12, padding: "12px 24px", fontSize: 14, fontWeight: 700, cursor: "pointer",
          opacity: key.trim() ? 1 : 0.5,
        }}
      >저장하고 시작하기</button>
      {saved && (
        <button onClick={() => setShowChange(false)} style={{ background: "none", border: "none", color: "#8d8b9c", fontSize: 12.5, textDecoration: "underline", cursor: "pointer" }}>
          취소
        </button>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ApiKeyGate />);
</script>
</body>
</html>
