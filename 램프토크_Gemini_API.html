/* ---------------- API ---------------- */
function getApiKey() {
  return localStorage.getItem("lamptalk:apiKey") || "";
}
function apiHeaders() {
  return {
    "Content-Type": "application/json",
    "x-goog-api-key": getApiKey(),
  };
}
async function callClaude(system, messages, maxTokens = 1000) {
  if (!getApiKey()) throw new Error("API 키가 설정되지 않았어요. 설정에서 키를 입력해주세요.");
  const safeMessages = messages && messages.length > 0 ? messages : [{ role: "user", content: "..." }];
  const contents = safeMessages.map((message) => ({
    role: message.role === "assistant" ? "model" : "user",
    parts: [{ text: typeof message.content === "string" ? message.content : JSON.stringify(message.content) }],
  }));
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`, {
    method: "POST",
    headers: apiHeaders(),
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: system || "" }] },
      contents,
      generationConfig: {
        maxOutputTokens: maxTokens,
        thinkingConfig: { thinkingLevel: maxTokens <= 300 ? "minimal" : "low" },
      },
    }),
  });
  if (!res.ok) {
    let detail = "";
    try {
      const errJson = await res.json();
      detail = errJson?.error?.message || errJson?.error?.status || "";
    } catch { /* 응답 본문이 JSON이 아닐 수 있음 */ }
    throw new Error(`API 요청 실패 (${res.status})${detail ? ": " + detail : ""}`);
  }
  const data = await res.json();
  const text = (data.candidates || [])
    .flatMap((candidate) => candidate?.content?.parts || [])
    .map((part) => (typeof part?.text === "string" ? part.text : ""))
    .filter(Boolean)
    .join("\n")
    .trim();
  if (!text) {
    const reason = data?.promptFeedback?.blockReason || data?.candidates?.[0]?.finishReason || "빈 응답";
    throw new Error(`Gemini 응답을 받아오지 못했어요: ${reason}`);
  }
  return text;
}

// 한 번 실패해도 잠깐 쉬었다가 다시 시도 - 일시적인 서버/네트워크 오류에 대비 (최대 3번 시도)
async function callClaudeWithRetry(system, messages, maxTokens = 1000, retriesLeft = 2, attempt = 0) {
  try {
    return await callClaude(system, messages, maxTokens);
  } catch (e) {
    if (retriesLeft > 0) {
      await new Promise((r) => setTimeout(r, 900 * (attempt + 1)));
      return callClaudeWithRetry(system, messages, maxTokens, retriesLeft - 1, attempt + 1);
    }
    throw e;
  }
}

async function detectGiftFromReply(reply) {
  const triggerWords = ["선물", "건네", "줄게", "받아", "선물이야", "선물해", "선물로", "줄까"];

  try {
    const raw = await callClaude(sys, [{ role: "user", content: `대사: ${reply}` }], 30);
    const t = raw.trim().replace(/^["'“”]+|["'“”]+$/g, "");
    if (!t || t.toUpperCase() === "NONE") return null;
    return t.slice(0, 20);
  } catch (e) { console.error(e); return null; }
}

function normalizeHistory(raw) {
  const arr = [...raw];
  while (arr.length && arr[0].role === "assistant") arr.shift();
  const merged = [];
  for (const m of arr) {
    if (merged.length && merged[merged.length - 1].role === m.role) {
      merged[merged.length - 1].content += "\n" + m.content;
    } else {
      merged.push({ role: m.role, content: m.content });
    }
  }
  return merged;
}

function getLoreContext(loreBooks, text) {
  if (!text) return "";
  const hits = [];
  for (const lb of loreBooks) {
    for (const entry of lb.entries || []) {
      if ((entry.keywords || []).some((k) => k && text.includes(k))) {
        hits.push(`- ${entry.title ? entry.title + ": " : ""}${entry.content}`);
      }
    }
  }
  return hits.slice(0, 10).join("\n");
}

function parseScriptedInput(raw, characters) {
  const lines = raw.split("\n");
  const segments = [];
  let buffer = [];
  const flushUser = () => {
    if (buffer.length) { segments.push({ type: "user", content: buffer.join("\n") }); buffer = []; }
  };
  for (const line of lines) {
    const m = line.match(/^@([^:：]+)[:：]\s*(.*)$/);
    if (m) {
      const nameRaw = m[1].trim();
      const char = characters.find((c) => c.name === nameRaw) ||
        characters.find((c) => c.name.startsWith(nameRaw) || nameRaw.startsWith(c.name));
      if (char && m[2].trim()) {
        flushUser();
        segments.push({ type: "character", characterId: char.id, content: m[2].trim() });
        continue;
      }
    }
    buffer.push(line);
  }
  flushUser();
  return segments;
}

/* ---------------- 배경(장면) 상태 - 날짜/시간은 코드로 직접 계산 ---------------- */
function nowDateTime() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  return { date: `${y}-${m}-${d}`, time: `${hh}:${mm}` };
}
function formatDateLabel(dateStr) {
  if (!dateStr) return "";
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, (m || 1) - 1, d || 1);
  return `${dateStr}(${days[dt.getDay()]})`;
}
function advanceClock(dateStr, timeStr, deltaMinutes) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const [hh, mm] = timeStr.split(":").map(Number);
  const dt = new Date(y, m - 1, d, hh, mm);
  dt.setMinutes(dt.getMinutes() + deltaMinutes);
  const ny = dt.getFullYear(), nm = String(dt.getMonth() + 1).padStart(2, "0"), nd = String(dt.getDate()).padStart(2, "0");
  const nh = String(dt.getHours()).padStart(2, "0"), nmin = String(dt.getMinutes()).padStart(2, "0");
  return { date: `${ny}-${nm}-${nd}`, time: `${nh}:${nmin}` };
}
function DEFAULT_SCENE() {
  const { date, time } = nowDateTime();
  return { date, time, location: "", weather: "", situation: "" };
}

// 장소/날씨는 실제로 바뀌었다는 신호가 없으면 그대로 유지, 상황만 매번 새로 요약
async function advanceAndDescribeScene(prevScene, recentText, showToast) {
  const deltaMinutes = 2 + Math.floor(Math.random() * 7);
  const fallback = nowDateTime();
  const baseDate = prevScene?.date || fallback.date;
  const baseTime = /^\d{1,2}:\d{2}$/.test(prevScene?.time || "") ? prevScene.time : fallback.time;
  const { date, time } = advanceClock(baseDate, baseTime, deltaMinutes);
  const sys = [
    "당신은 롤플레잉 장면의 배경 정보를 관리하는 도우미입니다.",
    "아래 형식을 정확히 지켜서 라벨 뒤에만 채우고, 다른 설명은 절대 추가하지 마세요.",
    "장소: (대화 내용상 캐릭터들이 실제로 다른 장소로 이동했다면 새 장소를 쓰고, 이동하지 않았다면 정확히 \"동일\"이라고만 쓰세요)",
    "날씨: (날씨가 실제로 바뀌었다면 새 날씨를 쓰고, 아니면 정확히 \"동일\"이라고만 쓰세요)",
    "상황: (지금 이 순간 벌어지고 있는 일을 한 문장으로 요약)",
  ].join("\n");
  try {
    const raw = await callClaude(sys, [{ role: "user", content: `현재 장소: ${prevScene.location || "알 수 없음"}\n현재 날씨: ${prevScene.weather || "알 수 없음"}\n최근 대화:\n${recentText}` }], 200);
    let location = prevScene.location, weather = prevScene.weather, situation = prevScene.situation || "";
    for (const line of raw.split("\n")) {
      const m = line.match(/^([^:：]+)[:：]\s*(.*)$/);
      if (!m) continue;
      const label = m[1].trim(), val = m[2].trim();
      if (label === "장소" && val && val !== "동일") location = val;
      if (label === "날씨" && val && val !== "동일") weather = val;
      if (label === "상황" && val) situation = val;
    }
    return { date, time, location, weather, situation };
  } catch (e) {
    console.error(e);
    showToast?.("배경 상태를 갱신하지 못했어요");
    return { date, time, location: prevScene.location, weather: prevScene.weather, situation: prevScene.situation || "" };
  }
}

    const result = { characterId: character.id, name: character.name };
    for (const line of raw.split("\n")) {
      const m = line.match(/^([^:：]+)[:：]\s*(.*)$/);
      if (!m) continue;
      const key = labelToKey[m[1].trim()];
      if (key && m[2].trim()) result[key] = m[2].trim();
    }
    return Object.keys(result).length > 2 ? result : null;
  } catch (e) {
    console.error(e);
    showToast?.(`${character.name} 상태를 정리하지 못했어요`);
    return null;
  }
}

/* ---------------- storage (독립 실행용: localStorage 사용) ---------------- */
const LS_PREFIX = "lamptalk:";
async function storeGet(key) {
  try { const v = localStorage.getItem(LS_PREFIX + key); return v ? JSON.parse(v) : null; }
  catch { return null; }
}
async function storeSet(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); return true; }
  catch (e) { console.error("storage set failed", e); return false; }
}
async function storeDelete(key) {
  try { localStorage.removeItem(LS_PREFIX + key); } catch { /* ignore */ }
}
async function storeListPrefix(prefix) {
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(LS_PREFIX + prefix)) keys.push(k.slice(LS_PREFIX.length));
    }
    return keys;
  } catch { return []; }
}

// 사이트를 나가거나 새 버전으로 넘어가도 잃어버리지 않게, 모든 데이터를 코드 하나로 내보내고/불러오기
async function exportAllData() {
  const [profileKeys, plotKeys, loreKeys, chatKeys] = await Promise.all([
    storeListPrefix("profile:"), storeListPrefix("plot:"), storeListPrefix("lore:"), storeListPrefix("chat:"),
  ]);
  const allKeys = [...profileKeys, ...plotKeys, ...loreKeys, ...chatKeys];
  const data = {};
  for (const k of allKeys) {
    const v = await storeGet(k);
    if (v !== null) data[k] = v;
  }
  const json = JSON.stringify({ v: 1, data });
  return btoa(unescape(encodeURIComponent(json)));
}
async function importAllData(code) {
  const json = decodeURIComponent(escape(atob(code.trim())));
  const parsed = JSON.parse(json);
  if (!parsed || typeof parsed.data !== "object") throw new Error("invalid backup code");
  for (const [k, v] of Object.entries(parsed.data)) {
    await storeSet(k, v);
  }
}

/* ---------------- image resize ---------------- */
function resizeImageFile(file, maxDim = 360, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height) {
          if (width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height); height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
const makeImgObj = (src) => ({ id: genId(), src, scale: 1, x: 50, y: 50 });
function normalizeImg(image) {
  if (!image) return null;
  if (typeof image === "string") return { src: image, scale: 1, x: 50, y: 50 };
  if (image.src) return { src: image.src, scale: image.scale || 1, x: image.x ?? 50, y: image.y ?? 50 };
  return null;
}

/* ============================================================
   ROOT APP
============================================================ */
function LampTalkApp() {
  const [activeTab, setActiveTab] = useState("home");
  const [stack, setStack] = useState([]);
  const [profiles, setProfiles] = useState([]);
  const [plots, setPlots] = useState([]);
  const [loreBooks, setLoreBooks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState(null);
  const [confirmReq, setConfirmReq] = useState(null); // { message, onYes }
  const toastTimer = useRef(null);

  const askConfirm = useCallback((message, onYes) => setConfirmReq({ message, onYes }), []);

  const showToast = useCallback((msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 1800);
  }, []);

  const refresh = useCallback(async () => {
    setLoading(true);
    const [profileKeys, plotKeys, loreKeys] = await Promise.all([
      storeListPrefix("profile:"), storeListPrefix("plot:"), storeListPrefix("lore:"),
    ]);
    let profs = (await Promise.all(profileKeys.map(storeGet))).filter(Boolean);
    if (profs.length === 0) {
      const def = { id: genId(), name: "나", description: "", createdAt: Date.now() };
      await storeSet(`profile:${def.id}`, def);
      profs = [def];
    }
    const plts = (await Promise.all(plotKeys.map(storeGet))).filter(Boolean)
      .sort((a, b) => (b.lastMessageAt || b.createdAt) - (a.lastMessageAt || a.createdAt));
    const lores = (await Promise.all(loreKeys.map(storeGet))).filter(Boolean)
      .sort((a, b) => a.createdAt - b.createdAt);
    setProfiles(profs); setPlots(plts); setLoreBooks(lores);
    setLoading(false);
  }, []);

  useEffect(() => { refresh(); }, [refresh]);

  const push = (o) => setStack((s) => [...s, o]);
  const pop = () => setStack((s) => s.slice(0, -1));
  const popAll = () => setStack([]);
  const goTab = (t) => { setActiveTab(t); popAll(); };

  const patchPlot = async (plot) => {
    await storeSet(`plot:${plot.id}`, plot);
    setPlots((prev) => {
      const rest = prev.filter((p) => p.id !== plot.id);
      return [plot, ...rest].sort((a, b) => (b.lastMessageAt || b.createdAt) - (a.lastMessageAt || a.createdAt));
    });
    return plot;
  };
  const deletePlot = async (id) => {
    await storeDelete(`plot:${id}`);
    await storeDelete(`chat:${id}`);
    setPlots((prev) => prev.filter((p) => p.id !== id));
    popAll();
    showToast("대화방을 삭제했어요");
  };
  const patchProfile = async (profile) => {
    await storeSet(`profile:${profile.id}`, profile);
    setProfiles((prev) => {
      const exists = prev.some((p) => p.id === profile.id);
      return exists ? prev.map((p) => (p.id === profile.id ? profile : p)) : [...prev, profile];
    });
    return profile;
  };
  const patchLore = async (lb) => {
    await storeSet(`lore:${lb.id}`, lb);
    setLoreBooks((prev) => {
      const exists = prev.some((l) => l.id === lb.id);
      return exists ? prev.map((l) => (l.id === lb.id ? lb : l)) : [...prev, lb];
    });
    return lb;
  };
  const deleteLore = async (id) => {
    await storeDelete(`lore:${id}`);
    setLoreBooks((prev) => prev.filter((l) => l.id !== id));
  };

  const openProfileForm = (profileId) => push({ screen: "profileform", profileId });

  return (
    <div className="lt-app">
      <style>{CSS}</style>
      {stack.length === 0 && <TopBar tab={activeTab} onOpenBackup={() => push({ screen: "backup" })} />}

      <div className="lt-content">
        {stack.length === 0 && activeTab === "home" && (
          <HomeScreen plots={plots} loading={loading}
            onOpenRoom={(id) => push({ screen: "chatroom", plotId: id })}
            onNewPlot={() => push({ screen: "plotform" })} />
        )}
        {stack.length === 0 && activeTab === "chats" && (
          <ChatsListScreen plots={plots} loading={loading}
            onOpenRoom={(id) => push({ screen: "chatroom", plotId: id })}
            onDeleteRoom={deletePlot}
            askConfirm={askConfirm}
            onNewPlot={() => push({ screen: "plotform" })} />
        )}
        {stack.length === 0 && activeTab === "create" && (
          <CreateListScreen plots={plots} loading={loading}
            onNewPlot={() => push({ screen: "plotform" })}
            onEditPlot={(id) => push({ screen: "plotform", plotId: id })}
            onOpenRoom={(id) => push({ screen: "chatroom", plotId: id })}
            askConfirm={askConfirm}
            onDeletePlot={deletePlot} />
        )}

        {stack.map((layer, idx) => (
          <div className="lt-overlay-layer" key={idx} style={{ zIndex: 10 + idx }}>
            {layer.screen === "plotform" && (
              <PlotForm
                plotId={layer.plotId}
                plots={plots}
                profiles={profiles}
                loreBooks={loreBooks}
                onBack={pop}
                onSaved={async (plot, openRoom) => {
                  await patchPlot(plot);
                  if (openRoom) setStack([{ screen: "chatroom", plotId: plot.id }]);
                  else pop();
                  showToast("저장했어요");
                }}
                onDelete={layer.plotId ? () => {
                  askConfirm("이 플롯과 대화 기록을 삭제할까요?", () => deletePlot(layer.plotId));
                } : null}
                onOpenProfileForm={openProfileForm}
                onSaveLore={patchLore}
                onDeleteLore={deleteLore}
                askConfirm={askConfirm}
                showToast={showToast}
              />
            )}
            {layer.screen === "chatroom" && (
              <ChatRoom
                plot={plots.find((p) => p.id === layer.plotId)}
                profiles={profiles}
                loreBooks={loreBooks}
                onBack={pop}
                onExitToList={() => { popAll(); setActiveTab("chats"); }}
                onPlotUpdated={patchPlot}
                onDeleteRoom={deletePlot}
                onOpenProfileForm={openProfileForm}
                showToast={showToast}
              />
            )}
            {layer.screen === "profileform" && (
              <ProfileForm profileId={layer.profileId} profiles={profiles} onBack={pop}
                onSaved={async (profile) => { await patchProfile(profile); pop(); showToast("대화 프로필을 저장했어요"); }} />
            )}
            {layer.screen === "backup" && (
              <BackupScreen onBack={pop} showToast={showToast}
                onImported={async () => { await refresh(); pop(); showToast("불러왔어요"); }} />
            )}
          </div>
        ))}
      </div>

      {stack.length === 0 && <BottomNav active={activeTab} onChange={goTab} />}
      {confirmReq && (
        <div className="lt-confirm-overlay" onClick={() => setConfirmReq(null)}>
          <div className="lt-confirm-box" onClick={(e) => e.stopPropagation()}>
            <div className="lt-confirm-msg">{confirmReq.message}</div>
            <div className="lt-confirm-actions">
              <button className="lt-btn" onClick={() => setConfirmReq(null)}>취소</button>
              <button className="lt-btn danger" onClick={() => { const f = confirmReq.onYes; setConfirmReq(null); f?.(); }}>확인</button>
            </div>
          </div>
        </div>
      )}
      <Toast toast={toast} />
    </div>
  );
}

function PlotForm({ plotId, plots, profiles, loreBooks, onBack, onSaved, onDelete,
  onOpenProfileForm, onSaveLore, onDeleteLore, askConfirm, showToast }) {
  const initial = plotId ? plots.find((p) => p.id === plotId) : null;

  const [title, setTitle] = useState(initial?.title || "");
  const [description, setDescription] = useState(initial?.description || "");
  const [intro, setIntro] = useState(initial?.intro || "");
  const [characters, setCharacters] = useState(initial?.characters || []);
  const [loreIds, setLoreIds] = useState(initial?.loreIds || []);
  const [styleConfig, setStyleConfig] = useState(initial?.styleConfig || DEFAULT_STYLE_CONFIG);
  const [shopItems, setShopItems] = useState(initial?.shopItems || []);
  const [jobs, setJobs] = useState(initial?.jobs || []);
  const [defaultProfileId, setDefaultProfileId] = useState(initial?.defaultProfileId || profiles[0]?.id || "");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [editingCharId, setEditingCharId] = useState(null);
  const [subScreen, setSubScreen] = useState(null);
  const [editingLoreId, setEditingLoreId] = useState(null);

  const sectionRefs = { info: useRef(null), chars: useRef(null) };
  const scrollTo = (key) => sectionRefs[key]?.current?.scrollIntoView({ behavior: "smooth", block: "start" });

  const isNew = !initial;
  const save = async () => {
    if (!title.trim()) { setError("제목을 입력해주세요."); scrollTo("info"); return; }
    if (characters.length === 0) { setError("캐릭터를 1명 이상 추가해주세요."); scrollTo("chars"); return; }
    setError("");
    setSaving(true);
    const plot = {
      id: initial?.id || genId(),
      title: title.trim(), description: description.trim(), intro: intro.trim(),
      characters, loreIds, styleConfig,
      shopItems, jobs,
      defaultProfileId,
      lastMessage: initial?.lastMessage || "", lastMessageAt: initial?.lastMessageAt || null,
      createdAt: initial?.createdAt || Date.now(),
    };
    // 새로 만드는 플롯일 때만 저장 후 바로 대화방으로 이동해요.
    // 기존 플롯을 수정할 때는 대화방을 다시 불러오지 않고 그대로 목록으로 돌아가서,
    // 진행 중이던 대화 내용이 절대 초기화되지 않게 해요.
    await onSaved(plot, isNew);
    setSaving(false);
  };

  const upsertCharacter = (char) => {
    setCharacters((prev) => {
      const exists = prev.some((c) => c.id === char.id);
      return exists ? prev.map((c) => (c.id === char.id ? char : c)) : [...prev, char];
    });
    setEditingCharId(null);
  };
  const removeCharacterById = (id) => setCharacters((prev) => prev.filter((c) => c.id !== id));

function ImageAdjustSheet({ image, onChange, onClose }) {
  const dragRef = useRef(null);
  const dragging = useRef(false);
  const start = useRef({ x: 0, y: 0, origX: 50, origY: 50 });

  const posFromEvent = (e) => (e.touches ? e.touches[0] : e);
  const onDown = (e) => {
    dragging.current = true;
    const p = posFromEvent(e);
    start.current = { x: p.clientX, y: p.clientY, origX: image.x, origY: image.y };
  };
  const onMove = (e) => {
    if (!dragging.current || !dragRef.current) return;
    const p = posFromEvent(e);
    const rect = dragRef.current.getBoundingClientRect();
    const dx = ((p.clientX - start.current.x) / rect.width) * 100;
    const dy = ((p.clientY - start.current.y) / rect.height) * 100;
    const nx = Math.min(100, Math.max(0, start.current.origX - dx));
    const ny = Math.min(100, Math.max(0, start.current.origY - dy));
    onChange({ x: nx, y: ny });
  };
  const onUp = () => { dragging.current = false; };

  return (
    <div className="lt-menu-overlay" onClick={onClose}>
      <div className="lt-detail-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="lt-detail-head">
          <div className="lt-detail-name">사진 위치 조정</div>
          <button className="lt-iconbtn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="lt-adjust-body">
          <div className="lt-adjust-preview" ref={dragRef}
            onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
            onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}>
            <img src={image.src} alt="" draggable={false}
              style={{ objectPosition: `${image.x}% ${image.y}%`, transform: `scale(${image.scale})` }} />
          </div>
          <div className="lt-muted" style={{ textAlign: "center" }}>동그란 원 안에서 사진을 드래그해 위치를 맞춰보세요</div>
          <label className="lt-field" style={{ width: "100%" }}>
            <span>확대/축소</span>
            <input type="range" min="1" max="2.5" step="0.05" value={image.scale}
              onChange={(e) => onChange({ scale: parseFloat(e.target.value) })} />
          </label>
          <button className="lt-btn primary" style={{ justifyContent: "center", width: "100%" }} onClick={onClose}><Check size={15} /> 완료</button>
        </div>
      </div>
    </div>
  );
}

function CharacterEditor({ initial, onCancel, onSave, onDelete, showToast }) {
  const [name, setName] = useState(initial?.name || "");
  const [description, setDescription] = useState(initial?.description || "");
  const [images, setImages] = useState((initial?.images || []).map((img) => (typeof img === "string" ? makeImgObj(img) : img)));
  const [uploading, setUploading] = useState(false);
  const [adjustingId, setAdjustingId] = useState(null);
  const fileRef = useRef(null);
  const charId = useRef(initial?.id || genId());

  const onPickFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (files.length === 0) return;
    const room = MAX_IMAGES - images.length;
    if (room <= 0) { showToast?.(`이미지는 최대 ${MAX_IMAGES}장까지 추가할 수 있어요`); return; }
    setUploading(true);
    try {
      const resized = await Promise.all(files.slice(0, room).map((f) => resizeImageFile(f)));
      setImages((prev) => [...prev, ...resized.map(makeImgObj)]);
    } catch (err) { console.error(err); showToast?.("이미지를 불러오지 못했어요"); }
    finally { setUploading(false); }
  };
  const updateImage = (id, patch) => setImages((prev) => prev.map((im) => (im.id === id ? { ...im, ...patch } : im)));
  const removeImage = (id) => setImages((prev) => prev.filter((im) => im.id !== id));
  const submit = () => {
    if (!name.trim()) { showToast?.("캐릭터 이름을 입력해주세요"); return; }
    onSave({ id: charId.current, name: name.trim(), description: description.trim(), images });
  };
  const adjusting = images.find((im) => im.id === adjustingId);

  return (
    <div className="lt-char-editor">
      <div className="lt-char-editor-images">
        {images.map((im) => (
          <div key={im.id} className="lt-char-editor-thumb">
            <img src={im.src} alt="" style={{ objectPosition: `${im.x}% ${im.y}%`, transform: `scale(${im.scale})` }} />
            <button className="lt-thumb-adjust" onClick={() => setAdjustingId(im.id)} title="사진 위치/크기 조정"><Crop size={11} /></button>
            <button className="lt-thumb-remove" onClick={() => removeImage(im.id)}><X size={11} /></button>
          </div>
        ))}
        {images.length < MAX_IMAGES && (
          <button className="lt-char-editor-add" onClick={() => fileRef.current?.click()} disabled={uploading}>
            {uploading ? <Loader2 size={18} className="lt-spin" /> : <Camera size={18} />}
            <span>{images.length}/{MAX_IMAGES}</span>
            <span className="lt-tiny">캐릭터 이미지</span>
          </button>
        )}
        <input ref={fileRef} type="file" accept="image/*" multiple style={{ display: "none" }} onChange={onPickFiles} />
      </div>
      <label className="lt-field">
        <span>이름 <em>({name.length}/10)</em></span>
        <input value={name} onChange={(e) => setName(e.target.value.slice(0, 10))} placeholder="짧은 이름이 부르기 편해요. 예) 수현" />
      </label>
      <label className="lt-field">
        <span>설명</span>
        <textarea value={description} onChange={(e) => setDescription(e.target.value)} rows={4}
          placeholder="캐릭터의 성격, 말투, 행동, 감정 표현에 대해 써주시면 개성 있는 캐릭터를 만들 수 있어요." />
      </label>
      <div className="lt-form-actions">
        <button className="lt-btn primary" onClick={submit}><Check size={15} /> {initial ? "수정 완료" : "추가하기"}</button>
        <button className="lt-btn" onClick={onCancel}>취소</button>
        {onDelete && <button className="lt-btn danger" onClick={onDelete}><Trash2 size={15} /></button>}
      </div>
      {adjusting && <ImageAdjustSheet image={adjusting} onChange={(patch) => updateImage(adjustingId, patch)} onClose={() => setAdjustingId(null)} />}
    </div>
  );
}

  const [busy, setBusy] = useState(false);
  const [code, setCode] = useState("");
  const codeRef = useRef(null);
  const fileRef = useRef(null);

  const downloadBackup = async () => {
    setBusy(true);
    try {
      const c = await exportAllData();
      const blob = new Blob([c], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `lamptalk-backup-${Date.now()}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast?.("백업 파일을 다운로드했어요");
    } catch (e) {
      console.error(e);
      showToast?.("다운로드에 실패했어요. 아래 '코드로 보기'를 이용해주세요.");
    }
    setBusy(false);
  };
  const showAsCode = async () => {
    setBusy(true);
    try {
      const c = await exportAllData();
      setCode(c);
      setTimeout(() => { codeRef.current?.focus(); codeRef.current?.select(); }, 50);
    } catch (e) { console.error(e); showToast?.("백업 코드를 만들지 못했어요"); }
    setBusy(false);
  };
  const onPickBackupFile = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    setBusy(true);
    try {
      const text = await file.text();
      await importAllData(text);
      onImported?.();
    } catch (err) {
      console.error(err);
      showToast?.("파일을 불러오지 못했어요. 백업 파일이 맞는지 확인해주세요.");
    }
    setBusy(false);
  };
  const [importText, setImportText] = useState("");
  const doImportText = async () => {
    if (!importText.trim()) return;
    setBusy(true);
    try { await importAllData(importText); onImported?.(); }
    catch (e) {
      console.error(e);
      showToast?.("코드를 불러오지 못했어요. 코드 전체가 빠짐없이 붙여넣어졌는지 확인해주세요.");
    }
    setBusy(false);
  };

  return (
    <div className="lt-screen-full">
      <div className="lt-form-topbar">
        <button className="lt-iconbtn" onClick={onBack}><ChevronLeft size={20} /></button>
        <div className="lt-form-topbar-title">데이터 백업 / 복원</div>
        <div style={{ width: 32 }} />
      </div>
      <div className="lt-form-scroll">
        <div className="lt-form-section">
          <div className="lt-section-title">백업하기 (추천: 파일로 저장)</div>
          <div className="lt-muted">모든 프로필・플롯・대화 내용을 파일 하나로 저장해요. 사이트를 나가기 전에 미리 받아두세요. 모바일에서는 파일로 저장하는 쪽이 코드 복사보다 훨씬 안전해요.</div>
          <button className="lt-btn primary" onClick={downloadBackup} disabled={busy}>
            {busy ? <Loader2 size={16} className="lt-spin" /> : <Download size={16} />} 백업 파일 다운로드
          </button>
          <button className="lt-btn" onClick={showAsCode} disabled={busy}>파일 다운로드가 안 되면 코드로 보기</button>
          {code && (
            <label className="lt-field">
              <span>백업 코드 (탭하면 전체 선택돼요 — 길게 눌러 복사하세요)</span>
              <textarea ref={codeRef} readOnly value={code} rows={6} onFocus={(e) => e.target.select()} />
            </label>
          )}
        </div>
        <div className="lt-form-section">
          <div className="lt-section-title">복원하기 (추천: 백업 파일 선택)</div>
          <div className="lt-muted">저장해둔 백업 파일을 선택하면 그 시점 데이터로 복원돼요. 지금 가지고 있는 데이터는 덮어써지니 주의하세요.</div>
          <button className="lt-btn primary" onClick={() => fileRef.current?.click()} disabled={busy}>
            {busy ? <Loader2 size={16} className="lt-spin" /> : <Upload size={16} />} 백업 파일 선택해서 불러오기
          </button>
          <input ref={fileRef} type="file" accept=".txt,text/plain" style={{ display: "none" }} onChange={onPickBackupFile} />
          <label className="lt-field">
            <span>또는 백업 코드를 직접 붙여넣기</span>
            <textarea value={importText} onChange={(e) => setImportText(e.target.value)} rows={6} placeholder="여기에 백업 코드를 붙여넣으세요" />
          </label>
          <button className="lt-btn" disabled={busy || !importText.trim()} onClick={doImportText}>코드로 불러오기</button>
        </div>
      </div>
    </div>
  );
}


function ProfileForm({ profileId, profiles, onBack, onSaved }) {
  const initial = profileId ? profiles.find((p) => p.id === profileId) : null;
  const [name, setName] = useState(initial?.name || "");
  const [description, setDescription] = useState(initial?.description || "");
  const [avatar, setAvatar] = useState(initial?.avatar || "");

  const [saving, setSaving] = useState(false);

  const onPick = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    try { setAvatar(await resizeImageFile(file, 300, 0.7)); } catch (err) { console.error(err); }
  };
  const submit = async () => {
    if (!name.trim()) return;
    setSaving(true);
    await onSaved({ id: initial?.id || genId(), name: name.trim(), description: description.trim(), avatar, createdAt: initial?.createdAt || Date.now() });
    setSaving(false);

  return (
    <div className="lt-screen-full">
      <div className="lt-form-topbar">
        <button className="lt-iconbtn" onClick={onBack}><ChevronLeft size={20} /></button>

          <div className="lt-profile-avatar-wrap" onClick={() => fileRef.current?.click()}>
            <Avatar name={name || "?"} image={avatar} size={84} />
            <div className="lt-profile-avatar-edit"><Camera size={13} /></div>
          </div>
          <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }} onChange={onPick} />
          <label className="lt-field" style={{ width: "100%" }}>
            <span>이름 <em>캐릭터가 날 이렇게 부를 거예요</em></span>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="이름을 입력해주세요" />

          <label className="lt-field" style={{ width: "100%" }}>
            <span>설명 <em>(선택)</em></span>
            <textarea value={description} onChange={(e) => setDescription(e.target.value)} rows={4} placeholder="나이, 성격, 캐릭터와의 관계 등을 적어두면 대화에 자연스럽게 반영돼요." />

  );

function LorePicker({ selectedIds, onChange, loreBooks, onBack, onCreateNew, onEdit, onDelete }) {
  const toggle = (id) => {
    const set = new Set(selectedIds || []);
    if (set.has(id)) set.delete(id);
    else { if (set.size >= MAX_LORE) return; set.add(id); }
    onChange(Array.from(set));
  };
  return (
    <div className="lt-screen-full">
      <div className="lt-form-topbar">
        <button className="lt-iconbtn" onClick={onBack}><ChevronLeft size={20} /></button>
        <div className="lt-form-topbar-title">로어북 연결</div>
        <div style={{ width: 32 }} />
      </div>
      <div className="lt-form-scroll">
        <div className="lt-form-section">
          <button className="lt-add-char-tile" onClick={onCreateNew}><Plus size={18} /><span>새 로어북 만들기</span></button>
          {loreBooks.length === 0 && <div className="lt-empty-block">아직 만든 로어북이 없어요.<br />나만의 세계관을 로어북에 담아보세요.</div>}
          <div className="lt-lore-pick-list">
            {loreBooks.map((lb) => (
              <div key={lb.id} className={"lt-lore-pick-item" + ((selectedIds || []).includes(lb.id) ? " on" : "")} onClick={() => toggle(lb.id)}>
                <div>
                  <div className="lt-lore-pick-title">{lb.title}</div>
                  <div className="lt-lore-pick-sub">{lb.shortDesc || `${lb.entries?.length || 0}개 항목`}</div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  {(selectedIds || []).includes(lb.id) && <Check size={16} />}
                  <button className="lt-iconbtn ghost" onClick={(e) => { e.stopPropagation(); onEdit(lb.id); }}><Edit2 size={13} /></button>
                  <button className="lt-iconbtn ghost" onClick={(e) => { e.stopPropagation(); onDelete(lb.id, lb.title); }}><Trash2 size={13} /></button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function LoreForm({ loreId, loreBooks, onBack, onSaved }) {
  const initial = loreId ? loreBooks.find((l) => l.id === loreId) : null;
  const [title, setTitle] = useState(initial?.title || "");
  const [shortDesc, setShortDesc] = useState(initial?.shortDesc || "");
  const [entries, setEntries] = useState(
    initial?.entries?.length
      ? initial.entries.map((e) => ({ ...e, keywords: (e.keywords || []).join(", ") }))
      : [{ id: genId(), title: "", keywords: "", content: "" }]
  );
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  const updateEntry = (idx, patch) => setEntries((prev) => prev.map((e, i) => (i === idx ? { ...e, ...patch } : e)));
  const addEntry = () => setEntries((prev) => (prev.length >= 20 ? prev : [...prev, { id: genId(), title: "", keywords: "", content: "" }]));
  const removeEntry = (idx) => setEntries((prev) => prev.filter((_, i) => i !== idx));

  const save = async () => {
    if (!title.trim()) { setError("로어북 제목을 입력해주세요."); return; }
    const clean = entries
      .map((e) => ({ id: e.id, title: e.title.trim(), keywords: e.keywords.split(",").map((k) => k.trim()).filter(Boolean), content: e.content.trim() }))
      .filter((e) => e.keywords.length > 0 && e.content);
    if (clean.length === 0) { setError("키워드와 내용을 모두 입력한 항목이 1개 이상 필요해요."); return; }
    setError("");
    setSaving(true);
    await onSaved({ id: initial?.id || genId(), title: title.trim(), shortDesc: shortDesc.trim(), entries: clean, createdAt: initial?.createdAt || Date.now() });
    setSaving(false);
  };

  return (
    <div className="lt-screen-full">
      <div className="lt-form-topbar">
        <button className="lt-iconbtn" onClick={onBack}><ChevronLeft size={20} /></button>
        <div className="lt-form-topbar-title">로어북</div>
        <button className="lt-btn primary small" disabled={saving} onClick={save}>{saving ? <Loader2 size={14} className="lt-spin" /> : "등록"}</button>
      </div>
      <div className="lt-form-scroll">
        <div className="lt-form-section">
          <div className="lt-section-title">소개글</div>
          <div className="lt-muted">소개글은 AI에게 전달되지 않아요. 로어북을 관리하는 용도로만 사용돼요.</div>
          <label className="lt-field">
            <span>로어북 제목 <em>({title.length}/20)</em></span>
            <input value={title} onChange={(e) => setTitle(e.target.value.slice(0, 20))} placeholder="로어북 제목을 입력해주세요" />
          </label>
          <label className="lt-field">
            <span>짧은 소개 <em>({shortDesc.length}/50)</em></span>
            <textarea value={shortDesc} onChange={(e) => setShortDesc(e.target.value.slice(0, 50))} placeholder="제목과 함께 보일 짧은 소개를 입력해주세요" rows={2} />
          </label>
        </div>
        <div className="lt-form-section">
          <div className="lt-section-title">항목</div>
          <div className="lt-muted">키워드가 대화에서 언급되면 아래 내용이 AI에게 자동으로 전달돼요.</div>
          {entries.map((e, idx) => (
            <div key={e.id} className="lt-lore-entry">
              <div className="lt-lore-entry-head">
                <span>항목 {idx + 1}</span>
                {entries.length > 1 && <button onClick={() => removeEntry(idx)}><Trash2 size={13} /></button>}
              </div>
              <label className="lt-field">
                <span>제목 <em>(선택)</em></span>
                <input value={e.title} onChange={(ev) => updateEntry(idx, { title: ev.target.value.slice(0, 20) })} placeholder="제목을 입력하세요" />
              </label>
              <label className="lt-field">
                <span>키워드</span>
                <textarea value={e.keywords} onChange={(ev) => updateEntry(idx, { keywords: ev.target.value })} placeholder="키워드를 쉼표(,)로 구분해서 입력해주세요" rows={2} />
              </label>
              <label className="lt-field">
                <span>내용</span>
                <textarea value={e.content} onChange={(ev) => updateEntry(idx, { content: ev.target.value })} placeholder="키워드가 언급됐을 때 AI에게 전달할 설정을 적어주세요" rows={4} />
              </label>
            </div>
          ))}
          <button className="lt-add-char-tile" onClick={addEntry}><Plus size={18} /><span>항목 추가</span></button>
        </div>
        {error && <div className="lt-error" style={{ margin: "0 16px 16px" }}>{error}</div>}
        <div className="lt-form-bottom-actions">
          <button className="lt-btn primary" disabled={saving} onClick={save}>{saving ? <Loader2 size={16} className="lt-spin" /> : <Check size={16} />} 등록</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   캐릭터 상세 시트 (설명 / 약속 / 기억 + 검색)
============================================================ */
function CharacterDetailSheet({ character, memory, characters, jobs, onClose }) {
  const [query, setQuery] = useState("");
  if (!character) return null;
  const q = query.trim();
  const matches = (text) => !q || (text || "").includes(q);
  const sharedBullets = bulletLines(memory?.shared).filter(matches);
  const ownBullets = bulletLines(memory?.byChar?.[character.id]).filter(matches);

  const promiseLabel = (p) => {
    const others = (p.characterIds || []).filter((id) => id !== character.id).map((id) => characters.find((c) => c.id === id)?.name).filter(Boolean);
    const withParts = [...(p.withUser ? ["나"] : []), ...others];
    return withParts.length ? `${withParts.join(", ")}와(과)` : "";
  };
  const memoryPromiseItems = (memory?.promises || [])
    .filter((p) => (p.characterIds || []).includes(character.id))
    .map((p) => ({ id: p.id, label: `${promiseLabel(p)} ${p.description}`.trim(), when: p.when || "언제일지 모름" }));

  const jobPromiseItems = (jobs || [])
    .filter((j) => (j.companionIds || []).includes(character.id))
    .map((j) => {
      const names = ["나", ...(j.companionIds || []).filter((id) => id !== character.id).map((id) => characters.find((c) => c.id === id)?.name).filter(Boolean)];
      return {
        id: `job-${j.id}`,
        label: `${j.name || "일감"}(${names.join(", ")})`,
        when: j.date ? `${formatDateLabel(j.date)}${j.time ? " " + j.time : ""}` : (j.time || "예정"),
      };
    });

  const allPromises = [...jobPromiseItems, ...memoryPromiseItems];
  const filteredPromises = allPromises.filter((p) => matches(p.label) || matches(p.when));

  return (
    <div className="lt-menu-overlay" onClick={onClose}>
      <div className="lt-detail-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="lt-detail-head">
          <Avatar name={character.name} image={character.images?.[0]} size={56} />
          <div className="lt-detail-name">{character.name}</div>
          <button className="lt-iconbtn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="lt-detail-body">
          <div className="lt-detail-search">
            <Search size={14} />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="기억・약속 검색" />
            {query && <button onClick={() => setQuery("")}><X size={13} /></button>}
          </div>

          {!q && (
            <>
              <div className="lt-section-title" style={{ margin: "4px 0" }}>캐릭터 설명</div>
              <div className="lt-detail-desc">{character.description || "설명이 없어요."}</div>
            </>
          )}

          <div className="lt-section-title" style={{ margin: "16px 0 8px" }}>약속</div>
          {filteredPromises.length === 0 && <div className="lt-muted">{q ? "검색 결과가 없어요." : "아직 잡힌 약속이 없어요."}</div>}
          {filteredPromises.length > 0 && (
            <ul className="lt-memory-list">
              {filteredPromises.map((p) => <li key={p.id}><b>{p.when}</b> · {p.label}</li>)}
            </ul>
          )}

          <div className="lt-section-title" style={{ margin: "16px 0 8px" }}>기억</div>
          {ownBullets.length === 0 && sharedBullets.length === 0 && (
            <div className="lt-muted">{q ? "검색 결과가 없어요." : "아직 기억하는 내용이 없어요. 대화를 더 나눠보세요."}</div>
          )}
          {ownBullets.length > 0 && (
            <>
              <div className="lt-detail-memory-label">{character.name}만 기억하는 것</div>
              <ul className="lt-memory-list">{ownBullets.map((b, i) => <li key={i}>{b}</li>)}</ul>
            </>
          )}
          {sharedBullets.length > 0 && (
            <>
              <div className="lt-detail-memory-label">함께 기억하는 것</div>
              <ul className="lt-memory-list">{sharedBullets.map((b, i) => <li key={i}>{b}</li>)}</ul>
            </>
          )}
        </div>
      </div>
    </div>
  );
}
