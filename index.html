                <div className="lt-bookmark-text">
                  <div className="lt-bookmark-speaker">{speaker?.name || (msg.kind === "user" ? "나" : "상황")}</div>
                  <div className="lt-bookmark-preview">{(msg.content || "").slice(0, 40)}</div>
                </div>
                <button onClick={(e) => { e.stopPropagation(); onRemove(b.id); }}><X size={12} /></button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   GPS 지도 - 학원별 캐릭터 위치, 임무 현황
============================================================ */
function MapSheet({ characters, charLocations, userLocation, companionIds = [], outing, profile, onScatterOthers, onToggleCompanion, onSetUserLocation, onStartOuting, onEndOuting, onStartMission, onEndMission, onClose }) {
  const OUT_KINDS = ["당일치기", "1박 2일", "2박 3일", "3박 4일", "장기"];
  const [selectedId, setSelectedId] = useState(null);
  const [showMissions, setShowMissions] = useState(false);
  const [showMoving, setShowMoving] = useState(false);
  const [pendingMove, setPendingMove] = useState(null); // 이동 직전 "누구와 함께 갈까?" 선택 화면
  const [pickedIds, setPickedIds] = useState([]);
  const [showOuting, setShowOuting] = useState(false);
  const [showMission, setShowMission] = useState(false);
  const [missionName, setMissionName] = useState("");
  const [missionIds, setMissionIds] = useState([]);
  const [outPlace, setOutPlace] = useState("");
  const [outKind, setOutKind] = useState("당일치기");
  const [outIds, setOutIds] = useState([]);

  const charsAt = (mainId) =>
    characters.filter((c) => {
      const loc = charLocations[c.id];
      if (loc && loc.status === "mission" && loc.missionWithUser) return userLocation && userLocation.mainId === mainId;
      return loc && loc.mainId === mainId && loc.status === "here";
    });

  const withYou = (c) => {
    if (companionIds.includes(c.id)) return true;
    const loc = charLocations[c.id];
    if (loc && loc.status === "mission" && loc.missionWithUser) return true;
    return loc && loc.status === "here" && userLocation && userLocation.mainId === loc.mainId && (!userLocation.subId || userLocation.subId === loc.subId);
  };

  const labelFor = (c) => {
    const loc = charLocations[c.id];
    if (!loc) return c.name;
    if (companionIds.includes(c.id)) return `${c.name}(동행 중)`;
    if (withYou(c)) return `${c.name}(당신과 같이있음)`;
    return `${c.name}(${loc.subId || "?"})`;
  };

  const onMission = characters.filter((c) => charLocations[c.id]?.status === "mission" && !charLocations[c.id]?.missionWithUser);
  const onTheMove = characters.filter((c) => charLocations[c.id]?.status === "moving");
  const elsewhere = characters.filter((c) => {
    const l = charLocations[c.id];
    if (!l || l.status !== "here") return false;
    if (!userLocation) return false;
    return l.mainId !== userLocation.mainId;
  });
  const moving = characters.filter((c) => charLocations[c.id]?.status === "moving");

  if (showMoving) {
    return (
      <div className="lt-menu-overlay" onClick={onClose}>
        <div className="lt-detail-sheet" onClick={(e) => e.stopPropagation()}>
          <div className="lt-detail-head">
            <button className="lt-iconbtn" onClick={() => setShowMoving(false)}><ChevronLeft size={18} /></button>
            <div className="lt-detail-name">지금 이동중인 인원</div>
            <button className="lt-iconbtn" onClick={onClose}><X size={18} /></button>
          </div>
          <div className="lt-detail-body">
            {moving.length === 0 && <div className="lt-muted">지금 이동중인 캐릭터가 없어요.</div>}
            {moving.map((c) => {
              const loc = charLocations[c.id];
              const target = LOCATIONS.find((l) => l.id === loc.targetMainId);
              return (
                <div key={c.id} className="lt-map-char-row">
                  <Avatar name={c.name} image={c.images?.[0]} size={32} />
                  <span>{c.name}({target ? target.name : "다른 곳"}(으)로 이동중)</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  if (showMissions) {
    return (
      <div className="lt-menu-overlay" onClick={onClose}>
        <div className="lt-detail-sheet" onClick={(e) => e.stopPropagation()}>
          <div className="lt-detail-head">
            <button className="lt-iconbtn" onClick={() => setShowMissions(false)}><ChevronLeft size={18} /></button>
            <div className="lt-detail-name">지금 자리를 비운 인원</div>
            <button className="lt-iconbtn" onClick={onClose}><X size={18} /></button>
          </div>
          <div className="lt-detail-body">
            <div className="lt-section-title" style={{ margin: "2px 0 8px" }}>임무・알바・여행 중</div>
            {outing && (
              <div className="lt-map-char-row">
                <Avatar name={profile?.name || "나"} image={profile?.avatar} size={32} />
                <span style={{ flex: 1 }}>
                  {profile?.name || "나"}<span className="lt-muted" style={{ fontSize: 11, marginLeft: 6 }}>(나)</span>
                  <span className="lt-muted" style={{ fontSize: 11, marginLeft: 6 }}>
                    {outing.place} {outing.mission ? "수행 중" : `${outing.kind} 중`}
                  </span>
                </span>
              </div>
            )}
            {onMission.length === 0 && !outing && <div className="lt-muted" style={{ fontSize: 12 }}>지금 나가있는 캐릭터가 없어요.</div>}
            {onMission.map((c) => (
              <div key={c.id} className="lt-map-char-row">
                <Avatar name={c.name} image={c.images?.[0]} size={32} />
                <span style={{ flex: 1 }}>
                  {c.name}
                  <span className="lt-muted" style={{ fontSize: 11, marginLeft: 6 }}>
                    {charLocations[c.id]?.missionName || "임무"} 중
                    {(() => {
                      const ids = charLocations[c.id]?.missionWith || [];
                      const names = characters.filter((x) => ids.includes(x.id)).map((x) => x.name);
                      return names.length ? ` (${names.join(", ")}와 함께)` : "";
                    })()}
                  </span>
                </span>
              </div>
            ))}

            <div className="lt-section-title" style={{ margin: "18px 0 8px" }}>이동 중</div>
            {onTheMove.length === 0 && <div className="lt-muted" style={{ fontSize: 12 }}>없어요.</div>}
            {onTheMove.map((c) => {
              const t = LOCATIONS.find((l) => l.id === charLocations[c.id]?.targetMainId);
              return (
                <div key={c.id} className="lt-map-char-row">
                  <Avatar name={c.name} image={c.images?.[0]} size={32} />
                  <span style={{ flex: 1 }}>
                    {c.name}
                    <span className="lt-muted" style={{ fontSize: 11, marginLeft: 6 }}>{t ? t.name : "다른 곳"}(으)로 이동 중</span>
                  </span>
                </div>
              );
            })}

            <div className="lt-section-title" style={{ margin: "18px 0 8px" }}>다른 학원・장소에 있음</div>
            {elsewhere.length === 0 && <div className="lt-muted" style={{ fontSize: 12 }}>없어요.</div>}
            {elsewhere.map((c) => {
              const l = charLocations[c.id];
              const m = LOCATIONS.find((x) => x.id === l?.mainId);
              return (
                <div key={c.id} className="lt-map-char-row">
                  <Avatar name={c.name} image={c.images?.[0]} size={32} />
                  <span style={{ flex: 1 }}>
                    {c.name}
                    <span className="lt-muted" style={{ fontSize: 11, marginLeft: 6 }}>
                      {m ? m.name : ""}{l?.subId ? " - " + l.subId : ""}
                    </span>
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // 이동할 세부 위치를 고르면, 곧바로 옮기지 않고 "누구와 함께 갈까?"를 먼저 물어봄
  const openMovePicker = (dest) => {
    const alreadyWith = characters.filter((c) => companionIds.includes(c.id) || withYou(c)).map((c) => c.id);
    setPickedIds(alreadyWith);
    setPendingMove(dest);
  };
  const togglePicked = (id) =>
    setPickedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));

  if (showMission) {
    const toggleM = (id) => setMissionIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
    const PRESET = ["헬멧단 처리 의뢰", "시가지 순찰 임무", "폐시설 조사 의뢰", "물자 보급 의뢰", "분실물 수색 의뢰", "몬스터 퇴치 의뢰"];
    return (
      <div className="lt-menu-overlay" onClick={onClose}>
        <div className="lt-detail-sheet" onClick={(e) => e.stopPropagation()}>
          <div className="lt-detail-head">
            <button className="lt-iconbtn" onClick={() => setShowMission(false)}><ChevronLeft size={18} /></button>
            <div className="lt-detail-name">의뢰・임무 나가기</div>
            <button className="lt-iconbtn" onClick={onClose}><X size={18} /></button>
          </div>
          <div className="lt-detail-body">
            {outing?.mission ? (
              <>
                <div style={{ marginBottom: 14 }}>
                  지금 <b>{outing.place}</b> 수행 중이에요.
                  <div className="lt-muted" style={{ fontSize: 12, marginTop: 6 }}>
                    동행: {characters.filter((c) => companionIds.includes(c.id)).map((c) => c.name).join(", ") || "없음"}
                    <br />다른 캐릭터들에게는 "임무 중"으로 보입니다.
                  </div>
                </div>
                <button className="lt-btn" style={{ width: "100%" }} onClick={() => { setShowMission(false); onEndMission?.(); }}>
                  의뢰를 마치고 돌아가기
                </button>
              </>
            ) : (
              <>
                <div className="lt-muted" style={{ fontSize: 12, marginBottom: 12 }}>
                  의뢰・임무를 나가면 나와 동행자가 "임무 중"으로 표시되고, 다른 캐릭터들도 그렇게 인식합니다. 돌아올 때 시간이 건너뛰지 않아요.
                </div>
                <div className="lt-section-title" style={{ margin: "4px 0 8px" }}>무슨 의뢰인가요?</div>
                <input className="lt-text-input" value={missionName} onChange={(e) => setMissionName(e.target.value)}
                  placeholder="예: 헬멧단 처리 의뢰" />
                <div className="lt-map-sub-grid" style={{ marginTop: 8 }}>
                  {PRESET.map((k) => (
                    <button key={k} className={"lt-companion-chip" + (missionName === k ? " on" : "")} onClick={() => setMissionName(k)}>{k}</button>
                  ))}
                </div>
                <div className="lt-section-title" style={{ margin: "16px 0 4px" }}>
                  같이 갈 사람{missionIds.length > 0 ? ` — ${missionIds.length}명` : ""}
                </div>
                {characters.map((c) => (
                  <div key={c.id} className="lt-map-char-row" onClick={() => toggleM(c.id)} style={{ cursor: "pointer" }}>
                    <Avatar name={c.name} image={c.images?.[0]} size={32} />
                    <span style={{ flex: 1 }}>{c.name}</span>
                    <button className={"lt-companion-chip" + (missionIds.includes(c.id) ? " on" : "")}
                      style={{ marginLeft: "auto", flex: "0 0 auto" }}
                      onClick={(e) => { e.stopPropagation(); toggleM(c.id); }}>
                      {missionIds.includes(c.id) ? "✓ 같이 감" : "같이 가기"}
                    </button>
                  </div>
                ))}
                <button className="lt-btn" style={{ width: "100%", marginTop: 20 }}
                  disabled={!missionName.trim()}
                  onClick={() => { setShowMission(false); onStartMission?.(missionName.trim(), missionIds); }}>
                  {missionIds.length > 0 ? `${missionIds.length}명과 출발` : "혼자 출발"}
                </button>
              </>
            )}
          </div>
        </div>
      </div>
    );
  }

  if (showOuting) {
    const toggleOut = (id) => setOutIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
    return (
      <div className="lt-menu-overlay" onClick={onClose}>
        <div className="lt-detail-sheet" onClick={(e) => e.stopPropagation()}>
          <div className="lt-detail-head">
            <button className="lt-iconbtn" onClick={() => setShowOuting(false)}><ChevronLeft size={18} /></button>
            <div className="lt-detail-name">외출・여행</div>
            <button className="lt-iconbtn" onClick={onClose}><X size={18} /></button>
          </div>
          <div className="lt-detail-body">
            {outing ? (
              <>
                <div style={{ marginBottom: 14 }}>
                  지금 <b>{outing.place}</b>{outing.kind ? ` (${outing.kind})` : ""} 외출 중이에요.
                  <div className="lt-muted" style={{ fontSize: 12, marginTop: 6 }}>
                    동행: {characters.filter((c) => companionIds.includes(c.id)).map((c) => c.name).join(", ") || "없음"}
                    <br />다른 캐릭터들도 당신이 어디에 가 있는지 알고 있어요.
                  </div>
                </div>
                <button className="lt-btn" style={{ width: "100%" }} onClick={() => { setShowOuting(false); onEndOuting?.(); }}>
                  일정을 마치고 돌아가기
                </button>
              </>
            ) : (
              <>
                <div className="lt-muted" style={{ fontSize: 12, marginBottom: 12 }}>
                  지도에 없는 곳으로 나갈 때 쓰세요. 여행, 수학여행, 바다, 축제, 병문안 등 무엇이든 적으면 돼요.
                </div>
                <div className="lt-section-title" style={{ margin: "4px 0 8px" }}>어디로 가나요?</div>
                <input
                  className="lt-text-input"
                  value={outPlace}
                  onChange={(e) => setOutPlace(e.target.value)}
                  placeholder="예: 오키나와 수학여행, 근처 해수욕장, 온천 여관"
                />
                <div className="lt-section-title" style={{ margin: "16px 0 8px" }}>기간</div>
                <div className="lt-map-sub-grid">
                  {OUT_KINDS.map((k) => (
                    <button key={k} className={"lt-companion-chip" + (outKind === k ? " on" : "")} onClick={() => setOutKind(k)}>{k}</button>
                  ))}
                </div>
                <div className="lt-section-title" style={{ margin: "16px 0 4px" }}>
                  같이 갈 사람{outIds.length > 0 ? ` — ${outIds.length}명 선택됨` : ""}
                </div>
                <div className="lt-muted" style={{ fontSize: 12, marginBottom: 8 }}>
                  인원 제한 없이 원하는 만큼 선택하세요. 아무도 고르지 않으면 혼자 갑니다.
                </div>
                {characters.map((c) => (
                  <div key={c.id} className="lt-map-char-row" onClick={() => toggleOut(c.id)} style={{ cursor: "pointer" }}>
                    <Avatar name={c.name} image={c.images?.[0]} size={32} />
                    <span style={{ flex: 1 }}>{c.name}</span>
                    <button className={"lt-companion-chip" + (outIds.includes(c.id) ? " on" : "")}
                      style={{ marginLeft: "auto", flex: "0 0 auto" }}
                      onClick={(e) => { e.stopPropagation(); toggleOut(c.id); }}>
                      {outIds.includes(c.id) ? "✓ 같이 감" : "같이 가기"}
                    </button>
                  </div>
                ))}
                <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
                  {outIds.length > 0 && (
                    <button className="lt-btn ghost" style={{ flex: "0 0 auto" }} onClick={() => setOutIds([])}>선택 해제</button>
                  )}
                  <button className="lt-btn" style={{ flex: 1 }}
                    disabled={!outPlace.trim()}
                    onClick={() => { setShowOuting(false); onStartOuting?.(outPlace.trim(), outKind, outIds); }}>
                    {outIds.length > 0 ? `${outIds.length}명과 함께 출발` : "혼자 출발"}
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      </div>
    );
  }

  if (pendingMove) {
    const destName = LOCATIONS.find((l) => l.id === pendingMove.mainId)?.name || "";
    const nearby = characters.filter((c) => companionIds.includes(c.id) || withYou(c));
    const farAway = characters.filter((c) => !nearby.some((n) => n.id === c.id));
    const placeOf = (c) => {
      const l = charLocations[c.id];
      if (!l) return "";
      if (l.status === "mission") return l.missionName || "임무 중";
      if (l.status === "moving") return "이동 중";
      return l.subId || LOCATIONS.find((x) => x.id === l.mainId)?.name || "";
    };
    const row = (c, far) => (
      <div key={c.id} className="lt-map-char-row" onClick={() => togglePicked(c.id)} style={{ cursor: "pointer" }}>
        <Avatar name={c.name} image={c.images?.[0]} size={32} />
        <span style={{ flex: 1 }}>
          {c.name}
          {far && <span className="lt-muted" style={{ fontSize: 11, marginLeft: 6 }}>{placeOf(c)}</span>}
        </span>
        <button
          className={"lt-companion-chip" + (pickedIds.includes(c.id) ? " on" : "")}
          style={{ marginLeft: "auto", flex: "0 0 auto" }}
          onClick={(e) => { e.stopPropagation(); togglePicked(c.id); }}
        >{pickedIds.includes(c.id) ? "✓ 같이 감" : "같이 가기"}</button>
      </div>
    );
    return (
      <div className="lt-menu-overlay" onClick={onClose}>
        <div className="lt-detail-sheet" onClick={(e) => e.stopPropagation()}>
          <div className="lt-detail-head">
            <button className="lt-iconbtn" onClick={() => setPendingMove(null)}><ChevronLeft size={18} /></button>
            <div className="lt-detail-name">누구와 함께 갈까요?</div>
            <button className="lt-iconbtn" onClick={onClose}><X size={18} /></button>
          </div>
          <div className="lt-detail-body">
            <div className="lt-muted" style={{ margin: "4px 0 12px", fontSize: 12 }}>
              가는 곳: <b style={{ color: "var(--text)" }}>{destName}{pendingMove.subId ? " - " + pendingMove.subId : ""}</b>
              <br />선택한 사람만 나를 따라 이동하고, 이후에도 계속 같이 다녀요.
            </div>

            <div className="lt-section-title" style={{ margin: "4px 0 8px" }}>지금 나와 같이 있는 사람</div>
            {nearby.length === 0
              ? <div className="lt-muted" style={{ fontSize: 12 }}>지금 같이 있는 사람이 없어요.</div>
              : nearby.map((c) => row(c, false))}

            <div className="lt-section-title" style={{ margin: "16px 0 8px" }}>다른 곳에 있는 사람 (부르면 함께 이동)</div>
            {farAway.length === 0
              ? <div className="lt-muted" style={{ fontSize: 12 }}>없어요.</div>
              : farAway.map((c) => row(c, true))}

            <div style={{ display: "flex", gap: 8, marginTop: 20, position: "sticky", bottom: 0, background: "var(--sheet, #17171c)", paddingTop: 10, paddingBottom: 4 }}>
              <button className="lt-btn ghost" style={{ flex: 1 }}
                onClick={() => { const d = pendingMove; setPendingMove(null); onSetUserLocation(d, []); }}>
                혼자 가기
              </button>
              <button className="lt-btn" style={{ flex: 1 }}
                onClick={() => { const d = pendingMove; const ids = pickedIds; setPendingMove(null); onSetUserLocation(d, ids); }}>
                {pickedIds.length > 0 ? `${pickedIds.length}명과 이동` : "이동하기"}
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (selectedId) {
    const loc = LOCATIONS.find((l) => l.id === selectedId);
    const here = charsAt(selectedId);
    return (
      <div className="lt-menu-overlay" onClick={onClose}>
        <div className="lt-detail-sheet" onClick={(e) => e.stopPropagation()}>
          <div className="lt-detail-head">
            <button className="lt-iconbtn" onClick={() => setSelectedId(null)}><ChevronLeft size={18} /></button>
            <div className="lt-detail-name">{loc.name}</div>
            <button className="lt-iconbtn" onClick={onClose}><X size={18} /></button>
          </div>
          <div className="lt-detail-body">
            <div className="lt-section-title" style={{ margin: "4px 0 8px" }}>지금 여기 있는 캐릭터</div>
            {here.length === 0 && <div className="lt-muted">지금 아무도 없어요.</div>}
            {userLocation && userLocation.mainId === selectedId && (
              <div className="lt-map-char-row">
                <Avatar name={profile?.name || "나"} image={profile?.avatar} size={32} />
                <span style={{ flex: 1 }}>
                  {profile?.name || "나"}
                  <span className="lt-muted" style={{ fontSize: 11, marginLeft: 6 }}>(나 · {userLocation.subId || "?"})</span>
                </span>
              </div>
            )}
            {here.map((c) => {
              const isCompanion = companionIds.includes(c.id);
              return (
                <div key={c.id} className="lt-map-char-row">
                  <Avatar name={c.name} image={c.images?.[0]} size={32} />
                  <span style={{ flex: 1 }}>{labelFor(c)}</span>
                  <button
                    className={"lt-companion-chip" + (isCompanion ? " on" : "")}
                    style={{ marginLeft: "auto", flex: "0 0 auto" }}
                    onClick={() => onToggleCompanion?.(c.id)}
                  >
                    {isCompanion ? "✓ 동행 중" : "+ 동행"}
                  </button>
                </div>
              );
            })}
            <div className="lt-section-title" style={{ margin: "16px 0 8px" }}>여기서 세부 위치 선택</div>
            <div className="lt-map-sub-grid">
              {subsFor(loc.id, characters).map((sub) => {
                const on = userLocation?.mainId === selectedId && userLocation?.subId === sub;
                return (
                  <button key={sub} className={"lt-companion-chip" + (on ? " on" : "")} onClick={() => openMovePicker({ mainId: selectedId, subId: sub })}>
                    {on ? "✓ " : ""}{sub}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="lt-menu-overlay" onClick={onClose}>
      <div className="lt-detail-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="lt-detail-head">
          <button className="lt-iconbtn" onClick={() => setShowMissions(true)} title="지금 자리를 비운 인원"><Briefcase size={18} /></button>
          <button className="lt-iconbtn" onClick={() => setShowMoving(true)} title="지금 이동중인 인원" style={{ marginLeft: 2 }}><RotateCcw size={17} /></button>
          <button className={"lt-iconbtn" + (outing ? " on" : "")} onClick={() => { setOutIds([]); setShowOuting(true); }} title="외출・여행" style={{ marginLeft: 2 }}><Luggage size={17} /></button>
          <div className="lt-detail-name">GPS 지도</div>
          <button className="lt-iconbtn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="lt-detail-body">
          <img src={MAP_IMAGE} alt="지도" className="lt-map-image" />
          <div className="lt-muted" style={{ margin: "10px 0" }}>
            학원을 눌러 누가 있는지 확인하고 세부 위치를 골라 이동하세요. 같은 자리에 있는 캐릭터는 "동행"을 켜두면 나를 따라 같이 움직여요. 지금 있는 곳: <b style={{ color: "var(--text)" }}>{userLocation ? `${LOCATIONS.find((l) => l.id === userLocation.mainId)?.name || "-"}${userLocation.subId ? " - " + userLocation.subId : ""}` : "미설정"}</b>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, margin: "4px 0 8px" }}>
            <div className="lt-section-title" style={{ margin: 0, flex: 1 }}>지금 나와 함께 다니는 사람</div>
            <button className={"lt-companion-chip" + (outing?.mission ? " on" : "")}
              onClick={() => { setMissionIds(companionIds); setMissionName(outing?.mission ? outing.place : ""); setShowMission(true); }}>
              {outing?.mission ? "의뢰 중" : "＋ 의뢰"}
            </button>
            <button className="lt-companion-chip" title="동행자만 남기고 나머지는 각자 자리로 보냅니다"
              onClick={() => onScatterOthers?.()}>정리</button>
          </div>
          {companionIds.length === 0 ? (
            <div className="lt-muted" style={{ marginBottom: 12, fontSize: 12 }}>
              아직 없어요. 아래에서 학원을 누르고, 캐릭터 옆의 <b>+ 동행</b> 버튼을 누르면 그 캐릭터가 내 자리로 와서 계속 같이 다녀요.
            </div>
          ) : (
            <div style={{ marginBottom: 12 }}>
              {characters.filter((c) => companionIds.includes(c.id)).map((c) => (
                <div key={c.id} className="lt-map-char-row">
                  <Avatar name={c.name} image={c.images?.[0]} size={32} />
                  <span style={{ flex: 1 }}>{c.name}</span>
                  <button className="lt-companion-chip on" style={{ marginLeft: "auto", flex: "0 0 auto" }}
                    onClick={() => onToggleCompanion?.(c.id)}>✓ 동행 중</button>
                </div>
              ))}
            </div>
          )}
          <div className="lt-map-grid">
            {REAL_LOCATIONS.map((loc) => (
              <button key={loc.id} className={"lt-map-loc-btn" + (userLocation?.mainId === loc.id ? " on" : "")} onClick={() => setSelectedId(loc.id)}>
                {loc.name}
                <span className="lt-map-loc-count">{charsAt(loc.id).length}명</span>
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}
