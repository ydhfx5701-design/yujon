function ChatRoom({ plot, profiles, loreBooks, onBack, onExitToList, onPlotUpdated, onDeleteRoom, onOpenProfileForm, showToast }) {
  const [messages, setMessages] = useState([]);
  const [memory, setMemory] = useState({ shared: "", byChar: {}, promises: [] });
  const [statusEnabled, setStatusEnabled] = useState(null);
  const [scene, setScene] = useState(DEFAULT_SCENE());
  const [jobLog, setJobLog] = useState([]);
  const [presentIds, setPresentIds] = useState([]);
  const [charLocations, setCharLocations] = useState({});
  const [userLocation, setUserLocation] = useState(DEFAULT_USER_LOCATION());
  const [companionIds, setCompanionIds] = useState([]);
  const [outing, setOuting] = useState(null); // { place, kind }
  const [credits, setCredits] = useState(0);
  const [inventory, setInventory] = useState([]);
  const [affection, setAffection] = useState({});
  const [bookmarks, setBookmarks] = useState([]);
  const [activeProfileId, setActiveProfileId] = useState(plot?.defaultProfileId || profiles[0]?.id);
  const [input, setInput] = useState("");
  const inputRef = useRef(null);
  const [cutSceneId, setCutSceneId] = useState(null);
  const [cutSceneSub, setCutSceneSub] = useState(null); // 장면 전환 시 "어느 방"인지까지 기억
  const [sending, setSending] = useState(false);
  const [typingLabel, setTypingLabel] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [profilePickOpen, setProfilePickOpen] = useState(false);
  const [detailCharId, setDetailCharId] = useState(null);
  const [roomSheet, setRoomSheet] = useState(null);
  const [deleteMode, setDeleteMode] = useState(false);
  const [selectedDeleteId, setSelectedDeleteId] = useState(null);
  const [regeneratingId, setRegeneratingId] = useState(null);
  const [highlightId, setHighlightId] = useState(null);
  const [error, setError] = useState("");
  const scrollRef = useRef(null);
  const sinceMemoryRef = useRef(0);
  const sinceStatusRef = useRef(0);
  const sendingRef = useRef(false);

  const characters = plot?.characters || [];
  const profile = profiles.find((p) => p.id === activeProfileId) || profiles[0];
  const attachedLore = (plot?.loreIds || []).map((id) => loreBooks.find((l) => l.id === id)).filter(Boolean);
  const cfg = { ...DEFAULT_STYLE_CONFIG, ...(plot?.styleConfig || {}) };
  const statusOn = statusEnabled === null ? (cfg.scene || STYLE_FIELDS.some((f) => cfg[f.key])) : statusEnabled;
  const jobsDoneToday = jobLog.filter((e) => e.date === scene.date).length;



  useEffect(() => {
    if (!plot) return;
    let cancelled = false;
    (async () => {
      setLoaded(false);
      const data = await storeGet(`chat:${plot.id}`);
      if (cancelled) return;
      if (data) {
        setMessages(data.messages || []);
        const mem = data.memory;
        setMemory(
          mem && typeof mem === "object"
            ? { shared: mem.shared || "", byChar: mem.byChar || {}, promises: mem.promises || [] }
            : { shared: typeof mem === "string" ? mem : "", byChar: {}, promises: [] }
        );
        setActiveProfileId(data.activeProfileId || plot.defaultProfileId || profiles[0]?.id);
        setStatusEnabled(data.statusEnabled === undefined ? null : data.statusEnabled);
        setScene(data.scene || DEFAULT_SCENE());
        setJobLog(data.jobLog || []);
        setPresentIds((data.presentIds || []).filter((id) => (plot.characters || []).some((c) => c.id === id)));
        setCharLocations(ensureCharLocations(data.charLocations || {}, plot.characters || []));
        setUserLocation(normalizeUserLocation(data.userLocation));
        setCompanionIds((data.companionIds || []).filter((id) => (plot.characters || []).some((c) => c.id === id)));
        setOuting(data.outing || null);
        setCredits(data.credits ?? START_CREDITS);
        setInventory(data.inventory || []);
        setAffection(data.affection || {});
        setBookmarks(data.bookmarks || []);
        sinceMemoryRef.current = data.messages?.length || 0;
      } else {
        const seed = plot.intro ? [{ id: genId(), kind: "narration", content: plot.intro, ts: Date.now() }] : [];
        const freshMem = { shared: "", byChar: {}, promises: [] };
        const freshScene = DEFAULT_SCENE();
        const freshLocations = ensureCharLocations({}, plot.characters || []);
        setMessages(seed); setMemory(freshMem); setStatusEnabled(null);
        setScene(freshScene); setJobLog([]); setPresentIds([]);
        const freshUserLoc = DEFAULT_USER_LOCATION();
        setCharLocations(freshLocations); setUserLocation(freshUserLoc); setCompanionIds([]); setOuting(null);
        setCredits(START_CREDITS); setInventory([]); setAffection({}); setBookmarks([]);
        sinceMemoryRef.current = 0; sinceStatusRef.current = 0;
        await storeSet(`chat:${plot.id}`, {
          messages: seed, memory: freshMem, activeProfileId: plot.defaultProfileId,
          statusEnabled: null, scene: freshScene, jobLog: [], presentIds: [],
          charLocations: freshLocations, userLocation: freshUserLoc, companionIds: [], outing: null,
          credits: START_CREDITS, inventory: [], affection: {}, bookmarks: [],
        });
      }
      setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, [plot?.id]);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, sending, typingLabel]);

  const persistFull = async (overrides = {}) => {
    await storeSet(`chat:${plot.id}`, {
      messages: overrides.messages ?? messages,
      memory: overrides.memory ?? memory,
      activeProfileId: overrides.activeProfileId ?? activeProfileId,
      statusEnabled: overrides.statusEnabled === undefined ? statusEnabled : overrides.statusEnabled,
      scene: overrides.scene ?? scene,
      jobLog: overrides.jobLog ?? jobLog,
      presentIds: overrides.presentIds ?? presentIds,
      charLocations: overrides.charLocations ?? charLocations,
      userLocation: overrides.userLocation === undefined ? userLocation : overrides.userLocation,
      companionIds: overrides.companionIds ?? companionIds,
      outing: overrides.outing === undefined ? outing : overrides.outing,
      credits: overrides.credits ?? credits,
      inventory: overrides.inventory ?? inventory,
      affection: overrides.affection ?? affection,
      bookmarks: overrides.bookmarks ?? bookmarks,
    });
  };
  const updatePlotPreview = async (lastMsg) => { await onPlotUpdated({ ...plot, lastMessage: (lastMsg || "").slice(0, 40), lastMessageAt: Date.now() }); };

  const nameOf = (kind, speakerId) => {
    if (kind === "user") return profile?.name || "사용자";
    if (kind === "narration" || kind === "status") return "";
    if (kind === "npc") return speakerId || "단역";
    return characters.find((c) => c.id === speakerId)?.name || "???";
  };
  const memoryTextFor = (character) => [memory.shared, memory.byChar?.[character.id]].filter(Boolean).join("\n");
  const affectionNote = (charId) => {
    const v = affection[charId] ?? AFFECTION_DEFAULT;
    const band = affectionBand(v);
    const name = characters.find((c) => c.id === charId)?.name || "";
    return `\n현재 사용자에 대한 "${name}"의 호감도는 100점 만점에 ${v}점(${band.label} 수준)입니다. 호감도가 낮을수록 차갑거나 무심하거나 경계하는 태도를, 높을수록 다정하고 친밀한 태도를 자연스럽게 반영해서 말하세요.`;
  };

  const maybeUpdateMemory = async (msgs) => {
    sinceMemoryRef.current += 1;
    if (sinceMemoryRef.current < MEMORY_EVERY) return memory;
    sinceMemoryRef.current = 0; sinceStatusRef.current = 0;
    try {
      const recent = msgs.slice(-MEMORY_EVERY * 6).filter((m) => m.kind === "user" || m.kind === "character");
      const transcript = recent.map((m) => `${nameOf(m.kind, m.speakerId)}: ${m.content}`).join("\n");
      const charList = characters.map((c) => `${c.id}:${c.name}`).join(", ");
      const charSchema = characters.map((c) => `"${c.id}":"${c.name}만 특별히 기억하는 것들을 한국어 불릿 목록 텍스트로"`).join(",");
      const sys = `당신은 롤플레잉 채팅방 "${plot.title}"의 기억 정리 보조자입니다. 참여 캐릭터(id:이름): ${charList}. 캐릭터들은 절대 잊으면 안 되는 정보를 매우 잘 기억해야 하고, 서로 나눈 약속도 놓치면 안 됩니다. 아래 JSON 스키마와 정확히 같은 키만 가진 JSON 객체 하나만 출력하세요. 코드블록이나 다른 설명은 절대 쓰지 마세요.\n{"shared":"모두가 함께 아는 사실을 한국어 불릿 목록 텍스트로(각 줄 앞에 -)","characters":{${charSchema}},"promises":[{"characterIds":["관련 캐릭터 id들"],"withUser":true또는false,"description":"약속 내용","when":"언제인지(예: 내일, 다음 주말, 한 달 뒤)"}]}`;
      const raw = await callClaude(sys, [{ role: "user", content:
        `[기존 공통 기억]\n${memory.shared || "(없음)"}\n\n[기존 캐릭터별 기억]\n${JSON.stringify(memory.byChar || {})}\n\n[기존 약속 목록]\n${JSON.stringify(memory.promises || [])}\n\n[최근 대화]\n${transcript}\n\n` +
        `위 대화를 바탕으로 기존 기억과 통합해서 최신 기억 JSON을 만들어줘. 이름, 취향, 관계, 중요한 사건, 감정, 약속, 설정 등 구체적 사실 위주로 자세히 담되 중복은 제거해. 공통 기억은 최대 15줄, 캐릭터별 기억은 각각 최대 8줄. 새로운 대화에서 사용자나 캐릭터끼리 만든 약속・계획이 있으면 promises 목록에 추가하고, 기존 약속 중 이미 지켜졌거나 취소된 것은 목록에서 빼줘. 약속이 없으면 promises는 빈 배열로.` },
      ], 1400);
      const clean = raw.replace(/```json|```/g, "").trim();
      const match = clean.match(/\{[\s\S]*\}/);
      const parsed = JSON.parse(match ? match[0] : clean);
      const next = {
        shared: parsed.shared || memory.shared || "",
        byChar: { ...memory.byChar, ...(parsed.characters || {}) },
        promises: Array.isArray(parsed.promises)
          ? parsed.promises.map((p) => ({ id: genId(), characterIds: p.characterIds || [], withUser: !!p.withUser, description: p.description || "", when: p.when || "" }))
          : (memory.promises || []),
      };
      setMemory(next);
      return next;
    } catch (e) { console.error(e); return memory; }
  };

  const buildHistoryFor = (characterId, msgs, locs = charLocations) => {
    const cl = locs[characterId];
    const myKey = cl ? `${cl.mainId}|${cl.subId || ""}` : null;
    // 사용자의 가장 최근 메시지는 장면 키와 무관하게 반드시 포함 (다른 장면 기록에 갇혀 질문을 못 보는 문제 방지)
    let lastUserIdx = -1;
    for (let i = msgs.length - 1; i >= 0; i--) { if (msgs[i].kind === "user") { lastUserIdx = i; break; } }
    const visible = msgs.filter((m, i) => i === lastUserIdx || !m.sceneKey || !myKey || m.sceneKey === myKey || m.speakerId === characterId);
    // 매 턴 한 칸씩 밀리면 캐시 앞부분이 계속 달라져서 캐시가 안 맞음.
    // 시작 지점을 8개 단위로 고정해서 8턴 동안은 앞부분이 완전히 동일하게 유지시킴.
    const startIdx = Math.max(0, Math.floor(Math.max(0, visible.length - 24) / 8) * 8);
    const trimmed = visible.slice(startIdx);
    const mapped = trimmed.filter((m) => m.kind === "user" || m.kind === "character" || m.kind === "narration" || m.kind === "npc").map((m) => {
      if (m.kind === "narration") return { role: "user", content: `(상황) ${m.content}` };
      return {
        role: m.kind === "character" && m.speakerId === characterId ? "assistant" : "user",
        content: m.kind === "character" && m.speakerId === characterId ? m.content : `[${nameOf(m.kind, m.speakerId)}] ${m.content}`,
      };
    });
    const normalized = normalizeHistory(mapped);
    if (normalized.length === 0) return [{ role: "user", content: "..." }];
    // Claude API는 반드시 user 메시지로 끝나야 함. 빈 입력으로 대화를 이어갈 때
    // 이 캐릭터 본인의 마지막 대사가 그대로 끝에 남는 경우(=이어서 말할 새 계기가 없는 경우)를 방지.
    if (normalized[normalized.length - 1].role === "assistant") {
      normalized.push({ role: "user", content: "(자연스럽게 이야기를 계속 이어가줘)" });
    }
    return normalized;
  };
  const extraGroupNote = (char, presentSet) => {
    const others = characters
      .filter((c) => c.id !== char.id && (!presentSet || presentSet.has(c.id)))
      .map((c) => c.name);
    if (characters.length <= 1) return "";
    return `\n지금은 "${plot.title}" 장면입니다.\n[지금 이 자리에 같이 있는 사람 — 전원 눈앞에 있습니다] ${others.join(", ") || "없음 (지금은 사용자와 단둘이 있습니다)"}\n이 명단에 있는 인물은 이미 도착해 있는 것이니 "아직 안 왔다", "언제 오려나", "못 올 거야" 같은 말을 하면 안 됩니다. 반대로 이 명단에 없는 인물은 이 자리에 없습니다. 대괄호 [이름] 표시는 대화 기록에서 누가 말했는지 구분하려고 붙인 태그입니다. 당신의 응답에는 절대 "[이름]" 형태를 쓰지 마세요. 당신은 오직 "${char.name}" 본인의 말과 행동만 씁니다. 이미 나온 대화 내용(다른 캐릭터가 이미 한 말)에는 자연스럽게 반응해도 되지만, 그들의 대사를 당신이 대신 지어내서 쓰면 안 됩니다. 지금 이 자리에 없는 캐릭터를 마음대로 등장시키거나 그들이 이 자리에 있는 것처럼 말하지도 마세요.`;
  };
  // GPS 지도상 이 캐릭터가 지금 구체적으로 어디 있는지 알려줌 (알고 자연스럽게 언급할 수 있도록)
  const missionMatesText = (loc, exceptId) => {
    const ids = (loc?.missionWith || []).filter((id) => id !== exceptId);
    if (ids.length === 0) return "";
    const names = characters.filter((c) => ids.includes(c.id)).map((c) => c.name);
    return names.length ? `${names.join(", ")}와(과) 함께` : "";
  };
  const charLocationNote = (char, locs = charLocations) => {
    const loc = locs[char.id];
    if (!loc) return "";
    if (loc.status === "mission") {
      if (loc.missionWithUser) return `\n지금 "${char.name}"은(는) 사용자와 함께 "${loc.missionName || "일"}"을(를) 하는 중입니다.`;
      const mates = missionMatesText(loc, char.id);
      return `\n지금 "${char.name}"은(는) "${loc.missionName || "일"}"(으)로 나가있는 상황입니다.${mates ? ` (${mates})` : " (혼자 나가 있습니다)"}`;
    }
    if (loc.status === "moving") {
      const target = LOCATIONS.find((l) => l.id === loc.targetMainId);
      return `\n지금 "${char.name}"은(는) ${target ? target.name : "다른 곳"}(으)로 이동하는 중입니다.`;
    }
    const main = LOCATIONS.find((l) => l.id === loc.mainId);
    return `\n지금 "${char.name}"이(가) 있는 구체적인 장소는 "${main ? main.name : ""} - ${loc.subId || ""}"입니다. 자연스러우면 이 장소를 배경으로 활용하세요.`;
  };
  // 지금 몇 시인지, 그 시간대에 보통 뭘 하는지 알려줘서 시간에 맞게 행동하게 함
  const timeNote = (sc = scene) => {
    if (!sc?.time) return "";
    const part = dayPartOf(minutesOfTime(sc.time));
    return `\n[지금 시각] ${formatDateLabel(sc.date)} ${formatClock(sc.time)} — ${part}(${dayPartHint(part)}). 이 시간대에 맞게 행동하고 말하세요. 다만 아래 [내 위치]가 이 시간대와 어울리지 않는 곳이라면(예: 밤인데 동아리실) 그건 오류가 아니라 늦게까지 남아 있는 것이니, 야근・잔업・밤샘처럼 자연스러운 이유를 붙여 연기하세요.`;
  };
  // 선생님(사용자)이 외출・여행 중이면 그 사실을 모든 캐릭터가 알고 있게 함
  const outingNote = (char) => {
    if (!outing) return "";
    const names = characters.filter((c) => companionIds.includes(c.id)).map((c) => c.name);
    const iAmThere = companionIds.includes(char.id);
    return `\n[외출・여행 중] ${profile?.name || "선생님"}은(는) 지금 "${outing.place}"(으)로 ${outing.kind} 일정을 나가 있습니다.` +
      (names.length ? ` 동행: ${names.join(", ")}.` : " 혼자 갔습니다.") +
      (iAmThere
        ? " 당신도 지금 그곳에 함께 있습니다. 학교가 아니라 그 장소에 있다는 전제로 말하고 행동하세요."
        : " 당신은 따라가지 않았고, 이 사실을 알고 있습니다. 학교(또는 당신의 현재 위치)에서 말하고 있는 것입니다.");
  };
  // 이 세계(플롯)에 있는 상점 아이템・알바/의뢰 목록을 캐릭터도 알고 자연스럽게 언급할 수 있게 공유
  const worldContextNote = () => {
    const parts = [];
    const shopNames = (plot.shopItems || []).map((i) => i.name).filter(Boolean);
    if (shopNames.length > 0) parts.push(`이 동네 상점에는 이런 물건들이 있습니다: ${shopNames.join(", ")}. 자연스러운 상황이면 이런 물건을 언급하거나, 갖고 싶어하거나, 화제로 삼을 수 있습니다.`);
    const jobNames = (plot.jobs || []).map((j) => j.name).filter(Boolean);
    if (jobNames.length > 0) parts.push(`요즘 이런 알바・의뢰가 있습니다: ${jobNames.join(", ")}. 자연스러운 상황이면 이런 일을 언급하거나 같이 하자고 제안할 수 있습니다.`);
    return parts.length ? `\n${parts.join("\n")}` : "";
  };
  // 다른 등장인물들의 설명과 지금 위치를 알려줘서, "OO 어디 갔어?" 같은 질문에도 자연스럽게 답할 수 있게 함
  // 매번 똑같은 인물 소개 (캐시 대상)
  // 전원 포함(자기 자신도) → 모든 캐릭터에게 완전히 동일한 문자열 → 캐시 1개를 전원이 공유
  const castProfilesNote = () => {
    if (characters.length === 0) return "";
    const lines = characters.map((c) => {
      const desc = (c.description || "").slice(0, 110);
      return `- ${c.name}${desc ? `: ${desc}` : ""}`;
    });
    return `[등장인물 - 서로 아는 사이입니다]\n${lines.join("\n")}`;
  };
  const castKnowledgeNote = (char, locs = charLocations, hereSet = null) => {
    const others = characters.filter((c) => c.id !== char.id);
    if (others.length === 0) return "";
    const locText = (c) => {
      const loc = locs[c.id];
      if (hereSet && hereSet.has(c.id)) return "지금 당신 바로 옆(같은 자리)에 있음";
      if (!loc) return "";
      if (loc.status === "mission") {
        const mates = missionMatesText(loc, c.id);
        return `지금 위치: "${loc.missionName || "일"}"(으)로 나가있음${mates ? ` (${mates})` : ""}`;
      }
      if (loc.status === "moving") {
        const t = LOCATIONS.find((l) => l.id === loc.targetMainId);
        return `지금 위치: ${t ? t.name : "다른 곳"}(으)로 이동중`;
      }
      const m = LOCATIONS.find((l) => l.id === loc.mainId);
      return `지금 위치: ${m ? m.name : ""}${loc.subId ? " - " + loc.subId : ""}`;
    };
    // 위치 정보만 담음 (인물 설명은 고정부 castProfilesNote로 분리해 캐시에 태움)
    const lines = others.map((c) => `- ${c.name}: ${locText(c) || "위치 불명"}`);
    return `\n[지금 각 인물이 있는 곳 - "OO 어디 있어?" 같은 질문에 이대로 답하세요]\n${lines.join("\n")}\n(위 위치 정보는 실시간으로 정확한 사실입니다. 인물의 위치를 말할 때는 반드시 이 정보 그대로 답하세요. 특히 "지금 당신 바로 옆에 있음"으로 표시된 인물은 눈앞에 있는 것이므로, 그 사람이 없다거나 "언제 오려나", "못 올 거야" 같은 말을 절대 하지 마세요.)`;
  };

  const send = async () => {
    if (sendingRef.current || sending || characters.length === 0) return;
    sendingRef.current = true;
    const raw = input.trim();
    setError(""); setInput("");
    let current = messages;
    const excludeIds = new Set();

    const npcNamesKnown = Array.from(new Set(messages.filter((m) => m.kind === "npc").map((m) => m.npcName).filter(Boolean)));
    let userLocNow = userLocation;
    const sceneKeyOf = (l) => (l ? `${l.mainId}|${l.subId || ""}` : "");
    let turnSceneKey = sceneKeyOf(userLocation);
    const shopSpotNow = npcForSub(userLocNow?.subId);
    const rosterForParse = shopSpotNow && !npcNamesKnown.includes(shopSpotNow.role) ? [...npcNamesKnown, shopSpotNow.role] : npcNamesKnown;
    let hadNpcLine = false;
    let hadNarration = false;
    let hadPlainUser = false;
    if (raw) {
      const segments = parseScriptedInput(raw, characters, rosterForParse);
      if (segments.some((s) => s.type === "character" || s.type === "narration" || s.type === "npcLine")) {
        for (const seg of segments) {
          if (seg.type === "character") {
            current = [...current, { id: genId(), kind: "character", speakerId: seg.characterId, content: seg.content, ts: Date.now(), sceneKey: turnSceneKey, byUser: true }];
            excludeIds.add(seg.characterId);
          } else if (seg.type === "narration") {
            current = [...current, { id: genId(), kind: "narration", content: seg.content, ts: Date.now() , sceneKey: turnSceneKey }];
            hadNarration = true;
          } else if (seg.type === "npcLine") {
            current = [...current, { id: genId(), kind: "npc", speakerId: seg.name, npcName: seg.name, emoji: "👤", content: seg.content, ts: Date.now() }];
            hadNpcLine = true;
          } else if (seg.content.trim()) {
            current = [...current, { id: genId(), kind: "user", content: seg.content.trim(), ts: Date.now() , sceneKey: turnSceneKey }];
            hadPlainUser = true;
          }
        }
      } else {
        current = [...current, { id: genId(), kind: "user", content: raw, ts: Date.now() , sceneKey: turnSceneKey }];
        hadPlainUser = true;
      }
      setMessages(current);
      await persistFull({ messages: current });
      updatePlotPreview(raw);
    }
    setSending(true);

    try {
      const scanText = [...current.slice(-6).map((m) => m.content || ""), raw].join("\n");
      const loreContext = getLoreContext(attachedLore, scanText);
      const priorSpoken = new Set(current.filter((m) => m.kind === "character").map((m) => m.speakerId));

      // 새로 언급된 캐릭터가 있으면 그 캐릭터가 먼저 말하도록 순서를 정함 (전체 캐릭터는 기본적으로 모두 응답 후보)
      let newlyMentioned = [];
      if (raw) {
        newlyMentioned = characters.filter((c) => c.name && mentionsName(raw, c.name));
      }
      const nextPresentIds = Array.from(new Set([...presentIds, ...characters.map((c) => c.id)]));
      setPresentIds(nextPresentIds);

      // --- 시간 흐름: 채팅 한 턴마다 3분, "*1시간이 지났다*" 같은 서술은 즉시 반영 ---
      const jumped = raw ? applyTimeDirectives(scene, raw) : null;
      const base = jumped || advanceClock(scene.date, scene.time, 3);
      if (jumped) {
        const dayChanged = jumped.date !== scene.date;
        showToast?.(`시간이 ${dayChanged ? formatDateLabel(jumped.date) + " " : ""}${formatClock(jumped.time)}(으)로 넘어갔어요`);
      }
      const sceneNow = { ...scene, date: base.date, time: base.time };
      setScene(sceneNow);
      // 최근 대화에 등장한 캐릭터는 이번 턴에 자리를 옮기지 않도록 고정
      const recentSpeakerIds = messages.slice(-8).map((m) => m.speakerId).filter(Boolean);
      const pinnedIds = Array.from(new Set([...recentSpeakerIds, ...(cutSceneId ? characters.filter((c) => {
        const l = charLocations[c.id];
        return l && l.status === "here" && l.mainId === cutSceneId && (!cutSceneSub || l.subId === cutSceneSub);
      }).map((c) => c.id) : [])]));
      let locsNow = tickLocations(charLocations, characters, userLocNow, companionIds, sceneNow.time, pinnedIds);
      setCharLocations(locsNow);
      let companionsNow = companionIds;
      const inputStartIdx = messages.length; // 이번 턴에 새로 들어간 입력 메시지 위치
      // 장면 전환(컷어웨이) 판단: @캐릭터 대사나 @:내레이션으로 언급한 인물들이 전부 내가 있는 곳에 없으면,
      // 카메라가 그쪽으로 넘어가 사용자 없이 그 캐릭터들끼리의 장면이 됨
      const atUser = (cid) => {
        if (!userLocNow) return true;
        const loc = locsNow[cid];
        if (!loc) return true;
        if (loc.status === "mission" && loc.missionWithUser) return true;
        return loc.status === "here" && loc.mainId === userLocNow.mainId && (!userLocNow.subId || loc.subId === userLocNow.subId);
      };
      const focusArr = Array.from(new Set([...excludeIds, ...newlyMentioned.map((c) => c.id)]));
      // 서술에 적힌 실제 장소를 찾음. 장소가 없으면, 서술에 언급된 다른 캐릭터가 있는 곳을 목적지로 사용
      let statedPlace = findPlaceInText(raw, characters);
      if (statedPlace && !statedPlace.mainId) {
        statedPlace = { mainId: userLocNow?.mainId || "schale", subId: statedPlace.subId };
      }
      if (!statedPlace && raw) {
        const target = characters.find((c) => !focusArr.includes(c.id) && c.name && mentionsName(raw, c.name) && locsNow[c.id]?.status === "here");
        if (target) statedPlace = { mainId: locsNow[target.id].mainId, subId: locsNow[target.id].subId };
      }
      // "각자 갈 곳으로" 같은 해산 서술이면, 함께 있던 캐릭터 중 언급되지 않은 인물은 각자 자기 자리로 돌아감
      if (raw && /(각자|헤어지|해산|흩어|돌아갔|귀가)/.test(raw)) {
        locsNow = { ...locsNow };
        const stayIds = [];
        characters.forEach((ch) => {
          const cur = locsNow[ch.id];
          const withMe = cur && ((cur.status === "mission" && cur.missionWithUser) ||
            (cur.status === "here" && userLocNow && cur.mainId === userLocNow.mainId));
          const staying = ch.name && mentionsName(raw, ch.name);
          if (staying) stayIds.push(ch.id);
          if (withMe && !staying) {
            const hm = guessHomeLocationId(ch);
            locsNow[ch.id] = { mainId: hm, subId: pickSub(hm), status: "here" };
          }
        });
        // 해산했으면 동행도 해제 (이름이 언급돼 남은 사람만 계속 동행)
        if (companionsNow.length > 0) {
          const keep = companionsNow.filter((id) => stayIds.includes(id));
          if (keep.length !== companionsNow.length) setCompanionIds(keep);
          companionsNow = keep;
        }
        setCharLocations(locsNow);
      }
      // "OO가 들어온다" 처럼 등장을 알리는 서술이면 장면을 옮기는 게 아니라 내 자리로 부르는 것
      const arrivalCue = SUMMON_CUE.test(raw || "");
      const newCut = !!(userLocNow && (excludeIds.size > 0 || hadNarration) && focusArr.length > 0 && focusArr.every((id) => !atUser(id)) && !arrivalCue);
      let activeCut = hadPlainUser ? null : cutSceneId;
      let activeCutSub = hadPlainUser ? null : cutSceneSub;
      if (newCut) {
        // 장면의 기준이 될 인물: 서술에서 "마지막에 언급된" 인물(= 대개 찾아가는 대상)을 우선
        let anchorId = focusArr[0];
        if (raw) {
          const ordered = characters
            .filter((c) => focusArr.includes(c.id) && c.name && mentionsName(raw, c.name) && locsNow[c.id]?.status === "here")
            .map((c) => ({ id: c.id, at: raw.lastIndexOf(c.name) }))
            .sort((a, b) => b.at - a.at);
          if (ordered.length > 0) anchorId = ordered[0].id;
        }
        const anchor = locsNow[anchorId];
        const cm = statedPlace ? statedPlace.mainId : (anchor ? (anchor.status === "moving" ? anchor.targetMainId : anchor.mainId) : null);
        const cs = statedPlace ? statedPlace.subId : (anchor && anchor.status === "here" ? anchor.subId : null);
        if (cm) {
          activeCut = cm;
          activeCutSub = cs || pickSub(cm);
          // 이 장면에 등장하는 인물들을 실제로 그 방으로 옮김 (지도와 대화가 어긋나지 않게)
          locsNow = { ...locsNow };
          focusArr.forEach((fid) => {
            const cur = locsNow[fid];
            if (cur && cur.status === "mission" && !cur.missionWithUser) return; // 임무 중이면 억지로 끌어오지 않음
            locsNow[fid] = { mainId: activeCut, subId: activeCutSub, status: "here" };
          });
          setCharLocations(locsNow);
        }
      }
      // 동행 중인 캐릭터는 항상 내 위치와 붙어 있어야 함 (장면이 어긋나는 것 방지)
      if (companionsNow.length > 0 && userLocNow) {
        locsNow = syncCompanions(locsNow, userLocNow, companionsNow);
        setCharLocations(locsNow);
      }
      const cutaway = !!activeCut;
      if (activeCut !== cutSceneId) setCutSceneId(activeCut);
      if (activeCutSub !== cutSceneSub) setCutSceneSub(activeCutSub);
      if (cutaway && focusArr.length > 0) {
        locsNow = { ...locsNow };
        const destSub = statedPlace && statedPlace.mainId === activeCut ? statedPlace.subId : null;
        focusArr.forEach((id) => {
          const cur = locsNow[id];
          const needMove = !cur || cur.mainId !== activeCut || cur.status !== "here" || (destSub && cur.subId !== destSub);
          if (needMove) {
            locsNow[id] = { mainId: activeCut, subId: destSub || (cur && cur.mainId === activeCut && cur.subId) || pickSub(activeCut), status: "here" };
          }
        });
        setCharLocations(locsNow);
      } else if (!cutaway && userLocNow) {
        // 서술에 장소가 적혀 있으면 나와 언급된 캐릭터가 실제로 그 장소로 이동
        if (statedPlace && (statedPlace.mainId !== userLocNow.mainId || (statedPlace.subId && statedPlace.subId !== userLocNow.subId))) {
          const dest = { mainId: statedPlace.mainId, subId: statedPlace.subId || pickSub(statedPlace.mainId) };
          setUserLocation(dest);
          turnSceneKey = sceneKeyOf(dest);
          await persistFull({ userLocation: dest });
          // 문장에 이름이 나온 캐릭터만 동행. 이름이 하나도 없으면 다 같이 이동.
          const namedIds = new Set(characters.filter((ch) => ch.name && mentionsName(raw, ch.name)).map((ch) => ch.id));
          locsNow = { ...locsNow };
          // 자기 임무・알바 중인 캐릭터는 나를 따라오지 않음
          const movable = characters.filter((ch) => {
            const cur = locsNow[ch.id];
            if (!cur) return false;
            if (cur.status === "mission" && !cur.missionWithUser) return false;
            if (cur.status === "moving") return false;
            return (cur.status === "mission" && cur.missionWithUser) ||
              (cur.status === "here" && cur.mainId === userLocNow.mainId && (!userLocNow.subId || cur.subId === userLocNow.subId));
          });
          // 이름을 하나도 안 썼는데 4명 넘게 딸려오면 오작동으로 보고 동행 중인 사람만 데려감
          const bulk = namedIds.size === 0 && movable.length > 3;
          movable.forEach((ch) => {
            if (namedIds.size === 0 ? (!bulk || companionsNow.includes(ch.id)) : namedIds.has(ch.id)) {
              locsNow[ch.id] = { mainId: dest.mainId, subId: dest.subId, status: "here" };
            } else {
              const hm = guessHomeLocationId(ch); // 동행하지 않은 인물은 각자 자기 학원으로 흩어짐
              locsNow[ch.id] = { mainId: hm, subId: pickSub(hm), status: "here" };
            }
          });
          setCharLocations(locsNow);
          userLocNow = dest;
        }
        // 이름을 말했다고 무조건 그 캐릭터가 내 옆으로 순간이동하지 않음.
        // 내레이션(@:)이거나 "왔다/들어왔다/불렀다" 같은 등장 표현이 있을 때만 이 자리로 부름.
        const canSummon = hadNarration || SUMMON_CUE.test(raw || "");
        if (canSummon) {
          locsNow = { ...locsNow };
          const arrivedNames = [];
          newlyMentioned.forEach((c) => {
            const cur = locsNow[c.id];
            if (!arrivalCue && cur && cur.status === "mission" && !cur.missionWithUser) return; // 자기 임무 중이면 안 끌려옴 (등장 서술은 예외)
            const alreadyOk = cur && ((cur.status === "mission" && cur.missionWithUser) ||
              (cur.status === "here" && cur.mainId === userLocNow.mainId && (!userLocNow.subId || cur.subId === userLocNow.subId)));
            if (!alreadyOk) {
              locsNow[c.id] = { mainId: userLocNow.mainId, subId: userLocNow.subId || pickSub(userLocNow.mainId), status: "here" };
              arrivedNames.push(c.name);
            }
          });
          setCharLocations(locsNow);
          // 등장 서술이면 지도에 반영됐다는 걸 눈에 보이게 알려주고 즉시 저장
          if (arrivalCue && arrivedNames.length > 0) {
            const placeName = `${LOCATIONS.find((l) => l.id === userLocNow.mainId)?.name || ""}${userLocNow.subId ? " " + userLocNow.subId : ""}`;
            current = [...current, { id: genId(), kind: "narration", ts: Date.now(), sceneKey: turnSceneKey,
              content: `*${arrivedNames.join(", ")}이(가) ${placeName}에 도착했다*` }];
            setMessages(current);
            await persistFull({ messages: current, charLocations: locsNow });
          }
        }
        // 동행 중인 캐릭터는 내가 어디로 가든 항상 같이 있음
        if (companionsNow.length > 0) {
          locsNow = syncCompanions(locsNow, userLocNow, companionsNow);
          setCharLocations(locsNow);
        }
      }

      // 이번 턴 장면의 기준 위치 (장면 전환이면 그쪽, 아니면 내 위치)
      const sceneLoc = cutaway
        ? { mainId: activeCut, subId: (statedPlace && statedPlace.mainId === activeCut ? statedPlace.subId : activeCutSub) }
        : userLocNow;
      const locationOk = (c) => {
        if (!cutaway && companionsNow.includes(c.id)) return true; // 동행 중이면 언제나 내 옆
        if (!sceneLoc) return true;
        const loc = locsNow[c.id];
        if (!loc) return true; // 위치 정보가 아직 없으면 막지 않음
        if (loc.status === "mission" && loc.missionWithUser) return true; // 나와 함께 임무중이면 같이 있는 것
        if (loc.status !== "here") return false; // 이동중이거나 임무중이면 채팅에 나오지 않음
        if (loc.mainId !== sceneLoc.mainId) return false;
        if (sceneLoc.subId && loc.subId !== sceneLoc.subId) return false;
        return true;
      };
      // 언급된 캐릭터는 (이 자리에 있는 한) 먼저 대답하도록 순서만 앞으로 당김
      const mentionedIds = new Set(newlyMentioned.map((c) => c.id));
      // 이름이 불렸어도 이 자리에 없으면 대사에 끼어들지 않음 (부른 경우엔 위에서 이미 이 자리로 옮겨짐)
      const respondPool = characters.filter((c) => !excludeIds.has(c.id) && locationOk(c));
      const coLocatedIds = new Set(characters.filter((c) => locationOk(c)).map((c) => c.id));
      const priorityFirst = respondPool.filter((c) => mentionedIds.has(c.id));
      const others = respondPool.filter((c) => !mentionedIds.has(c.id)).sort(() => Math.random() - 0.5);
      const ordered = [...priorityFirst, ...others];
      // 새로 등장한 캐릭터가 있으면, 그들 전원 + 기존 캐릭터 최소 2명까지 함께 말할 수 있게 정원 확대
      const respondCount = ordered.length <= MAX_RESPONDERS
        ? ordered.length
        : Math.min(ordered.length, Math.max(MAX_RESPONDERS, priorityFirst.length + 2));
      const responders = ordered.slice(0, respondCount);
      // 이 자리에 아무도 없으면 조용히 끝나지 않고 안내를 띄움
      // 이 자리에 사람이 있는데 단지 (내가 대사를 대신 친 캐릭터라서) 응답자가 없는 경우엔 안내를 띄우지 않음
      const anyoneHere = characters.some((c) => locationOk(c));
      if (responders.length === 0 && characters.length > 0 && !anyoneHere) {
        const placeName = sceneLoc ? `${LOCATIONS.find((l) => l.id === sceneLoc.mainId)?.name || ""}${sceneLoc.subId ? " " + sceneLoc.subId : ""}` : "";
        const note = { id: genId(), kind: "narration", ts: Date.now(), sceneKey: turnSceneKey,
          content: `*${placeName ? placeName + "에는 " : ""}지금 아무도 없다. 또는 캐릭터 이름을 부르거나(예: "아리스가 들어왔다") GPS 지도로 다른 곳에 가보세요*` };
        current = [...current, note];
        setMessages(current);
        await persistFull({ messages: current, charLocations: locsNow });
        setSending(false); setTypingLabel(null); sendingRef.current = false;
        return;
      }
      if (responders.length === 0) { // 조용히 끝 (내가 대사를 대신 친 경우 등)
        await persistFull({ messages: current, charLocations: locsNow });
        setSending(false); setTypingLabel(null); sendingRef.current = false;
        return;
      }
      const turnReplies = [];
      let invNow = inventory;
      let failCount = 0;
      let lastErrorMsg = "";

      // 단역 응대: 이름을 부르면 그 단역이 대답, 가게 상황이면 주인/점원 등장, 새 인물 서술은 AI가 자동 인식
      const calledNpcName = raw && !hadNpcLine
        ? (npcNamesKnown.find((n) => raw.includes(n)) ||
           npcNamesKnown.find((n) => n.split(/\s+/).some((t) => t.length >= 2 && raw.includes(t))))
        : null;
      const spotHere = npcForSub(userLocation?.subId);
      const shopCalled = !!(spotHere && raw && !cutaway && !hadNpcLine && !calledNpcName && /(주인|사장|점원|이모|아저씨|아주머니|여기요|저기요|주문|메뉴|계산|추천|얼마)/.test(raw));
      const spotEntered = raw && !cutaway && !hadNpcLine && /(들어|도착|왔다|간다|가자)/.test(raw) ? NPC_SPOTS.find((sp) => sp.keys.some((k) => raw.includes(k))) : null;
      if (calledNpcName) {
        setTypingLabel(calledNpcName);
        try {
          const nm = await npcReply({ role: calledNpcName, emoji: "👤" }, current,
            `방금 사용자가 "${calledNpcName}"에게 말을 걸었거나 그를 언급했습니다. "${calledNpcName}"로서 자연스럽게 반응하세요.`);
          current = [...current, nm];
          setMessages(current);
          await persistFull({ messages: current, charLocations: locsNow });
        } catch (e) { console.error(e); }
      } else if (shopCalled || spotEntered) {
        const sp = shopCalled ? spotHere : spotEntered;
        setTypingLabel(sp.role);
        try {
          const nm = await npcReply(sp, current, shopCalled
            ? `방금 손님이 ${sp.role}에게 말을 걸었습니다. ${sp.role}로서 자연스럽게 대답하세요.`
            : `방금 손님 일행이 가게에 들어왔습니다. ${sp.role}로서 자연스럽게 맞이하세요.`);
          current = [...current, nm];
          setMessages(current);
          await persistFull({ messages: current, charLocations: locsNow });
        } catch (e) { console.error(e); }
      } else if (raw && !hadNpcLine && newlyMentioned.length === 0 && /(나타났|등장했|다가왔|들어왔|말을 걸어|말을 건넸|무리|순찰|일당|패거리|녀석들|놈들|저기)/.test(raw)) {
        // 등록 인물이 아닌 새 단역(들)이 서술에 등장했는지 AI가 판단 - 무리면 2~3명이 자기들끼리 대화
        try {
          const known = [...characters.map((cc) => cc.name), ...npcNamesKnown].join(", ");
          const ctx = current.slice(-8).filter((m) => m.kind !== "status")
            .map((m) => (m.kind === "narration" ? `(상황) ${m.content}` : `${nameOf(m.kind, m.speakerId)}: ${m.content}`)).join("\n");
          const detRaw = await callClaudeWithRetry(
            `롤플레잉 보조자입니다. 이미 등장 중인 인물: ${known || "(없음)"}. 방금 상황 서술에 위 목록에 없는 새로운 단역 인물이 등장했다면 만들어주세요. 한 명이면 그 인물의 첫 반응 하나, 무리(예: 헬멧단, 순찰대)라면 2~3명의 단역(예: 헬멧단원A, 헬멧단원B)이 자기들끼리 주고받는 대사를 순서대로 만드세요. 반드시 JSON 하나만 출력: {"npcs":[{"name":"호칭","reply":"*행동 묘사* 대사 (1~2문장)"}]}. 새 단역이 없으면 {"npcs":[]}.`,
            [{ role: "user", content: `${ctx}\n\n(방금 서술) ${raw}` }], 700);
          const dm = detRaw.replace(/```json|```/g, "").match(/\{[\s\S]*\}/);
          const dj = dm ? JSON.parse(dm[0]) : null;
          const list = (dj && Array.isArray(dj.npcs) ? dj.npcs : []).filter((n) => n && n.name && n.reply).slice(0, 3);
          for (const n of list) {
            setTypingLabel(n.name);
            current = [...current, { id: genId(), kind: "npc", speakerId: n.name, npcName: n.name, emoji: "👤", content: n.reply, ts: Date.now() }];
            setMessages(current);
            await persistFull({ messages: current, charLocations: locsNow });
            await new Promise((r) => setTimeout(r, 250));
          }
        } catch (e) { console.error(e); }
      }

      for (const char of responders) {
        setTypingLabel(char.name);
        let extra = extraGroupNote(char, coLocatedIds) + affectionNote(char.id) + timeNote(sceneNow) + outingNote(char) + charLocationNote(char, locsNow) + castKnowledgeNote(char, locsNow, coLocatedIds);
        if (cutaway) {
          const cutPlace = `${LOCATIONS.find((l) => l.id === sceneLoc.mainId)?.name || ""}${sceneLoc.subId ? " - " + sceneLoc.subId : ""}`;
          extra += `\n[장면 전환 - 매우 중요] 지금은 사용자(${profile?.name || "사용자"})가 이 자리에 없는 별도의 장면이며, 장소는 정확히 "${cutPlace}"입니다. 사용자는 다른 곳에 있으니 사용자에게 말을 걸거나 사용자가 여기 있는 것처럼 말하지 마세요. 이 장면에 있는 인물은 위 [지금 이 자리에 같이 있는 사람] 명단이 전부이며, 그 명단에 없는 인물은 이 방에 없습니다. 다른 방에 있는 인물이 여기 있는 것처럼 쓰지 마세요.`;
        }
        if (!priorSpoken.has(char.id)) {
          extra += `\n지금이 이 장면에서 "${char.name}"이(가) 처음 등장하는 순간입니다. 자연스럽게 등장하는 동작 묘사로 대사를 시작하세요 (예: *문을 열고 들어오며*).`;
        }
        if (loreContext) extra += `\n\n[세계관 로어북 정보 - 아래 내용을 설정에 반영하세요]\n${loreContext}`;
        if (raw && SUMMON_CUE.test(raw) && char.name && mentionsName(raw, char.name)) {
          extra += `\n\n[중요] 당신은 방금 막 이 자리에 도착해서 들어온 참입니다. 조금 전까지 다른 곳에 있었고, 지금 문을 열고 들어온 상황이니 그에 맞게 첫마디를 하세요. 예전에 있던 장소에서 하던 행동(먹던 것, 하던 일)을 이어서 묘사하면 안 됩니다.`;
        }
        // 사용자가 직접 연기 중인(또는 최근에 연기했던) 캐릭터의 대사를 대신 쓰지 못하게 함
        {
          const recentVoiced = new Set(current.slice(-14).filter((m) => m.byUser && m.speakerId).map((m) => m.speakerId));
          excludeIds.forEach((id) => recentVoiced.add(id));
          const playedNames = characters.filter((c) => recentVoiced.has(c.id) && c.id !== char.id).map((c) => c.name);
          if (playedNames.length > 0) {
            extra += `\n\n[매우 중요 - 사용자가 연기 중인 인물] 이번 장면에서 ${playedNames.map((n2) => `"${n2}"`).join(", ")}의 말과 행동은 ${profile?.name || "사용자"}가 직접 씁니다.` +
              ` 당신의 응답에 ${playedNames.join(", ")}의 대사를 절대 넣지 마세요. 그 인물이 뭐라고 대답할지, 어떤 표정을 짓는지 지어내지도 마세요.` +
              ` 당신은 그 인물의 말을 듣고 "${char.name}"이(가) 보이는 반응 하나만 씁니다.`;
          }
        }
        // 방금 나온 말을 "누가 말했는지"까지 정확히 붙여서 프롬프트 맨 끝에 박음
        if (!cutaway) {
          const turnInputs = current.slice(inputStartIdx).filter((m) => m.kind === "user" || m.kind === "character" || m.kind === "narration");
          if (turnInputs.length > 0) {
            const speakerOf = (m) => m.kind === "user" ? (profile?.name || "사용자")
              : m.kind === "narration" ? "상황"
              : (characters.find((c) => c.id === m.speakerId)?.name || "?");
            const lines = turnInputs.map((m) => `${speakerOf(m)}: ${m.content}`).join("\n");
            const lastReal = [...turnInputs].reverse().find((m) => m.kind !== "narration") || turnInputs[turnInputs.length - 1];
            const lastSpeaker = speakerOf(lastReal);
            extra += `\n\n[방금 이 자리에서 나온 말 — 이번 응답은 반드시 여기에 이어서 반응해야 합니다]\n${lines}` +
              `\n※ 마지막으로 말한 사람은 "${lastSpeaker}"입니다. 당신은 "${lastSpeaker}"에게 대답하는 것이지, 다른 사람에게 말하는 게 아닙니다.`;
            const callerOf = turnInputs.find((m) => char.name && mentionsName(m.content || "", char.name));
            if (callerOf) {
              extra += `\n※ "${speakerOf(callerOf)}"이(가) 당신("${char.name}")의 이름을 부르며 말을 걸었습니다. 반드시 그 사람에게 직접 답하세요. 질문이면 대답하고, 곤란하면 그 이유라도 말하세요. 무시하고 다른 화제로 넘어가면 안 됩니다.`;
            }
          }
        }
        const history = buildHistoryFor(char.id, current, locsNow);
        let reply = "";
        try { reply = await callClaudeWithRetry(buildPersonaSystem(char, memoryTextFor(char), profile, extra, castProfilesNote() + worldContextNote()), history, 400); }
        catch (e) { console.error(`${char.name} 응답 실패`, e); failCount += 1; lastErrorMsg = e?.message || String(e); continue; }
        // 남의 대사까지 써버렸으면 잘라내고, 자기 대사가 남지 않으면 한 번 더 생성
        const allNames = characters.map((c) => c.name);
        let cleaned = stripOtherSpeakers(reply, char.name, allNames);
        if (!cleaned) {
          try {
            const strict = extra + `\n\n[매우 중요] 방금 응답에서 다른 인물의 대사까지 대신 썼습니다. 이번에는 반드시 "${char.name}" 본인의 말과 행동만 쓰세요. "[이름]" 형태의 이름표를 절대 쓰지 말고, 다른 인물이 말하거나 주문하거나 반응하는 내용을 지어내지 마세요.`;
            const retry = await callClaudeWithRetry(buildPersonaSystem(char, memoryTextFor(char), profile, strict, castProfilesNote() + worldContextNote()), history, 400);
            cleaned = stripOtherSpeakers(retry, char.name, allNames) || retry.replace(/\[[^\]\n]{1,14}\]\s*/g, "").trim();
          } catch (e) { console.error(e); }
        }
        reply = cleaned || reply;
        const charMsg = { id: genId(), kind: "character", speakerId: char.id, content: reply || "...", ts: Date.now() };
        current = [...current, charMsg];
        turnReplies.push({ character: char, content: reply });
        priorSpoken.add(char.id);
        setMessages(current);
        await persistFull({ messages: current, inventory: invNow, presentIds: nextPresentIds, charLocations: locsNow });

        try {
          const giftName = await detectGiftFromReply(reply);
          if (giftName) {
            invNow = [...invNow, { id: genId(), itemId: null, name: giftName, image: "", cost: 0, fromCharacterId: char.id, fromCharacterName: char.name }];
            setInventory(invNow);
            await persistFull({ messages: current, inventory: invNow, presentIds: nextPresentIds, charLocations: locsNow });
            showToast?.(`${char.name}에게서 "${giftName}"을(를) 선물받았어요!`);
          }
        } catch (e) { console.error(e); }
      }
      setTypingLabel(null);

      // 아무도 대답하지 못했다면 조용히 넘어가지 않고 바로 알려줘요 (원인은 대부분 네트워크/일시적인 API 오류예요)
      if (responders.length > 0 && turnReplies.length === 0) {
        setError(`캐릭터 응답을 받아오지 못했어요${lastErrorMsg ? ` — ${lastErrorMsg}` : ""}. 잠시 후 다시 시도해주세요.`);
        showToast?.("응답에 실패했어요. 다시 시도해주세요.");
      } else if (failCount > 0) {
        showToast?.(`${failCount}명의 응답을 받아오지 못했어요`);
      }

      let nextScene = sceneNow;
      await persistFull({ messages: current, scene: sceneNow, charLocations: locsNow });
      if (turnReplies.length > 0 && statusOn) {
        sinceStatusRef.current += 1;
        if (sinceStatusRef.current >= STATUS_EVERY) {
          sinceStatusRef.current = 0;
          try {
            const recentText = current.slice(-10).filter((m) => m.kind === "user" || m.kind === "character" || m.kind === "narration" || m.kind === "npc")
              .map((m) => (m.kind === "narration" ? `(상황) ${m.content}` : `${nameOf(m.kind, m.speakerId)}: ${m.content}`)).join("\n");
            let sceneBlock = null;
            if (cfg.scene) {
              nextScene = await advanceAndDescribeScene(sceneNow, recentText, showToast);
              setScene(nextScene);
              sceneBlock = { date: formatDateLabel(nextScene.date), time: nextScene.time, location: nextScene.location, weather: nextScene.weather, situation: nextScene.situation };
            }
            const activeFields = STYLE_FIELDS.filter((f) => cfg[f.key]);
            const charBlocks = [];
            for (const r of turnReplies) {
              try {
                const cb = await generateCharacterStatus(r.character, activeFields, recentText, showToast);
                if (cb) charBlocks.push(cb);
              } catch (e) { console.error(e); }
            }
            if (sceneBlock || charBlocks.length > 0) {
              const statusMsg = { id: genId(), kind: "status", scene: sceneBlock, characters: charBlocks, ts: Date.now() };
              current = [...current, statusMsg];
              setMessages(current);
              await persistFull({ messages: current, scene: nextScene, inventory: invNow, presentIds: nextPresentIds, charLocations: locsNow });
            }
          } catch (e) {
            console.error("status generation failed", e);
            // 최소한 날짜/시간만이라도 보여줌
            if (cfg.scene) {
              const fb = advanceClock(scene.date || nowDateTime().date, scene.time || nowDateTime().time, 3);
              nextScene = { ...scene, ...fb };
              setScene(nextScene);
              const statusMsg = { id: genId(), kind: "status", scene: { date: formatDateLabel(nextScene.date), time: nextScene.time, location: nextScene.location, weather: nextScene.weather, situation: nextScene.situation }, characters: [], ts: Date.now() };
              current = [...current, statusMsg];
              setMessages(current);
              await persistFull({ messages: current, scene: nextScene, inventory: invNow, presentIds: nextPresentIds, charLocations: locsNow });
            }
          }
        }
      }
      if (!raw && turnReplies.length > 0) updatePlotPreview(turnReplies[turnReplies.length - 1]?.content || "");

      const newMem = await maybeUpdateMemory(current);
      if (newMem !== memory) await persistFull({ messages: current, memory: newMem, scene: nextScene, inventory: invNow, presentIds: nextPresentIds, charLocations: locsNow });
    } catch (e) {
      console.error(e);
      setError("응답을 받아오지 못했어요. 잠시 후 다시 시도해주세요.");
    } finally {
      setSending(false);
      setTypingLabel(null);
      sendingRef.current = false;
    }
  };

  const regenerateMessage = async (messageId) => {
    const idx = messages.findIndex((m) => m.id === messageId);
    if (idx === -1) return;
    const msg = messages[idx];
    if (msg.kind !== "character") return;
    const character = characters.find((c) => c.id === msg.speakerId);
    if (!character) return;
    setRegeneratingId(messageId);
    try {
      const historyBase = messages.slice(0, idx);
      const history = buildHistoryFor(character.id, historyBase);
      const scanText = historyBase.slice(-6).map((m) => m.content || "").join("\n");
      const loreContext = getLoreContext(attachedLore, scanText);
      let extra = extraGroupNote(character, new Set(characters.map((c) => c.id))) + affectionNote(character.id) + charLocationNote(character) + castKnowledgeNote(character);
      if (loreContext) extra += `\n\n[세계관 로어북 정보 - 아래 내용을 설정에 반영하세요]\n${loreContext}`;
      const reply = await callClaudeWithRetry(buildPersonaSystem(character, memoryTextFor(character), profile, extra, castProfilesNote() + worldContextNote()), history, 400);
      const next = messages.map((m, i) => (i === idx ? { ...m, content: reply || "..." } : m));
      setMessages(next);
      await persistFull({ messages: next });
    } catch (e) { console.error(e); showToast?.(`다시 생성하지 못했어요 (${e?.message || e})`); }
    finally { setRegeneratingId(null); }
  };

  const doRestart = async () => {
    setMenuOpen(false);
    const seed = plot.intro ? [{ id: genId(), kind: "narration", content: plot.intro, ts: Date.now() }] : [];
    const freshMem = { shared: "", byChar: {}, promises: [] };
    const freshScene = DEFAULT_SCENE();
    const freshLocations = ensureCharLocations({}, characters);
    setMessages(seed); setMemory(freshMem); setScene(freshScene); setJobLog([]);
    setAffection({}); setPresentIds([]);
    const freshUserLoc2 = DEFAULT_USER_LOCATION();
    setCharLocations(freshLocations); setUserLocation(freshUserLoc2); setCompanionIds([]); setOuting(null);
    sinceMemoryRef.current = 0; sinceStatusRef.current = 0;
    await persistFull({ messages: seed, memory: freshMem, scene: freshScene, jobLog: [], affection: {}, presentIds: [], charLocations: freshLocations, userLocation: freshUserLoc2, companionIds: [], outing: null });
    showToast?.("대화를 새로 시작했어요 (호감도도 초기화됐어요)");
  };
  const toggleStatus = async () => {
    const next = !statusOn;
    setMenuOpen(false);
    setStatusEnabled(next);
    await persistFull({ statusEnabled: next });
    showToast?.(next ? "상태창을 켰어요" : "상태창을 껐어요");
  };
  const stub = (msg) => { setMenuOpen(false); showToast?.(msg || "준비 중인 기능이에요"); };

  const enterDeleteMode = () => { setMenuOpen(false); setDeleteMode(true); setSelectedDeleteId(null); };
  const cancelDeleteMode = () => { setDeleteMode(false); setSelectedDeleteId(null); };
  const confirmDeleteFromPoint = async () => {
    if (!selectedDeleteId) return;
    const idx = messages.findIndex((m) => m.id === selectedDeleteId);
    if (idx === -1) return;
    const next = messages.slice(0, idx);
    setMessages(next);
    await persistFull({ messages: next });
    setDeleteMode(false);
    setSelectedDeleteId(null);
    showToast?.("선택한 지점부터 삭제했어요");
  };

  const toggleBookmark = async (messageId) => {
    const exists = bookmarks.find((b) => b.messageId === messageId);
    const next = exists ? bookmarks.filter((b) => b.messageId !== messageId) : [...bookmarks, { id: genId(), messageId, ts: Date.now() }];
    setBookmarks(next);
    await persistFull({ bookmarks: next });
    showToast?.(exists ? "책갈피를 제거했어요" : "책갈피를 꽂았어요");
  };
  const jumpToMessage = (messageId) => {
    setRoomSheet(null);
    setTimeout(() => {
      document.getElementById(`msg-${messageId}`)?.scrollIntoView({ behavior: "smooth", block: "center" });
      setHighlightId(messageId);
      setTimeout(() => setHighlightId(null), 1600);
    }, 60);
  };

  // 단역 NPC 대사 생성 (가게 주인장, 점원 등)
  const npcReply = async (spot, current, instruction) => {
    const lines = current.slice(-14)
      .filter((m) => m.kind === "user" || m.kind === "character" || m.kind === "narration" || m.kind === "npc")
      .map((m) => (m.kind === "narration" ? `(상황) ${m.content}` : `${nameOf(m.kind, m.speakerId)}: ${m.content}`)).join("\n");
    const place = userLocation ? `${LOCATIONS.find((l) => l.id === userLocation.mainId)?.name || ""} ${userLocation.subId || ""}`.trim() : "이 가게";
    const sys = buildNpcSystem(spot.role, place, profile?.name || "손님");
    const reply = await callClaudeWithRetry(sys, [{ role: "user", content: `[지금까지의 상황]\n${lines || "(대화 시작)"}\n\n${instruction}` }], 400);
    return { id: genId(), kind: "npc", speakerId: spot.role, npcName: spot.role, emoji: spot.emoji, content: reply || "...", ts: Date.now() };
  };

  const isBesideMe = (cid, locs = charLocations, uloc = userLocation) => {
    if (companionIds.includes(cid)) return true;
    const l = locs[cid];
    if (!l || l.status !== "here" || !uloc) return false;
    return l.mainId === uloc.mainId && (!uloc.subId || l.subId === uloc.subId);
  };
  // 약속을 지켰을 때 목록에서 지우고, 기억에도 "이미 지켜졌다"고 남겨서 다시 안 생기게 함
  const completePromise = async (memIndex, description) => {
    const list = memory?.promises || [];
    if (memIndex < 0 || memIndex >= list.length) return;
    const done = list[memIndex];
    const nextPromises = list.filter((_, i) => i !== memIndex);
    const doneLine = `- ${description || done?.description || "약속"} — 이미 지켜져서 완료됨`;
    const nextShared = `${memory?.shared || ""}\n${doneLine}`.trim();
    const nextMemory = { ...(memory || {}), shared: nextShared, promises: nextPromises };
    setMemory(nextMemory);
    showToast?.("약속을 완료 처리했어요");
    await persistFull({ memory: nextMemory });
  };

  // 의뢰・임무 나가기 (동행자와 함께 나가고, 임무 목록에 표시됨)
  // 지도가 꼬였을 때: 동행 중인 사람만 남기고 나머지는 시간대에 맞는 자기 자리로 되돌림
  const scatterOthers = async () => {
    const mins = minutesOfTime(scene.time);
    const next = { ...charLocations };
    let moved = 0;
    characters.forEach((c) => {
      if (companionIds.includes(c.id)) return; // 동행 중인 사람은 그대로
      const cur = next[c.id];
      if (!cur) return;
      // 자기 임무・알바로 나가있는 사람은 건드리지 않음
      if (cur.status === "mission" && !cur.missionWithUser) return;
      if (cur.status === "moving") return;
      // 화면에 "당신과 같이있음"으로 뜨는 사람 전부가 대상
      // (지난 의뢰의 "나와 함께 임무 중" 상태로 남아 있는 경우도 포함)
      const withMe = (cur.status === "mission" && cur.missionWithUser) ||
        (cur.status === "here" && userLocation &&
          cur.mainId === userLocation.mainId && (!userLocation.subId || cur.subId === userLocation.subId));
      if (!withMe) return;
      const t = scheduleTarget(c, mins);
      next[c.id] = { mainId: t.mainId, subId: t.subId, status: "here" };
      moved += 1;
    });
    setCharLocations(next);
    showToast?.(moved > 0 ? `${moved}명을 각자 자리로 보냈어요` : "정리할 인원이 없어요");
    await persistFull({ charLocations: next });
  };

  const startMission = async (name, ids) => {
    const info = { place: name, kind: "의뢰", mission: true };
    setOuting(info);
    setCompanionIds(ids);
    const loc = { mainId: "outing", subId: name };
    setUserLocation(loc);
    setRoomSheet(null);
    setCutSceneId(null); setCutSceneSub(null);
    const nextLocs = { ...charLocations };
    ids.forEach((id) => {
      nextLocs[id] = { mainId: "outing", subId: name, status: "mission", missionName: name, missionWithUser: true, missionWith: ids.filter((x) => x !== id) };
    });
    setCharLocations(nextLocs);
    const names = characters.filter((c) => ids.includes(c.id)).map((c) => c.name);
    const msg = { id: genId(), kind: "narration", ts: Date.now(),
      content: `*${profile?.name || "나"}는 ${names.length ? names.join(", ") + "와(과) 함께 " : "혼자 "}"${name}"을(를) 하러 나갔다*` };
    const current = [...messages, msg];
    setMessages(current);
    showToast?.(`${name} 시작`);
    await persistFull({ messages: current, userLocation: loc, charLocations: nextLocs, companionIds: ids, outing: info });
  };
  const endMission = async () => {
    const name = outing?.place || "의뢰";
    const ids = companionIds;
    const names = characters.filter((c) => ids.includes(c.id)).map((c) => c.name);
    const loc = DEFAULT_USER_LOCATION();
    setOuting(null);
    setUserLocation(loc);
    setRoomSheet(null);
    const nextLocs = { ...charLocations };
    ids.forEach((id) => { nextLocs[id] = { mainId: loc.mainId, subId: loc.subId, status: "here" }; });
    setCharLocations(nextLocs);
    const msg = { id: genId(), kind: "narration", ts: Date.now(),
      content: `*"${name}"을(를) 마치고 ${names.length ? names.join(", ") + "와(과) 함께 " : ""}돌아왔다*` };
    const current = [...messages, msg];
    setMessages(current);
    showToast?.("의뢰를 마쳤어요");
    await persistFull({ messages: current, userLocation: loc, charLocations: nextLocs, outing: null });
  };

  const startOuting = async (place, kind, ids) => {
    const info = { place, kind };
    setOuting(info);
    await moveToLocation({ mainId: "outing", subId: place }, ids, {
      outing: info,
      moveLabel: (names) => `*${profile?.name || "나"}는 ${names.length ? names.join(", ") + "와(과) 함께 " : "혼자 "}${place}(으)로 ${kind} 일정을 떠났다*`,
    });
  };
  const endOuting = async () => {
    const kind = outing?.kind || "당일치기";
    const place = outing?.place || "";
    if (outing?.mission) { await endMission(); return; } // 의뢰는 시간 점프 없이 복귀
    const jump = kind === "당일치기" ? 4 * 60 : kind === "1박 2일" ? 24 * 60 : kind === "2박 3일" ? 48 * 60 : kind === "3박 4일" ? 72 * 60 : 24 * 60;
    const t = advanceClock(scene.date, scene.time, jump);
    const nextScene = { ...scene, date: t.date, time: t.time };
    setScene(nextScene);
    setOuting(null);
    await moveToLocation(DEFAULT_USER_LOCATION(), companionIds, {
      outing: null,
      moveLabel: (names) => `*${place ? place + " 일정을 마치고 " : ""}${names.length ? names.join(", ") + "와(과) 함께 " : ""}돌아왔다*`,
    });
    await persistFull({ scene: nextScene });
  };

  const toggleCompanion = async (charId) => {
    const on = companionIds.includes(charId);
    const next = on ? companionIds.filter((id) => id !== charId) : [...companionIds, charId];
    setCompanionIds(next);
    const name = characters.find((c) => c.id === charId)?.name || "";
    let nextLocs = charLocations;
    if (!on) {
      nextLocs = syncCompanions(charLocations, userLocation, [charId]);
      setCharLocations(nextLocs);
    }
    showToast?.(on ? `${name}와(과) 헤어졌어요` : `${name}와(과) 함께 다녀요`);
    await persistFull({ companionIds: next, charLocations: nextLocs });
  };

  const moveToLocation = async (loc, nextCompanionIds, opts = {}) => {
    setRoomSheet(null);
    setCutSceneId(null); setCutSceneSub(null);
    setUserLocation(loc);
    const companions = Array.isArray(nextCompanionIds) ? nextCompanionIds : companionIds;
    if (Array.isArray(nextCompanionIds)) setCompanionIds(nextCompanionIds);
    const mainName = LOCATIONS.find((l) => l.id === loc.mainId)?.name;
    showToast?.(`${mainName}${loc.subId ? " - " + loc.subId : ""}(으)로 이동했어요`);

    // 함께 임무 중이던 캐릭터들은 임무를 끝내고 각자 자리로 복귀
    let clearedLocs = { ...charLocations };
    Object.keys(clearedLocs).forEach((id) => {
      const l = clearedLocs[id];
      if (l && l.status === "mission" && l.missionWithUser) {
        clearedLocs[id] = { mainId: loc.mainId, subId: loc.subId || pickSub(loc.mainId), status: "here" };
      }
    });
    // 동행 중인 캐릭터는 나를 따라 같이 이동
    clearedLocs = syncCompanions(clearedLocs, loc, companions);
    setCharLocations(clearedLocs);
    const companionNames = characters.filter((c) => companions.includes(c.id)).map((c) => c.name);
    const there = characters.filter((c) => {
      const cl = clearedLocs[c.id];
      if (companions.includes(c.id)) return false; // 같이 온 사람은 인사 대상이 아님
      return cl && cl.status === "here" && cl.mainId === loc.mainId && (!loc.subId || cl.subId === loc.subId);
    });
    const moveMsg = {
      id: genId(), kind: "narration",
      content: opts.moveLabel
        ? opts.moveLabel(companionNames)
        : `*${profile?.name || "나"}가 ${mainName}${loc.subId ? " " + loc.subId : ""}(으)로 이동했다${companionNames.length ? ` (${companionNames.join(", ")}와 함께)` : ""}*`,
      ts: Date.now(),
    };
    let current = [...messages, moveMsg];
    setMessages(current);
    await persistFull({ messages: current, userLocation: loc, charLocations: clearedLocs, companionIds: companions, ...(opts.outing !== undefined ? { outing: opts.outing } : {}) });

    setSending(true);
    const spotArrived = npcForSub(loc.subId);
    if (spotArrived) {
      setTypingLabel(spotArrived.role);
      try {
        const nm = await npcReply(spotArrived, current, `방금 손님(${profile?.name || "손님"}) 일행이 가게에 들어왔습니다. ${spotArrived.role}로서 첫 인사와 안내를 1~2문장으로 하세요.`);
        current = [...current, nm];
        setMessages(current);
        await persistFull({ messages: current, userLocation: loc, charLocations: clearedLocs });
      } catch (e) { console.error(e); }
    }
    if (there.length === 0) { setSending(false); setTypingLabel(null); return; }
    const greeters = there.sort(() => Math.random() - 0.5).slice(0, MAX_RESPONDERS);
    const coLocatedIds = new Set(there.map((c) => c.id));
    for (const g of greeters) {
      setTypingLabel(g.name);
      try {
        const history = buildHistoryFor(g.id, current);
        const extra = extraGroupNote(g, coLocatedIds) + affectionNote(g.id) + timeNote() + outingNote(g) + charLocationNote(g) + castKnowledgeNote(g) +
          `\n[매우 중요] 방금 사용자가 이 장소로 막 들어왔습니다. 자연스럽게 그 등장에 반응하며 인사하거나 말을 거세요.`;
        const reply = await callClaudeWithRetry(buildPersonaSystem(g, memoryTextFor(g), profile, extra, castProfilesNote() + worldContextNote()), history, 400);
        const gm = { id: genId(), kind: "character", speakerId: g.id, content: reply || "...", ts: Date.now() };
        current = [...current, gm];
        setMessages(current);
        await persistFull({ messages: current, userLocation: loc, charLocations: clearedLocs });
      } catch (e) { console.error(e); }
    }
    setSending(false); setTypingLabel(null);
  };

  const doJob = async (job) => {
    if (jobsDoneToday >= MAX_JOBS_PER_DAY) { showToast?.(`오늘은 이미 알바・의뢰를 ${MAX_JOBS_PER_DAY}번 했어요. 내일 다시 시도해보세요.`); return; }

    const targetDate = job.date || scene.date;
    const targetTime = job.time || scene.time;
    const timeChanged = targetDate !== scene.date || targetTime !== scene.time;
    const nextScene = timeChanged ? { ...scene, date: targetDate, time: targetTime } : scene;

    const nextCredits = credits + (job.reward || 0);
    const nextJobLog = [...jobLog, { jobId: job.id, date: targetDate }];
    setCredits(nextCredits);
    setJobLog(nextJobLog);
    if (timeChanged) setScene(nextScene);
    setRoomSheet(null);
    showToast?.(`+${job.reward} 크레딧을 받았어요`);

    const companions = (job.companionIds || []).map((id) => characters.find((c) => c.id === id)).filter(Boolean);
    // 알바 장면에는 동행 캐릭터만 함께 있음
    const jobPresentIds = companions.map((c) => c.id);
    if (companions.length > 0) setPresentIds(jobPresentIds);
    const timeNote = timeChanged ? ` (${formatDateLabel(targetDate)} ${targetTime})` : "";
    const jobMsg = {
      id: genId(), kind: "narration",
      content: `*${profile?.name || "나"}${companions.length ? `가 ${companions.map((c) => c.name).join(", ")}와(과) 함께` : "가"} "${job.name}"${timeNote}을(를) 시작했다*`,
      ts: Date.now(),
    };
    let current = [...messages, jobMsg];
    setMessages(current);
    await persistFull({ messages: current, credits: nextCredits, scene: nextScene, jobLog: nextJobLog, presentIds: companions.length > 0 ? jobPresentIds : presentIds });

    if (companions.length === 0) return;
    const presentSet = new Set(jobPresentIds);
    const nextCharLocations = { ...charLocations };
    companions.forEach((c) => {
      nextCharLocations[c.id] = { ...(nextCharLocations[c.id] || { mainId: guessHomeLocationId(c) }), status: "mission", missionName: job.name, missionWithUser: true };
    });
    setCharLocations(nextCharLocations);
    setSending(true);
    for (const comp of companions.slice(0, 6)) {
      setTypingLabel(comp.name);
      try {
        const history = buildHistoryFor(comp.id, current);
        const extra = extraGroupNote(comp, presentSet) + affectionNote(comp.id) + charLocationNote(comp) + castKnowledgeNote(comp) +
          `\n[매우 중요] 지금 막 사용자와 함께(또는 위에 명시된 동행끼리만) "${job.name}"을(를) 시작하는 참입니다. 출발하거나 일을 시작하는 이 순간의 대사를 하세요 — 각오, 작전 이야기, 설렘/투덜거림 등. 아직 일이 끝나지 않았으니 결과를 말하지 마세요. 이 자리에 없는 다른 캐릭터를 등장시키지 마세요.`;
        const reply = await callClaudeWithRetry(buildPersonaSystem(comp, memoryTextFor(comp), profile, extra, castProfilesNote() + worldContextNote()), history, 400);
        const cm = { id: genId(), kind: "character", speakerId: comp.id, content: reply || "...", ts: Date.now() };
        current = [...current, cm];
        setMessages(current);
        await persistFull({ messages: current, credits: nextCredits, scene: nextScene, jobLog: nextJobLog, presentIds: jobPresentIds, charLocations: nextCharLocations });
      } catch (e) { console.error(e); }
    }
    setSending(false); setTypingLabel(null);
  };

  const buyItem = async (item) => {
    if (credits < item.cost) { showToast?.("크레딧이 부족해요"); return; }
    const nextCredits = credits - item.cost;
    const nextInventory = [...inventory, { id: genId(), itemId: item.id, name: item.name, image: item.image, cost: item.cost, affectionGain: item.affectionGain }];
    setCredits(nextCredits);
    setInventory(nextInventory);
    await persistFull({ credits: nextCredits, inventory: nextInventory });
    showToast?.(`${item.name}을(를) 구매했어요`);
  };
  const useItem = async (item) => {
    const idx = inventory.findIndex((x) => x.id === item.id);
    const nextInventory = idx === -1 ? inventory : [...inventory.slice(0, idx), ...inventory.slice(idx + 1)];
    setInventory(nextInventory);
    setRoomSheet(null);
    const useMsg = { id: genId(), kind: "narration", content: `*${profile?.name || "나"}가 "${item.name}"을(를) 사용했다*`, ts: Date.now() };
    let current = [...messages, useMsg];
    setMessages(current);
    await persistFull({ messages: current, inventory: nextInventory });
    if (characters.length === 0) return;
    const presentNow = characters.filter((c) => presentIds.includes(c.id));
    const pool = presentNow.length > 0 ? presentNow : characters;
    const reactor = pool[Math.floor(Math.random() * pool.length)];
    setSending(true); setTypingLabel(reactor.name);
    try {
      const history = buildHistoryFor(reactor.id, current);
      const extra = extraGroupNote(reactor, new Set(characters.map((c) => c.id))) + affectionNote(reactor.id) + charLocationNote(reactor) + castKnowledgeNote(reactor) + `\n방금 사용자가 "${item.name}"을(를) 사용하는 모습을 봤습니다. 그것에 대한 반응을 자연스럽게 표현하며 말하세요.`;
      const reply = await callClaudeWithRetry(buildPersonaSystem(reactor, memoryTextFor(reactor), profile, extra, castProfilesNote() + worldContextNote()), history, 400);
      const rm = { id: genId(), kind: "character", speakerId: reactor.id, content: reply || "...", ts: Date.now() };
      current = [...current, rm];
      setMessages(current);
      await persistFull({ messages: current, inventory: nextInventory });
    } catch (e) { console.error(e); }
    setSending(false); setTypingLabel(null);
  };
  const giveGift = async (invItem, character) => {
    const idx = inventory.findIndex((x) => x.id === invItem.id);
    const nextInventory = idx === -1 ? inventory : [...inventory.slice(0, idx), ...inventory.slice(idx + 1)];
    const bump = invItem.affectionGain != null && invItem.affectionGain !== ""
      ? clamp(parseInt(invItem.affectionGain) || 0, 0, 30)
      : Math.min(10, Math.max(3, Math.round((invItem.cost || 10) / 15) + 3));
    const nextAffection = { ...affection, [character.id]: clamp((affection[character.id] ?? AFFECTION_DEFAULT) + bump, AFFECTION_MIN, AFFECTION_MAX) };
    setInventory(nextInventory);
    setAffection(nextAffection);
    setRoomSheet(null);

    const giftMsg = { id: genId(), kind: "narration", content: `*${profile?.name || "나"}가 ${character.name}에게 "${invItem.name}"을(를) 선물했다*`, ts: Date.now() };
    let current = [...messages, giftMsg];
    setMessages(current);
    await persistFull({ messages: current, inventory: nextInventory, affection: nextAffection });

    setSending(true);
    setTypingLabel(character.name);
    try {
      const presentSet = new Set([...presentIds, character.id]);
      const history = buildHistoryFor(character.id, current);
      const extra = extraGroupNote(character, presentSet) + affectionNote(character.id) + charLocationNote(character) + castKnowledgeNote(character) +
        `\n[매우 중요] 방금 사용자가 당신에게 "${invItem.name}"을(를) 직접 선물로 건넸습니다. 당신의 이번 대사는 반드시 이 "${invItem.name}" 선물을 받은 것에 대한 반응이어야 합니다. 선물을 받아들고, 그에 대한 감정을 표현하세요. 선물과 무관한 다른 이야기를 하지 마세요.`;
      const reply = await callClaudeWithRetry(buildPersonaSystem(character, memoryTextFor(character), profile, extra, castProfilesNote() + worldContextNote()), history, 400);
      const charMsg = { id: genId(), kind: "character", speakerId: character.id, content: reply || "...", ts: Date.now() };
      current = [...current, charMsg];
      setMessages(current);
      await persistFull({ messages: current, inventory: nextInventory, affection: nextAffection });
    } catch (e) { console.error(e); }
    setSending(false); setTypingLabel(null);
    showToast?.(`${character.name}에게 선물을 줬어요 (+${bump} 호감도)`);
  };

  if (!plot) return null;

  return (
    <div className="lt-screen-full">
      <div className="lt-chat-header">
        <button className="lt-iconbtn" onClick={onBack}><ChevronLeft size={20} /></button>
        <PlotCover plot={plot} size={32} />
        <div className="lt-chat-header-text">
          <div className="lt-chat-header-name">{plot.title}</div>
          <div className="lt-chat-header-sub">{characters.map((c) => c.name).join(", ")}</div>
        </div>
        <div className="lt-profile-pill-wrap">
          <button className="lt-profile-pill" onClick={() => setProfilePickOpen((v) => !v)}>{profile?.name || "프로필"} <ChevronDown size={13} /></button>
          {profilePickOpen && (
            <div className="lt-profile-pick-menu">
              {profiles.map((p) => (
                <div key={p.id} className={"lt-profile-pick-item" + (p.id === activeProfileId ? " on" : "")}
                  onClick={async () => { setActiveProfileId(p.id); setProfilePickOpen(false); await persistFull({ activeProfileId: p.id }); }}>
                  {p.name}
                </div>
              ))}
              <div className="lt-profile-pick-item add" onClick={() => { setProfilePickOpen(false); onOpenProfileForm(null); }}><Plus size={12} /> 새 프로필</div>
            </div>
          )}
        </div>
        <button className="lt-iconbtn" onClick={() => setMenuOpen((v) => !v)}><Menu size={19} /></button>
      </div>

      {menuOpen && (
        <div className="lt-menu-overlay" onClick={() => setMenuOpen(false)}>
          <div className="lt-menu-panel" onClick={(e) => e.stopPropagation()}>
            <div className="lt-menu-credit-pill">💰 {credits} 크레딧</div>
            <button className="lt-menu-item" onClick={doRestart}>
              <RotateCcw size={16} /><div><div>새로하기</div><div className="lt-menu-item-sub">현재 내용을 초기화하고 다시 시작해요</div></div>
            </button>
            <button className="lt-menu-item danger" onClick={enterDeleteMode}>
              <Trash2 size={16} /><div><div>대화 삭제</div><div className="lt-menu-item-sub">원하는 지점을 선택해서 그 이후를 삭제해요</div></div>
            </button>
            <div className="lt-menu-divider" />
            <button className="lt-menu-item" onClick={() => { setMenuOpen(false); onOpenProfileForm(activeProfileId); }}>
              <Users size={16} /><div style={{ flex: 1 }}>대화 프로필</div><span className="lt-menu-item-value">{profile?.name} <ChevronRight size={14} /></span>
            </button>
            <button className="lt-menu-item" onClick={toggleStatus}>
              <ListChecks size={16} /><div style={{ flex: 1 }}>상태창</div><span className="lt-menu-item-value">{statusOn ? "사용" : "사용 안 함"} <ChevronRight size={14} /></span>
            </button>
            <button className="lt-menu-item" onClick={() => { setMenuOpen(false); setRoomSheet("affection"); }}>
              <Heart size={16} /><div style={{ flex: 1 }}>호감도</div><ChevronRight size={14} />
            </button>
            <button className="lt-menu-item" onClick={() => { setMenuOpen(false); setRoomSheet("map"); }}>
              <MapPinIcon size={16} /><div style={{ flex: 1 }}>GPS 지도</div><ChevronRight size={14} />
            </button>
            <div className="lt-usage-box">
              <div className="lt-usage-title">이번 세션 토큰 ({USAGE.calls}회 호출)</div>
              <div className="lt-usage-row"><span>새 입력</span><b>{USAGE.input.toLocaleString()}</b></div>
              <div className="lt-usage-row"><span>캐시 읽기 (10% 요금)</span><b style={{ color: USAGE.cacheRead > 0 ? "#6ee7a0" : "#ff8a8a" }}>{USAGE.cacheRead.toLocaleString()}</b></div>
              <div className="lt-usage-row"><span>캐시 저장</span><b>{USAGE.cacheWrite.toLocaleString()}</b></div>
              <div className="lt-usage-row"><span>출력</span><b>{USAGE.output.toLocaleString()}</b></div>
              <div className="lt-usage-note">
                {USAGE.cacheRead > 0
                  ? "캐시 작동 중 — 캐시 읽기만큼 요금이 1/10입니다."
                  : "아직 캐시 읽기가 0이에요. 몇 턴 더 대화한 뒤 다시 확인해보세요."}
              </div>
            </div>
            <div className="lt-menu-divider" />
            <button className="lt-menu-item" onClick={() => { setMenuOpen(false); setRoomSheet("jobs"); }}>
              <Briefcase size={16} /><div style={{ flex: 1 }}>일하기 (알바・의뢰)</div><ChevronRight size={14} />
            </button>
            <button className="lt-menu-item" onClick={() => { setMenuOpen(false); setRoomSheet("shop"); }}>
              <ShoppingBag size={16} /><div style={{ flex: 1 }}>상점</div><ChevronRight size={14} />
            </button>
            <button className="lt-menu-item" onClick={() => { setMenuOpen(false); setRoomSheet("inventory"); }}>
              <Gift size={16} /><div style={{ flex: 1 }}>인벤토리(선물)</div><ChevronRight size={14} />
            </button>
            <div className="lt-menu-divider" />
            <button className="lt-menu-item" onClick={() => { setMenuOpen(false); setRoomSheet("bookmarks"); }}>
              <Bookmark size={16} /><div style={{ flex: 1 }}>책갈피 목록</div><ChevronRight size={14} />
            </button>
            <div className="lt-menu-divider" />
            <button className="lt-menu-item" onClick={onExitToList}><LogOut size={16} /><div>대화방 나가기</div></button>
          </div>
        </div>
      )}

      <button className="lt-fab-back" onClick={onBack} title="뒤로가기"><ChevronLeft size={20} /></button>

      <div className="lt-chat-scroll" ref={scrollRef}>
          {!loaded && <div className="lt-muted lt-pad">불러오는 중…</div>}
          {loaded && messages.length === 0 && <div className="lt-empty-hint lt-pad">{characters.map((c) => c.name).join(", ")}에게 첫 마디를 건네보세요.</div>}
          {messages.map((m) => {
            let content;
            if (m.kind === "narration") {
              content = <div className="lt-narration"><AlignLeft size={13} /><span>{m.content}</span></div>;
            } else if (m.kind === "status") {
              content = <StatusBlockView status={m} />;
            } else if (m.kind === "npc") {
              content = (
                <div className="lt-turn-row char">
                  <div className="lt-npc-avatar">👤</div>
                  <div className="lt-turn-text">
                    <div className="lt-turn-name">{m.npcName || "단역"}</div>
                    <div className="lt-turn-content">{renderMessageContent(m.content)}</div>
                  </div>
                </div>
              );
            } else {
              const isUser = m.kind === "user";
              const speaker = !isUser ? characters.find((c) => c.id === m.speakerId) : null;
              const bookmarked = bookmarks.some((b) => b.messageId === m.id);
              content = (
                <div className={"lt-turn-row " + (isUser ? "user" : "char")}>
                  {!isUser && (
                    <button className="lt-avatar-btn" onClick={(e) => { if (deleteMode) return; e.stopPropagation(); setDetailCharId(speaker?.id); }}>
                      <Avatar name={speaker?.name} image={speaker?.images?.[0]} size={26} />
                    </button>
                  )}
                  <div className="lt-turn-text">
                    <div className="lt-turn-name">{isUser ? (profile?.name || "나") : speaker?.name}</div>
                    <div className="lt-turn-content">{renderMessageContent(m.content)}</div>
                    {!deleteMode && (
                      <div className="lt-turn-actions">
                        {m.kind === "character" && (
                          <button className="lt-msg-action" onClick={(e) => { e.stopPropagation(); regenerateMessage(m.id); }} disabled={regeneratingId === m.id} title="다시 생성">
                            {regeneratingId === m.id ? <Loader2 size={12} className="lt-spin" /> : <RotateCcw size={12} />}
                          </button>
                        )}
                        <button className="lt-msg-action" onClick={(e) => { e.stopPropagation(); toggleBookmark(m.id); }} title="책갈피">
                          <Bookmark size={12} fill={bookmarked ? "currentColor" : "none"} />
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              );
            }
            return (
              <div key={m.id} id={`msg-${m.id}`}
                className={
                  (deleteMode ? "lt-delete-select" + (selectedDeleteId === m.id ? " selected" : "") : "") +
                  (highlightId === m.id ? " lt-highlight" : "")
                }
                onClick={deleteMode ? () => setSelectedDeleteId(m.id) : undefined}>
                {content}
              </div>
            );
          })}
          {sending && <Typing label={typingLabel} />}
        </div>

      {error && <div className="lt-error lt-pad">{error}</div>}

      {!deleteMode && (
        <div className="lt-clockbar">
          <span>{formatDateLabel(scene.date)}</span>
          <span className="lt-clockbar-time">{formatClock(scene.time)}</span>
          <span>{dayPartOf(minutesOfTime(scene.time))}</span>
        </div>
      )}

      {deleteMode ? (
        <div className="lt-input-bar lt-delete-bar">
          <button className="lt-btn" onClick={cancelDeleteMode}>취소</button>
          <div className="lt-muted" style={{ flex: 1, textAlign: "center", fontSize: 12 }}>삭제할 지점을 선택하세요</div>
          <button className="lt-btn danger" disabled={!selectedDeleteId} onClick={confirmDeleteFromPoint}>선택 지점부터 삭제</button>
        </div>
      ) : (
        <div className="lt-input-bar">
          <button
            className="lt-action-toggle"
            title="행동 묘사 삽입"
            onClick={() => {
              const el = inputRef.current;
              const pos = el ? el.selectionStart ?? input.length : input.length;
              const next = input.slice(0, pos) + "**" + input.slice(pos);
              setInput(next);
              requestAnimationFrame(() => {
                if (el) { el.focus(); el.setSelectionRange(pos + 1, pos + 1); }
              });
            }}
          >*</button>
          <input
            ref={inputRef}
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
            placeholder="내용 입력하기 (@이름: 대사 / @: 상황설명 / 비워두고 보내면 대화가 이어져요)"
            disabled={sending}
          />
          <button className="lt-send" onClick={send} disabled={sending}>
            {sending ? <Loader2 size={16} className="lt-spin" /> : <Send size={16} />}
          </button>
        </div>
      )}

      <CharacterDetailSheet character={characters.find((c) => c.id === detailCharId)} memory={memory} characters={characters} jobs={plot.jobs} jobLog={jobLog} currentDate={scene.date} onCompletePromise={completePromise} onClose={() => setDetailCharId(null)} />
      {roomSheet === "affection" && <AffectionSheet characters={characters} affection={affection} onClose={() => setRoomSheet(null)} />}
      {roomSheet === "map" && (
        <MapSheet
          characters={characters} charLocations={charLocations} userLocation={userLocation}
          companionIds={companionIds}
          outing={outing}
          profile={profile}
          onToggleCompanion={toggleCompanion}
          onStartOuting={startOuting}
          onEndOuting={endOuting}
          onStartMission={startMission}
          onEndMission={endMission}
          onScatterOthers={scatterOthers}
          onSetUserLocation={(loc, ids) => moveToLocation(loc, ids)}
          onClose={() => setRoomSheet(null)}
        />
      )}
      {roomSheet === "jobs" && <JobsSheet jobs={plot.jobs} characters={characters} jobsDoneToday={jobsDoneToday} jobLog={jobLog} currentDate={scene.date} onDoJob={doJob} onClose={() => setRoomSheet(null)} />}
      {roomSheet === "shop" && <ShopSheet items={plot.shopItems} credits={credits} onBuy={buyItem} onClose={() => setRoomSheet(null)} />}
      {roomSheet === "inventory" && <InventorySheet inventory={inventory} characters={characters} onUse={useItem} onGive={giveGift} onClose={() => setRoomSheet(null)} />}
      {roomSheet === "bookmarks" && (
        <BookmarksSheet
          bookmarks={bookmarks} messages={messages} characters={characters}
          onJump={jumpToMessage}
          onRemove={async (id) => { const next = bookmarks.filter((b) => b.id !== id); setBookmarks(next); await persistFull({ bookmarks: next }); }}
          onClose={() => setRoomSheet(null)}
        />
      )}
    </div>
  );
}

.lt-toast { position:absolute; bottom:78px; left:50%; transform:translateX(-50%); background:#26262f; border:1px solid var(--border); color:#fff; font-size:12px; padding:9px 16px; border-radius:20px; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,0.4); }

.lt-confirm-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.55); z-index:80; display:flex; align-items:center; justify-content:center; padding:24px; }
.lt-confirm-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px 18px 16px; width:100%; max-width:280px; box-shadow:0 12px 30px rgba(0,0,0,0.5); }
.lt-confirm-msg { font-size:13.5px; line-height:1.6; margin-bottom:16px; text-align:center; }
.lt-confirm-actions { display:flex; gap:8px; }
.lt-confirm-actions .lt-btn { flex:1; justify-content:center; }
`;

/* ============================================================
   API 키 입력 화면 - 독립 실행(GitHub Pages 등)용
============================================================ */
function ApiKeyGate() {
  const [key, setKey] = useState(getApiKey());
  const [saved, setSaved] = useState(!!getApiKey());
  const [showChange, setShowChange] = useState(false);

  if (saved && !showChange) {
    return (
      <div style={{ position: "relative", width: "100%", height: "100%" }}>
        <LampTalkApp />
        <div style={{ position: "fixed", left: 8, bottom: 8, zIndex: 999, fontSize: 9, color: "#4a4a56", pointerEvents: "none" }}>{APP_VERSION}</div>
        <button
          onClick={() => setShowChange(true)}
          style={{
            position: "fixed", right: 10, bottom: 10, zIndex: 999,
            width: 30, height: 30, borderRadius: "50%", background: "#1e1e26",
            border: "1px solid #2a2a34", color: "#8d8b9c", fontSize: 13, opacity: 0.55,
          }}
          title="API 키 변경"
        >⚙</button>
      </div>
    );
  }

  return (
    <div style={{
      minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center",
      justifyContent: "center", padding: 24, background: "#0a0a0e", color: "#f2f1f5",
      fontFamily: "'Pretendard','Noto Sans KR',-apple-system,sans-serif", gap: 14, textAlign: "center",
    }}>
      <div style={{ fontSize: 28 }}>✨</div>
      <h2 style={{ margin: 0 }}>램프토크 - API 키 설정</h2>
      <p style={{ color: "#8d8b9c", fontSize: 13, lineHeight: 1.6, maxWidth: 320 }}>
        console.anthropic.com 에서 발급받은 본인 API 키를 입력하세요.<br />
        이 키는 이 브라우저(폰)에만 저장되고, 절대 다른 곳으로 전송되지 않아요.<br />
        <b style={{ color: "#e5607a" }}>이 페이지 링크를 절대 남에게 공유하지 마세요.</b>
      </p>
      <input
        value={key}
        onChange={(e) => setKey(e.target.value)}
        placeholder="sk-ant-..."
        style={{
          width: "100%", maxWidth: 320, background: "#16161c", border: "1px solid #2a2a34",
          color: "#f2f1f5", borderRadius: 12, padding: "12px 14px", fontSize: 14, outline: "none",
        }}
      />
      <button
        onClick={() => { localStorage.setItem("lamptalk:apiKey", key.trim()); setSaved(true); setShowChange(false); }}
        disabled={!key.trim()}
        style={{
          background: "linear-gradient(135deg,#7c5cff,#6a4ae0)", border: "none", color: "#fff",
          borderRadius: 12, padding: "12px 24px", fontSize: 14, fontWeight: 700, cursor: "pointer",
          opacity: key.trim() ? 1 : 0.5,
        }}
      >저장하고 시작하기</button>
      {saved && (
        <button onClick={() => setShowChange(false)} style={{ background: "none", border: "none", color: "#8d8b9c", fontSize: 12.5, textDecoration: "underline", cursor: "pointer" }}>
          취소
        </button>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ApiKeyGate />);
</script>
</body>
</html>
