function makeIcon(glyph) {
  return function Icon({ size = 16, className, style, fill, ...rest }) {
    return React.createElement("span", {
      className, style: { fontSize: size, lineHeight: 1, display: "inline-flex", ...style }, ...rest,
    }, glyph);
  };
}

/* =========================================================
   LampTalk v8
   - 상태창: 날짜・시간은 코드로 직접 계산(항상 자연스럽게 흐름),
     장소・날씨는 옮기지 않는 한 유지, 캐릭터별 상태는 한 명씩
     따로 물어봐서 서로 헷갈리지 않게 함
   - 선물 받으면 실제로 그 선물에 반응(대화 기록에 상황을 포함)
   - 캐릭터도 사용자에게 선물 가능 -> 인벤토리(선물)
   - 인벤토리 아이템: 사용하기 / 선물하기
   - 상점 · 알바 추가 버튼을 항상 보이는 하단 고정 위치로 이동
   - 알바・의뢰에 날짜/시간 지정, 하루 최대 2회 제한, 동행 약속 표시
   v40 - GPS 지도를 실제 기준으로 사용:
     * 내 위치가 "미설정"이면 필터가 전혀 안 걸려 멀리 있는 캐릭터까지
       전부 대화에 끼어들던 문제 수정 (내 위치는 항상 값이 있음)
     * 같은 학원이어도 세부 위치(방)가 다르면 대화에 끼어들지 않음
     * "동행" 기능: 지도에서 켜두면 나를 따라 같이 이동하고,
       자동 이동으로 혼자 사라지지 않음
========================================================= */

// 이름이 문장에서 "실제로 불린" 것인지 판정.
// "아리스 케이크 맛있어?"의 "케이크" 안에 든 "케이"처럼, 다른 낱말에 우연히 들어간 경우를 걸러냄.
// 규칙: 이름 앞에 한글이 붙어 있으면 다른 낱말의 일부로 보고 제외,
//       이름 뒤에는 조사/호칭으로 시작할 수 있는 글자만 허용.
const NAME_TAIL_OK = /[이가은는을를와과랑도의에께야아여님씨쨩짱군양만한보더하부까처같조마밖라나든네쪽들요선언오누형]/;
function mentionsName(text, name) {
  if (!text || !name) return false;
  const isHangul = (ch) => !!ch && /[가-힣]/.test(ch);
  let from = 0;
  for (;;) {
    const i = text.indexOf(name, from);
    if (i < 0) return false;
    const prev = text[i - 1];
    const next = text[i + name.length];
    if (!isHangul(prev) && (!isHangul(next) || NAME_TAIL_OK.test(next))) return true;
    from = i + 1;
  }
}

function guessHomeLocationId(character) {

  for (const loc of LOCATIONS) {

    if (key && text.includes(key)) return loc.id;
  }
  return "schale";
}
function findPlaceInText(text, characters) {
  if (!text) return null;
  if (/(집으로|집에 ?가|집 ?간다|집에 ?왔|귀가|집으로 ?돌아)/.test(text) &&
      !(characters || []).some((ch) => text.includes(homeSubName(ch)))) {
    return { mainId: null, subId: "집" };
  }
  for (const ch of characters || []) {
    const hs = homeSubName(ch);
    if (text.includes(hs) || text.includes(`${ch.name}의 집`) || text.includes(`${ch.name} 집`) || text.includes(`${ch.name}네 집`)) {
      return { mainId: guessHomeLocationId(ch), subId: hs };
    }
  }
  let best = null;
  for (const loc of LOCATIONS) {
    for (const sub of loc.subs) {
      if (text.includes(sub) && (!best || sub.length > best.subId.length)) {
        best = { mainId: loc.id, subId: sub };
      }
    }
  }
  if (best) return best;
  for (const loc of LOCATIONS) {
    const key = loc.name.replace(/(고등학교|사이언스 스쿨|종합학원|경찰학교|고급중학교|연합학원|연방학원|특수학원|철도학원|예술학원|스쿨|학원|분교)/g, "").trim();
    if (key && text.includes(key)) return { mainId: loc.id, subId: null };
  }
  return null;

/* ---------------- API ---------------- */
function getApiKey() {
  return localStorage.getItem("lamptalk:apiKey") || "";
}
function apiHeaders() {
  return {
    "Content-Type": "application/json",
    "x-api-key": getApiKey(),
    "anthropic-version": "2023-06-01",
    "anthropic-dangerous-direct-browser-access": "true",
  };
}
// 이번 세션 토큰 사용량 (캐시가 실제로 걸리는지 확인용)
const USAGE = { calls: 0, input: 0, output: 0, cacheRead: 0, cacheWrite: 0 };
async function callClaude(system, messages, maxTokens = 1000) {
  if (!getApiKey()) throw new Error("API 키가 설정되지 않았어요. 설정에서 키를 입력해주세요.");
  const safeMessages = messages && messages.length > 0 ? messages : [{ role: "user", content: "..." }];
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: apiHeaders(),
    body: JSON.stringify({ model: MODEL, max_tokens: maxTokens, system, messages: safeMessages }),
    // system 은 문자열 또는 [{type:"text", text, cache_control}] 블록 배열 둘 다 허용됨
  });
  if (!res.ok) {
    let detail = "";
    try {
      const errJson = await res.json();
      detail = errJson?.error?.message || errJson?.error?.type || "";
    } catch { /* 응답 본문이 JSON이 아닐 수 있음 */ }
    throw new Error(`API 요청 실패 (${res.status})${detail ? ": " + detail : ""}`);
  }
  const data = await res.json();
  const u = data.usage || {};
  USAGE.calls += 1;
  USAGE.input += u.input_tokens || 0;
  USAGE.output += u.output_tokens || 0;
  USAGE.cacheRead += u.cache_read_input_tokens || 0;
  USAGE.cacheWrite += u.cache_creation_input_tokens || 0;
  return (data.content || [])
    .map((b) => (b.type === "text" ? b.text : ""))
    .filter(Boolean)
    .join("\n")
    .trim();
}

// 한 번 실패해도 잠깐 쉬었다가 다시 시도 - 일시적인 서버/네트워크 오류에 대비 (최대 3번 시도)
async function callClaudeWithRetry(system, messages, maxTokens = 1000, retriesLeft = 2, attempt = 0) {
  try {
    return await callClaude(system, messages, maxTokens);
  } catch (e) {
    if (retriesLeft > 0) {
      await new Promise((r) => setTimeout(r, 900 * (attempt + 1)));
      return callClaudeWithRetry(system, messages, maxTokens, retriesLeft - 1, attempt + 1);
    }
    throw e;
  }
}

async function detectGiftFromReply(reply) {
  const triggerWords = ["선물", "건네", "줄게", "받아", "선물이야", "선물해", "선물로", "줄까"];
  if (!reply || !triggerWords.some((w) => reply.includes(w))) return null;
  const sys = "당신은 롤플레잉 대사를 분석해서, 캐릭터가 방금 사용자에게 실제로 구체적인 물건을 선물로 건넸는지 판단하는 도우미입니다. 대사에서 캐릭터가 사용자에게 명확히 물건을 선물한 것이 확실하면 그 물건 이름만 한 단어~짧은 구로 답하고, 그게 아니면(그냥 선물 이야기를 하거나 감정 표현일 뿐이면) 정확히 \"NONE\"이라고만 답하세요. 다른 설명은 절대 쓰지 마세요.";
  try {
    const raw = await callClaude(sys, [{ role: "user", content: `대사: ${reply}` }], 30);
    const t = raw.trim().replace(/^["'“”]+|["'“”]+$/g, "");
    if (!t || t.toUpperCase() === "NONE") return null;
    return t.slice(0, 20);
  } catch (e) { console.error(e); return null; }
}

function normalizeHistory(raw) {
  const arr = [...raw];
  while (arr.length && arr[0].role === "assistant") arr.shift();
  const merged = [];
  for (const m of arr) {
    if (merged.length && merged[merged.length - 1].role === m.role) {
      merged[merged.length - 1].content += "\n" + m.content;
    } else {
      merged.push({ role: m.role, content: m.content });
    }
  }
  return merged;
}

function getLoreContext(loreBooks, text) {
  if (!text) return "";
  const hits = [];
  for (const lb of loreBooks) {
    for (const entry of lb.entries || []) {
      if ((entry.keywords || []).some((k) => k && text.includes(k))) {
        hits.push(`- ${entry.title ? entry.title + ": " : ""}${entry.content}`);
      }
    }
  }
  return hits.slice(0, 10).join("\n");
}

function parseScriptedInput(raw, characters, npcNames = []) {
  const lines = raw.split("\n");
  const segments = [];
  let buffer = [];
  const flushUser = () => {
    if (buffer.length) { segments.push({ type: "user", content: buffer.join("\n") }); buffer = []; }
  };
  for (const line of lines) {
    // "@: 내용" -> 내레이터가 상황을 설명하는 것으로 처리 (캐릭터 대사도, 내 대사도 아님)
    const narrM = line.match(/^@[:：]\s*(.*)$/);
    if (narrM && narrM[1].trim()) {
      flushUser();
      segments.push({ type: "narration", content: narrM[1].trim() });
      continue;
    }
    const m = line.match(/^@([^:：]+)[:：]\s*(.*)$/);
    if (m && m[2].trim()) {
      const nameRaw = m[1].trim();
      const char = characters.find((c) => c.name === nameRaw) ||
        characters.find((c) => c.name.startsWith(nameRaw) || nameRaw.startsWith(c.name));
      if (char) {
        flushUser();
        segments.push({ type: "character", characterId: char.id, content: m[2].trim() });
        continue;
      }
      // 등록 캐릭터가 아니면 단역으로 처리 (알려진 단역과 부분일치 시 그 이름 사용, 아니면 새 단역 생성)
      const npcName = npcNames.find((n) => n === nameRaw || n.includes(nameRaw) || nameRaw.includes(n)) || nameRaw;
      flushUser();
      segments.push({ type: "npcLine", name: npcName, content: m[2].trim() });
      continue;
    }
    buffer.push(line);
  }
  flushUser();
  return segments;
}

}

}
function advanceClock(dateStr, timeStr, deltaMinutes) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const [hh, mm] = timeStr.split(":").map(Number);
  const dt = new Date(y, m - 1, d, hh, mm);
  dt.setMinutes(dt.getMinutes() + deltaMinutes);
  const ny = dt.getFullYear(), nm = String(dt.getMonth() + 1).padStart(2, "0"), nd = String(dt.getDate()).padStart(2, "0");
  const nh = String(dt.getHours()).padStart(2, "0"), nmin = String(dt.getMinutes()).padStart(2, "0");
  return { date: `${ny}-${nm}-${nd}`, time: `${nh}:${nmin}` };
}

function formatClock(timeStr) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(timeStr || "");
  if (!m) return "";
  const h = Number(m[1]);
  const ampm = h < 12 ? "오전" : "오후";
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return `${ampm} ${String(h12).padStart(2, "0")}:${m[2]}`;
}
function minutesOfTime(timeStr) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(timeStr || "");
  return m ? Number(m[1]) * 60 + Number(m[2]) : 12 * 60;
}
const KO_NUM_WORD = { "한": 1, "두": 2, "세": 3, "네": 4, "다섯": 5, "여섯": 6, "일곱": 7, "여덟": 8, "아홉": 9, "열": 10, "십": 10, "몇": 2 };
function numFrom(token) {
  if (!token) return 0;
  if (/^\d+$/.test(token)) return Number(token);
  return KO_NUM_WORD[token] || 0;
}
// 사용자가 "*1시간이 지났다*", "30분 뒤", "저녁이 되었다" 처럼 쓰면 시계에 바로 반영
function applyTimeDirectives(scene, text) {
  if (!text) return null;
  const t = text.replace(/\s+/g, " ");
  const setTo = (hh, mm, nextDay) => {
    let base = { date: scene.date, time: scene.time };
    if (nextDay) base = advanceClock(scene.date, "12:00", 24 * 60);
    return { date: base.date, time: `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}` };
  };
  // 하루 이상 건너뛰기
  const dayM = /(\d+|한|두|세|며칠)?\s*(?:일|날)?\s*(?:이|가)?\s*(?:지났|지나|흘렀)|다음\s?날|이튿날|담날/.exec(t);
  if (/다음\s?날|이튿날|담날|하루가? ?(지났|지나|흘렀)/.test(t)) {
    const nd = advanceClock(scene.date, "12:00", 24 * 60);
    return { date: nd.date, time: /아침|오전/.test(t) ? "07:30" : "08:00" };
  }
  // N시간 / N분 경과
  let delta = 0;
  const hourRe = /(\d+|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열|몇)\s*시간\s*(?:정도|쯤|가량)?\s*(?:이|가)?\s*(지났|지나|흘렀|뒤|후|경과)/g;
  let mm1;
  while ((mm1 = hourRe.exec(t)) !== null) delta += numFrom(mm1[1]) * 60;
  const minRe = /(\d+|십|몇)\s*분\s*(?:정도|쯤|가량)?\s*(?:이|가)?\s*(지났|지나|흘렀|뒤|후|경과)/g;
  let mm2;
  while ((mm2 = minRe.exec(t)) !== null) delta += numFrom(mm2[1]);
  if (/반나절/.test(t)) delta += 6 * 60;
  if (delta > 0) return advanceClock(scene.date, scene.time, delta);

  // "8시가 되고", "오후 3시 반이 되어", "새벽 2시", "밤 10시쯤" 처럼 시각을 직접 지정
  // 앞에 오전/오후/새벽 같은 말이 붙으면 "되었다" 같은 말 없이도 시각으로 인정
  const TRIG = "(?:되었|됐|되고|되어|되니|되면|넘어|지나|무렵|쯤|즈음|경|께|에)";
  const abs =
    new RegExp("(오전|오후|아침|저녁|밤|새벽|낮|점심)\\s*(\\d{1,2})\\s*시\\s*(?:(\\d{1,2})\\s*분|(반))?").exec(t) ||
    new RegExp("()(\\d{1,2})\\s*시\\s*(?:(\\d{1,2})\\s*분|(반))?\\s*(?:이|가|은|는)?\\s*" + TRIG).exec(t);
  if (abs) {
    const q = abs[1] || "";
    let h = Number(abs[2]);
    const mi = abs[3] ? Number(abs[3]) : (abs[4] ? 30 : 0);
    let nextDay = false;
    if (h >= 0 && h <= 24) {
      if (h === 24) h = 0;
      if (/오후|저녁|밤/.test(q) && h < 12) h += 12;
      else if (/낮|점심/.test(q) && h < 6) h += 12;
      else if (/오전|아침|새벽/.test(q) && h === 12) h = 0;
      else if (!q) {
        // 앞뒤 표현이 없으면 지금 시각 기준으로 "다음에 오는 그 시각"으로 봄
        const curM = minutesOfTime(scene.time);
        const cands = h < 12 ? [h * 60 + mi, (h + 12) * 60 + mi] : [h * 60 + mi];
        const fwd = cands.filter((x) => x > curM);
        if (fwd.length) h = Math.floor(fwd[0] / 60);
        else nextDay = true;
      }
      // 지정한 시각이 지금보다 이전이면 "오늘"이 아니라 다음 날로 봄 (밤 9시에 "새벽 2시" → 내일 새벽)
      if (!nextDay && h * 60 + mi < minutesOfTime(scene.time)) nextDay = true;
      const dateBase = nextDay ? advanceClock(scene.date, "12:00", 24 * 60).date : scene.date;
      return { date: dateBase, time: `${String(h % 24).padStart(2, "0")}:${String(mi).padStart(2, "0")}` };
    }
  }

  // 시간대 지정
  const nowMin = minutesOfTime(scene.time);
  const DP = "(?:이|가)? ?(?:되었|됐|되고|되어|되니|돼|밝아|무렵|쯤|즈음|께|경|이 되|가 되)";
  const has = (word) => new RegExp(word + DP).test(t);
  if (/자정/.test(t)) return setTo(0, 0, nowMin > 60);
  if (/정오/.test(t)) return setTo(12, 0, nowMin > 13 * 60);
  if (/한밤중|깊은 ?밤|밤늦/.test(t)) return setTo(1, 0, nowMin > 3 * 60);
  if (/동틀|동이 ?트|새벽녘/.test(t)) return setTo(5, 0, nowMin > 6 * 60);
  if (has("새벽") || /새벽이 ?(되|밝)/.test(t)) return setTo(3, 0, nowMin > 4 * 60);
  if (has("아침") || /아침이 ?(되|밝)|날이 ?밝/.test(t)) return setTo(7, 30, nowMin > 9 * 60);
  if (has("점심") || /점심(때|시간)?가? ?(되|돼)/.test(t)) return setTo(12, 0, nowMin > 14 * 60);
  if (/해질|해가 ?(지|저물)/.test(t)) return setTo(18, 30, nowMin > 20 * 60);
  if (has("저녁") || /저녁이 ?(되|돼)/.test(t)) return setTo(18, 30, nowMin > 20 * 60);
  if (has("밤") || /밤이 ?(되|깊)/.test(t)) return setTo(21, 0, nowMin > 23 * 60);
  return null;
}

        const bare = sb.replace(/\([^)]*\)/g, "").trim(); // "초현상특무부(AL-1S) 연구실" -> "초현상특무부 연구실"
        const trim = (t) => t.replace(/(회의실|사무실|연구실|작전실|수련장|훈련장|부실|실|장|고)$/g, "").trim();
        const keys = new Set([sb, bare, trim(sb), trim(bare), sb.split(/\s+/)[0], bare.split(/\s+/)[0]]);
        keys.forEach((k) => { if (k && k.length >= 2) candidates.push({ sub: sb, key: k }); });
      });
    candidates.sort((a, b) => b.key.length - a.key.length);
    for (const cd of candidates) {
      if (text.includes(cd.key)) { found = cd.sub; break; }
    }
  }
  CLUB_CACHE.set(character.id, found);
  return found;
}
// 캐릭터별 고정 성향값 (0~1). 높을수록 야행성 = 새벽에도 깨어 있음
function traitScore(id, salt) {
  let h = 2166136261 >>> 0;
  const str = String(id) + "|" + salt;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return (h % 1000) / 1000;
}
// 지금 자고 있는지. 새벽(0~6시)이라도 야행성이거나 임무 중이면 깨어 있음
function isAsleepNow(c, mins, locs = {}) {
  if (mins >= 6 * 60) return false;
  const l = locs[c.id];
  if (l && (l.status === "mission" || l.status === "moving")) return false;
  const owl = traitScore(c.id, "owl");
  if (owl > 0.72) return false;              // 늘 밤에 깨어 있는 타입
  if (owl > 0.55 && mins < 2 * 60) return false; // 새벽 2시 전까지는 깨어 있는 타입
  return true;
}
// 캐릭터가 "[다른이름] ..." 형태로 남의 대사까지 써버린 경우 잘라냄
function escapeRegex(t) { return String(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function stripOtherSpeakers(text, selfName, allNames) {
  if (!text) return text;
  const selfTag = new RegExp("\\[\\s*" + escapeRegex(selfName) + "\\s*\\]\\s*", "g");
  let out = text.replace(selfTag, "");
  const others = (allNames || []).filter((n) => n && n !== selfName);
  if (others.length === 0) return out.trim();
  const re = new RegExp("\\[\\s*(" + others.map(escapeRegex).join("|") + ")\\s*\\]");
  const m = re.exec(out);
  if (!m) return out.trim();
  return out.slice(0, m.index).trim(); // 남의 이름표가 나오는 지점부터 버림
}
const rndPick = (arr, fb) => (arr && arr.length ? arr[Math.floor(Math.random() * arr.length)] : fb);
function scheduleTarget(ch, mins) {
  const homeMain = guessHomeLocationId(ch);
  const loc = LOCATIONS.find((l) => l.id === homeMain) || LOCATIONS[0];
  const study = loc.subs.filter((sb) => !MEAL_SUB_RE.test(sb));
  const meal = loc.subs.filter((sb) => MEAL_SUB_RE.test(sb));
  const home = homeSubName(ch);
  const part = dayPartOf(mins);
  // 시간표대로만 움직이면 기계 같으니, 가끔은 벗어나게 함
  const stray = Math.random();
  if ((part === "저녁" && stray < 0.25) || (part === "밤" && stray < 0.12) || (part === "새벽" && stray < 0.04))
    return { mainId: homeMain, subId: rndPick(study, loc.subs[0]), off: true }; // 동아리실 야근・늦게까지 남음
  if ((part === "오전 수업" || part === "오후 수업") && stray < 0.07)
    return { mainId: homeMain, subId: rndPick(meal.length ? meal : study, loc.subs[0]), off: true }; // 수업 째고 딴 데
  if (part === "아침" && stray < 0.06)
    return { mainId: homeMain, subId: rndPick(meal.length ? meal : study, loc.subs[0]), off: true }; // 일찍 나와 아침 먹는 중
  if (part === "새벽" || part === "밤") return { mainId: homeMain, subId: home };
  if (part === "아침") return { mainId: homeMain, subId: Math.random() < 0.45 ? home : rndPick(study, loc.subs[0]) };
  if (part === "오전 수업" || part === "오후 수업") return { mainId: homeMain, subId: rndPick(study, loc.subs[0]) };
  if (part === "점심") return { mainId: homeMain, subId: rndPick(meal.length ? meal : study, loc.subs[0]) };
  if (part === "방과후" || part === "저녁") {
    if (stray > 0.93) return { mainId: "emart", subId: pickSub("emart"), off: true }; // 장보러
  }
  if (part === "방과후") {
    if (Math.random() < 0.18) {
      const others = REAL_LOCATIONS.filter((l) => l.id !== homeMain && l.id !== "emart" && l.id !== "schale");
      const t = others[Math.floor(Math.random() * others.length)];
      return { mainId: t.id, subId: pickSub(t.id) };
    }
    return { mainId: homeMain, subId: rndPick(Math.random() < 0.5 && meal.length ? meal : study, loc.subs[0]) };
  }
  return Math.random() < 0.6 ? { mainId: homeMain, subId: home } : { mainId: homeMain, subId: rndPick(meal.length ? meal : study, loc.subs[0]) };
}
// 지금 있는 자리가 이 시간대에 어울리는지 (어울리면 굳이 매번 옮기지 않음)
function fitsSchedule(ch, loc, mins) {
  if (!loc || loc.status !== "here") return true;
  if (loc.off) return true; // 일부러 시간표를 벗어나 있는 중 (야근 등) — 그대로 둠
  const homeMain = guessHomeLocationId(ch);
  const home = homeSubName(ch);
  const isMeal = MEAL_SUB_RE.test(loc.subId || "");
  const atOwnSchool = loc.mainId === homeMain;
  const part = dayPartOf(mins);
  if (part === "새벽" || part === "밤") return loc.subId === home;
  if (part === "아침") return atOwnSchool;
  if (part === "오전 수업" || part === "오후 수업") return atOwnSchool && !isMeal && loc.subId !== home;
  if (part === "점심") return atOwnSchool;
  if (part === "방과후") return true;
  return loc.subId === home || isMeal;
}

function DEFAULT_SCENE() {

// 장소/날씨는 실제로 바뀌었다는 신호가 없으면 그대로 유지, 상황만 매번 새로 요약
async function advanceAndDescribeScene(prevScene, recentText, showToast) {
  const deltaMinutes = 0; // 시간은 채팅 턴마다 send()에서 직접 흘림 (중복 방지)
  const fallback = nowDateTime();
  const baseDate = prevScene?.date || fallback.date;
  const baseTime = /^\d{1,2}:\d{2}$/.test(prevScene?.time || "") ? prevScene.time : fallback.time;
  const { date, time } = advanceClock(baseDate, baseTime, deltaMinutes);
  const sys = [
    "당신은 롤플레잉 장면의 배경 정보를 관리하는 도우미입니다.",
    "아래 형식을 정확히 지켜서 라벨 뒤에만 채우고, 다른 설명은 절대 추가하지 마세요.",
    "장소: (대화 내용상 캐릭터들이 실제로 다른 장소로 이동했다면 새 장소를 쓰고, 이동하지 않았다면 정확히 \"동일\"이라고만 쓰세요)",
    "날씨: (날씨가 실제로 바뀌었다면 새 날씨를 쓰고, 아니면 정확히 \"동일\"이라고만 쓰세요)",
    "상황: (지금 이 순간 벌어지고 있는 일을 한 문장으로 요약)",
  ].join("\n");
  try {
    const raw = await callClaude(sys, [{ role: "user", content: `현재 장소: ${prevScene.location || "알 수 없음"}\n현재 날씨: ${prevScene.weather || "알 수 없음"}\n최근 대화:\n${recentText}` }], 200);
    let location = prevScene.location, weather = prevScene.weather, situation = prevScene.situation || "";
    for (const line of raw.split("\n")) {
      const m = line.match(/^([^:：]+)[:：]\s*(.*)$/);
      if (!m) continue;
      const label = m[1].trim(), val = m[2].trim();
      if (label === "장소" && val && val !== "동일") location = val;
      if (label === "날씨" && val && val !== "동일") weather = val;
      if (label === "상황" && val) situation = val;
    }
    return { date, time, location, weather, situation };
  } catch (e) {
    console.error(e);
    showToast?.("배경 상태를 갱신하지 못했어요");
    return { date, time, location: prevScene.location, weather: prevScene.weather, situation: prevScene.situation || "" };
  }
}

// 캐릭터 한 명씩 따로 물어봐서, 다른 캐릭터의 일과 착각하지 않게 함
async function generateCharacterStatus(character, activeFields, recentText, showToast) {
  if (activeFields.length === 0) return null;
  const lines = activeFields.map((f) => `${f.label}: `).join("\n");
  const hints = activeFields.map((f) => `- ${f.label}: ${STYLE_FIELD_HINTS[f.key]}`).join("\n");
  const sys = [
    `당신은 롤플레잉 캐릭터 "${character.name}"의 상태를 분석하는 도우미입니다.`,
    `아래 항목은 반드시 "${character.name}" 본인에게 실제로 일어난 일과 "${character.name}" 자신의 대사・행동만 근거로 채우세요. 대화에 다른 캐릭터가 등장하더라도 그들에게 일어난 일을 "${character.name}"의 것으로 착각해서 쓰면 절대 안 됩니다.`,
    hints ? `[각 항목의 의미]\n${hints}` : "",
    "아래 형식을 정확히 지켜서 라벨 뒤에만 한국어로 채우고, 다른 설명은 절대 추가하지 마세요.",
    lines,
  ].filter(Boolean).join("\n\n");
  try {
    const raw = await callClaude(sys, [{ role: "user", content: `최근 대화:\n${recentText}` }], 300);
    const labelToKey = Object.fromEntries(activeFields.map((f) => [f.label, f.key]));
    const result = { characterId: character.id, name: character.name };
    for (const line of raw.split("\n")) {
      const m = line.match(/^([^:：]+)[:：]\s*(.*)$/);
      if (!m) continue;
      const key = labelToKey[m[1].trim()];
      if (key && m[2].trim()) result[key] = m[2].trim();
    }
    return Object.keys(result).length > 2 ? result : null;
  } catch (e) {
    console.error(e);
    showToast?.(`${character.name} 상태를 정리하지 못했어요`);
    return null;
  }
}

/* ---------------- storage (독립 실행용: localStorage 사용) ---------------- */
const LS_PREFIX = "lamptalk:";
async function storeGet(key) {
  try { const v = localStorage.getItem(LS_PREFIX + key); return v ? JSON.parse(v) : null; }
  catch { return null; }
}
async function storeSet(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); return true; }
  catch (e) { console.error("storage set failed", e); return false; }
}
async function storeDelete(key) {
  try { localStorage.removeItem(LS_PREFIX + key); } catch { /* ignore */ }
}
async function storeListPrefix(prefix) {
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(LS_PREFIX + prefix)) keys.push(k.slice(LS_PREFIX.length));
    }
    return keys;
  } catch { return []; }
}

// 사이트를 나가거나 새 버전으로 넘어가도 잃어버리지 않게, 모든 데이터를 코드 하나로 내보내고/불러오기
async function exportAllData() {
  const [profileKeys, plotKeys, loreKeys, chatKeys] = await Promise.all([
    storeListPrefix("profile:"), storeListPrefix("plot:"), storeListPrefix("lore:"), storeListPrefix("chat:"),
  ]);
  const allKeys = [...profileKeys, ...plotKeys, ...loreKeys, ...chatKeys];
  const data = {};
  for (const k of allKeys) {
    const v = await storeGet(k);
    if (v !== null) data[k] = v;
  }
  const json = JSON.stringify({ v: 1, data });
  return btoa(unescape(encodeURIComponent(json)));
}
async function importAllData(code) {
  const json = decodeURIComponent(escape(atob(code.trim())));
  const parsed = JSON.parse(json);
  if (!parsed || typeof parsed.data !== "object") throw new Error("invalid backup code");
  for (const [k, v] of Object.entries(parsed.data)) {
    await storeSet(k, v);
  }
}

/* ---------------- image resize ---------------- */
function resizeImageFile(file, maxDim = 360, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height) {
          if (width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height); height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
const makeImgObj = (src) => ({ id: genId(), src, scale: 1, x: 50, y: 50 });
function normalizeImg(image) {
  if (!image) return null;
  if (typeof image === "string") return { src: image, scale: 1, x: 50, y: 50 };
  if (image.src) return { src: image.src, scale: image.scale || 1, x: image.x ?? 50, y: image.y ?? 50 };
  return null;
}

function LampTalkApp() {

  const [plots, setPlots] = useState([]);

    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 1800);
  }, []);

  const refresh = useCallback(async () => {
    setLoading(true);
    const [profileKeys, plotKeys, loreKeys] = await Promise.all([
      storeListPrefix("profile:"), storeListPrefix("plot:"), storeListPrefix("lore:"),
    ]);
    let profs = (await Promise.all(profileKeys.map(storeGet))).filter(Boolean);

  const popAll = () => setStack([]);

    setPlots((prev) => {
      const rest = prev.filter((p) => p.id !== plot.id);

    });

    await storeSet(`profile:${profile.id}`, profile);
    setProfiles((prev) => {
      const exists = prev.some((p) => p.id === profile.id);
      return exists ? prev.map((p) => (p.id === profile.id ? profile : p)) : [...prev, profile];
    });
    return profile;
  };
  const patchLore = async (lb) => {
    await storeSet(`lore:${lb.id}`, lb);
    setLoreBooks((prev) => {
      const exists = prev.some((l) => l.id === lb.id);
      return exists ? prev.map((l) => (l.id === lb.id ? lb : l)) : [...prev, lb];
    });
    return lb;
  };
  const deleteLore = async (id) => {
    await storeDelete(`lore:${id}`);
    setLoreBooks((prev) => prev.filter((l) => l.id !== id));
  };

        )}

          <ChatsListScreen plots={plots} loading={loading}
            onOpenRoom={(id) => push({ screen: "chatroom", plotId: id })}
            onDeleteRoom={deletePlot}
            askConfirm={askConfirm}
            onNewPlot={() => push({ screen: "plotform" })} />
        )}
        {stack.length === 0 && activeTab === "create" && (
          <CreateListScreen plots={plots} loading={loading}
            onNewPlot={() => push({ screen: "plotform" })}
            onEditPlot={(id) => push({ screen: "plotform", plotId: id })}
            onOpenRoom={(id) => push({ screen: "chatroom", plotId: id })}
            askConfirm={askConfirm}
            onDeletePlot={deletePlot} />
        )}

        {stack.map((layer, idx) => (
          <div className="lt-overlay-layer" key={idx} style={{ zIndex: 10 + idx }}>
            {layer.screen === "plotform" && (
              <PlotForm
                plotId={layer.plotId}
                plots={plots}
                profiles={profiles}
                loreBooks={loreBooks}
                onBack={pop}
                onSaved={async (plot, openRoom) => {
                  await patchPlot(plot);
                  if (openRoom) setStack([{ screen: "chatroom", plotId: plot.id }]);
                  else pop();
                  showToast("저장했어요");
                }}
                onDelete={layer.plotId ? () => {
                  askConfirm("이 플롯과 대화 기록을 삭제할까요?", () => deletePlot(layer.plotId));
                } : null}
                onOpenProfileForm={openProfileForm}
                onSaveLore={patchLore}
                onDeleteLore={deleteLore}
                askConfirm={askConfirm}
                showToast={showToast}
              />
            )}
            {layer.screen === "chatroom" && (
              <ChatRoom
                plot={plots.find((p) => p.id === layer.plotId)}
                profiles={profiles}
                loreBooks={loreBooks}
                onBack={pop}
                onExitToList={() => { popAll(); setActiveTab("chats"); }}
                onPlotUpdated={patchPlot}
                onDeleteRoom={deletePlot}
                onOpenProfileForm={openProfileForm}
                showToast={showToast}
              />
            )}
            {layer.screen === "profileform" && (
              <ProfileForm profileId={layer.profileId} profiles={profiles} onBack={pop}
                onSaved={async (profile) => { await patchProfile(profile); pop(); showToast("대화 프로필을 저장했어요"); }} />
            )}
            {layer.screen === "backup" && (
              <BackupScreen onBack={pop} showToast={showToast}
                onImported={async () => { await refresh(); pop(); showToast("불러왔어요"); }} />
            )}
          </div>
        ))}
      </div>

      {stack.length === 0 && <BottomNav active={activeTab} onChange={goTab} />}
      {confirmReq && (
        <div className="lt-confirm-overlay" onClick={() => setConfirmReq(null)}>
          <div className="lt-confirm-box" onClick={(e) => e.stopPropagation()}>
            <div className="lt-confirm-msg">{confirmReq.message}</div>
            <div className="lt-confirm-actions">
              <button className="lt-btn" onClick={() => setConfirmReq(null)}>취소</button>
              <button className="lt-btn danger" onClick={() => { const f = confirmReq.onYes; setConfirmReq(null); f?.(); }}>확인</button>
            </div>
          </div>
        </div>
      )}
      <Toast toast={toast} />
    </div>
  );
}

/* ============================================================
   PLOT FORM
============================================================ */
function PlotForm({ plotId, plots, profiles, loreBooks, onBack, onSaved, onDelete,
  onOpenProfileForm, onSaveLore, onDeleteLore, askConfirm, showToast }) {
  const initial = plotId ? plots.find((p) => p.id === plotId) : null;

  const [title, setTitle] = useState(initial?.title || "");
  const [description, setDescription] = useState(initial?.description || "");
  const [coverImage, setCoverImage] = useState(initial?.coverImage || "");
  const [intro, setIntro] = useState(initial?.intro || "");
  const [characters, setCharacters] = useState(initial?.characters || []);
  const [loreIds, setLoreIds] = useState(initial?.loreIds || []);
  const [styleConfig, setStyleConfig] = useState(initial?.styleConfig || DEFAULT_STYLE_CONFIG);
  const [shopItems, setShopItems] = useState(initial?.shopItems || []);
  const [jobs, setJobs] = useState(initial?.jobs || []);
  const [defaultProfileId, setDefaultProfileId] = useState(initial?.defaultProfileId || profiles[0]?.id || "");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [editingCharId, setEditingCharId] = useState(null);
  const [subScreen, setSubScreen] = useState(null);
  const [editingLoreId, setEditingLoreId] = useState(null);
  const coverFileRef = useRef(null);
  const [coverUploading, setCoverUploading] = useState(false);
  const onPickCover = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    setCoverUploading(true);
    try { setCoverImage(await resizeImageFile(file, 400, 0.7)); }
    catch (err) { console.error(err); showToast?.("이미지를 불러오지 못했어요"); }
    setCoverUploading(false);
  };

  const sectionRefs = { info: useRef(null), chars: useRef(null) };
  const scrollTo = (key) => sectionRefs[key]?.current?.scrollIntoView({ behavior: "smooth", block: "start" });

  const isNew = !initial;
  const save = async () => {
    if (!title.trim()) { setError("제목을 입력해주세요."); scrollTo("info"); return; }
    if (characters.length === 0) { setError("캐릭터를 1명 이상 추가해주세요."); scrollTo("chars"); return; }
    setError("");
    setSaving(true);
    const plot = {
      id: initial?.id || genId(),
      title: title.trim(), description: description.trim(), coverImage, intro: intro.trim(),
      characters, loreIds, styleConfig,
      shopItems, jobs,
      defaultProfileId,
      lastMessage: initial?.lastMessage || "", lastMessageAt: initial?.lastMessageAt || null,
      createdAt: initial?.createdAt || Date.now(),
    };
    // 새로 만드는 플롯일 때만 저장 후 바로 대화방으로 이동해요.
    // 기존 플롯을 수정할 때는 대화방을 다시 불러오지 않고 그대로 목록으로 돌아가서,
    // 진행 중이던 대화 내용이 절대 초기화되지 않게 해요.
    await onSaved(plot, isNew);
    setSaving(false);
  };

  const upsertCharacter = (char) => {
    setCharacters((prev) => {
      const exists = prev.some((c) => c.id === char.id);
      return exists ? prev.map((c) => (c.id === char.id ? char : c)) : [...prev, char];
    });
    setEditingCharId(null);
  };
  const removeCharacterById = (id) => setCharacters((prev) => prev.filter((c) => c.id !== id));
  const editingChar = editingCharId && editingCharId !== "NEW" ? characters.find((c) => c.id === editingCharId) : null;

  const styleCount = (styleConfig.scene ? 1 : 0) + STYLE_FIELDS.filter((f) => styleConfig[f.key]).length;

  return (
    <div className="lt-screen-full">
      <div className="lt-form-topbar">
        <button className="lt-iconbtn" onClick={onBack}><X size={19} /></button>
        <div className="lt-form-topbar-title">플롯</div>
        <button className="lt-btn primary small" disabled={saving} onClick={() => save()}>
          {saving ? <Loader2 size={14} className="lt-spin" /> : "등록"}
        </button>
      </div>

      <div className="lt-form-scroll">
        <div ref={sectionRefs.info} className="lt-form-section">
          <div className="lt-section-title">기본 설정</div>
          <div className="lt-plot-cover-wrap" onClick={() => coverFileRef.current?.click()}>
            {coverUploading ? <Loader2 size={20} className="lt-spin" /> :
              coverImage ? <img src={coverImage} alt="" /> :
                <div className="lt-plot-cover-empty"><Camera size={20} /><span>대표사진</span></div>}
          </div>
          <input ref={coverFileRef} type="file" accept="image/*" style={{ display: "none" }} onChange={onPickCover} />
          <label className="lt-field">
            <span>제목 <em>({title.length}/20)</em></span>
            <input value={title} onChange={(e) => setTitle(e.target.value.slice(0, 20))} placeholder="제목을 입력해주세요." />
          </label>
          <label className="lt-field">
            <span>설명</span>
            <textarea value={description} onChange={(e) => setDescription(e.target.value)} placeholder="상황, 관계, 세계관 등을 설명해주세요." rows={4} />
          </label>
        </div>

        <div ref={sectionRefs.chars} className="lt-form-section">
          <div className="lt-section-title">캐릭터</div>
          {characters.length > 0 && (
            <div className="lt-char-cards">
              {characters.map((c) => (
                <div key={c.id} className="lt-char-card" onClick={() => setEditingCharId(c.id)}>
                  <Avatar name={c.name} image={c.images?.[0]} size={48} />
                  <span>{c.name}</span>
                </div>
              ))}
            </div>
          )}
          {editingCharId === null && characters.length < MAX_CHARACTERS && (
            <button className="lt-add-char-tile" onClick={() => setEditingCharId("NEW")}>
              <Plus size={22} /><span>캐릭터 추가 {characters.length}/{MAX_CHARACTERS}</span>
            </button>
          )}
          {editingCharId !== null && (
            <CharacterEditor key={editingCharId} initial={editingChar} showToast={showToast}
              onCancel={() => setEditingCharId(null)}
              onDelete={editingChar ? () => { removeCharacterById(editingChar.id); setEditingCharId(null); } : null}
              onSave={upsertCharacter} />
          )}
        </div>

        <div className="lt-form-section">
          <div className="lt-section-title">추가 설정</div>
          <div className="lt-muted" style={{ marginBottom: 2 }}>로어북・상태창 스타일・상점・알바・인트로는 각각 따로 눌러서 설정해요.</div>
          <SettingsRow icon={BookOpen} label="로어북" value={loreIds.length > 0 ? `${loreIds.length}/${MAX_LORE} 연결됨` : "연결 안 함"} onClick={() => setSubScreen("lore")} />
          <SettingsRow icon={ListChecks} label="스타일 · 상태창" value={styleCount > 0 ? `${styleCount}개 항목` : "사용 안 함"} onClick={() => setSubScreen("style")} />
          <SettingsRow icon={ShoppingBag} label="상점" value={`${shopItems.length}개 아이템`} onClick={() => setSubScreen("shop")} />
          <SettingsRow icon={Briefcase} label="알바・의뢰" value={`${jobs.length}개`} onClick={() => setSubScreen("jobs")} />
          <SettingsRow icon={AlignLeft} label="인트로" value={intro.trim() ? "작성됨" : "미작성"} onClick={() => setSubScreen("intro")} />
        </div>

        <div className="lt-form-section" style={{ paddingBottom: 28 }}>
          <div className="lt-section-title">플레이하는 유저가 사용할 대화 프로필</div>
          <div className="lt-profile-chip-row">
            {profiles.map((p) => (
              <button key={p.id} className={"lt-profile-chip" + (defaultProfileId === p.id ? " on" : "")} onClick={() => setDefaultProfileId(p.id)}>
                {p.name || "이름 없음"}
              </button>
            ))}
            <button className="lt-profile-chip dashed" onClick={() => onOpenProfileForm(null)}><Plus size={13} /> 새 프로필</button>
          </div>
        </div>

        {error && <div className="lt-error" style={{ margin: "0 16px 16px" }}>{error}</div>}
        <div className="lt-form-bottom-actions">
          <button className="lt-btn primary" disabled={saving} onClick={() => save()}>
            {saving ? <Loader2 size={16} className="lt-spin" /> : <Check size={16} />} {isNew ? "등록하고 대화 시작" : "수정 완료"}
          </button>
          {onDelete && <button className="lt-btn danger" onClick={onDelete}><Trash2 size={16} /> 플롯 삭제</button>}
        </div>
      </div>

      {subScreen === "style" && (
        <div className="lt-overlay-layer" style={{ zIndex: 8 }}>
          <StyleFormScreen config={styleConfig} onChange={setStyleConfig} onBack={() => setSubScreen(null)} />
        </div>
      )}
      {subScreen === "shop" && (
        <div className="lt-overlay-layer" style={{ zIndex: 8 }}>
          <ShopFormScreen items={shopItems} onChange={setShopItems} onBack={() => setSubScreen(null)} showToast={showToast} />
        </div>
      )}
      {subScreen === "jobs" && (
        <div className="lt-overlay-layer" style={{ zIndex: 8 }}>
          <JobsFormScreen jobs={jobs} characters={characters} onChange={setJobs} onBack={() => setSubScreen(null)} />
        </div>
      )}
      {subScreen === "intro" && (
        <div className="lt-overlay-layer" style={{ zIndex: 8 }}>
          <IntroFormScreen intro={intro} onChange={setIntro} onBack={() => setSubScreen(null)} />
        </div>
      )}
      {subScreen === "lore" && (
        <div className="lt-overlay-layer" style={{ zIndex: 8 }}>
          <LorePicker
            selectedIds={loreIds} onChange={setLoreIds} loreBooks={loreBooks}
            onBack={() => setSubScreen(null)}
            onCreateNew={() => { setEditingLoreId("NEW"); setSubScreen("loreform"); }}
            onEdit={(id) => { setEditingLoreId(id); setSubScreen("loreform"); }}
            onDelete={(id, title) => askConfirm(`'${title}' 로어북을 삭제할까요?`, async () => { await onDeleteLore(id); setLoreIds((prev) => prev.filter((x) => x !== id)); })}
          />
        </div>
      )}
      {subScreen === "loreform" && (
        <div className="lt-overlay-layer" style={{ zIndex: 9 }}>
          <LoreForm
            loreId={editingLoreId === "NEW" ? null : editingLoreId}
            loreBooks={loreBooks}
            onBack={() => setSubScreen("lore")}
            onSaved={async (lb) => { await onSaveLore(lb); setSubScreen("lore"); }}
          />
        </div>
      )}
    </div>
  );
}

/* ---------------- 로어북 / 스타일 / 배경 / 인트로 / 상점 / 알바 : 별도 화면 ---------------- */

      <div className="lt-form-topbar">
        <button className="lt-iconbtn" onClick={onBack}><ChevronLeft size={20} /></button>
        <div className="lt-form-topbar-title">스타일 · 상태창</div>
        <div style={{ width: 32 }} />
      </div>
      <div className="lt-form-scroll">
        <div className="lt-form-section">

        <button className="lt-iconbtn" onClick={onBack}><ChevronLeft size={20} /></button>
        <div className="lt-form-topbar-title">인트로</div>
        <div style={{ width: 32 }} />
      </div>
      <div className="lt-form-scroll">
        <div className="lt-form-section">
          <label className="lt-field">
            <span>시작 장면 &amp; 첫 대사</span>
            <textarea value={intro} onChange={(e) => onChange(e.target.value)}

function ShopFormScreen({ items, onChange, onBack, showToast }) {
  const addItem = () => onChange([...items, { id: genId(), name: "", image: "", cost: 10, affectionGain: 5 }]);
  const updateItem = (id, patch) => onChange(items.map((it) => (it.id === id ? { ...it, ...patch } : it)));

function ImageAdjustSheet({ image, onChange, onClose }) {
  const dragRef = useRef(null);
  const dragging = useRef(false);
  const start = useRef({ x: 0, y: 0, origX: 50, origY: 50 });

  const posFromEvent = (e) => (e.touches ? e.touches[0] : e);
  const onDown = (e) => {
    dragging.current = true;
    const p = posFromEvent(e);
    start.current = { x: p.clientX, y: p.clientY, origX: image.x, origY: image.y };
  };
  const onMove = (e) => {
    if (!dragging.current || !dragRef.current) return;
    const p = posFromEvent(e);
    const rect = dragRef.current.getBoundingClientRect();
    const dx = ((p.clientX - start.current.x) / rect.width) * 100;
    const dy = ((p.clientY - start.current.y) / rect.height) * 100;
    const nx = Math.min(100, Math.max(0, start.current.origX - dx));
    const ny = Math.min(100, Math.max(0, start.current.origY - dy));
    onChange({ x: nx, y: ny });
  };
  const onUp = () => { dragging.current = false; };

  return (
    <div className="lt-menu-overlay" onClick={onClose}>
      <div className="lt-detail-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="lt-detail-head">
          <div className="lt-detail-name">사진 위치 조정</div>
          <button className="lt-iconbtn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="lt-adjust-body">
          <div className="lt-adjust-preview" ref={dragRef}
            onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
            onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}>
            <img src={image.src} alt="" draggable={false}
              style={{ objectPosition: `${image.x}% ${image.y}%`, transform: `scale(${image.scale})` }} />
          </div>
          <div className="lt-muted" style={{ textAlign: "center" }}>동그란 원 안에서 사진을 드래그해 위치를 맞춰보세요</div>
          <label className="lt-field" style={{ width: "100%" }}>
            <span>확대/축소</span>
            <input type="range" min="1" max="2.5" step="0.05" value={image.scale}
              onChange={(e) => onChange({ scale: parseFloat(e.target.value) })} />
          </label>
          <button className="lt-btn primary" style={{ justifyContent: "center", width: "100%" }} onClick={onClose}><Check size={15} /> 완료</button>
        </div>
      </div>
    </div>
  );
}

function CharacterEditor({ initial, onCancel, onSave, onDelete, showToast }) {
  const [name, setName] = useState(initial?.name || "");
  const [description, setDescription] = useState(initial?.description || "");
  const [images, setImages] = useState((initial?.images || []).map((img) => (typeof img === "string" ? makeImgObj(img) : img)));
  const [uploading, setUploading] = useState(false);
  const [adjustingId, setAdjustingId] = useState(null);
  const fileRef = useRef(null);
  const charId = useRef(initial?.id || genId());

  const onPickFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (files.length === 0) return;
    const room = MAX_IMAGES - images.length;
    if (room <= 0) { showToast?.(`이미지는 최대 ${MAX_IMAGES}장까지 추가할 수 있어요`); return; }
    setUploading(true);
    try {
      const resized = await Promise.all(files.slice(0, room).map((f) => resizeImageFile(f)));
      setImages((prev) => [...prev, ...resized.map(makeImgObj)]);
    } catch (err) { console.error(err); showToast?.("이미지를 불러오지 못했어요"); }
    finally { setUploading(false); }
  };
  const updateImage = (id, patch) => setImages((prev) => prev.map((im) => (im.id === id ? { ...im, ...patch } : im)));
  const removeImage = (id) => setImages((prev) => prev.filter((im) => im.id !== id));
  const submit = () => {
    if (!name.trim()) { showToast?.("캐릭터 이름을 입력해주세요"); return; }
    onSave({ id: charId.current, name: name.trim(), description: description.trim(), images });
  };
  const adjusting = images.find((im) => im.id === adjustingId);

  return (
    <div className="lt-char-editor">
      <div className="lt-char-editor-images">
        {images.map((im) => (
          <div key={im.id} className="lt-char-editor-thumb">
            <img src={im.src} alt="" style={{ objectPosition: `${im.x}% ${im.y}%`, transform: `scale(${im.scale})` }} />
            <button className="lt-thumb-adjust" onClick={() => setAdjustingId(im.id)} title="사진 위치/크기 조정"><Crop size={11} /></button>
            <button className="lt-thumb-remove" onClick={() => removeImage(im.id)}><X size={11} /></button>
          </div>
        ))}
        {images.length < MAX_IMAGES && (
          <button className="lt-char-editor-add" onClick={() => fileRef.current?.click()} disabled={uploading}>
            {uploading ? <Loader2 size={18} className="lt-spin" /> : <Camera size={18} />}
            <span>{images.length}/{MAX_IMAGES}</span>
            <span className="lt-tiny">캐릭터 이미지</span>
          </button>
        )}
        <input ref={fileRef} type="file" accept="image/*" multiple style={{ display: "none" }} onChange={onPickFiles} />
      </div>
      <label className="lt-field">
        <span>이름 <em>({name.length}/10)</em></span>
        <input value={name} onChange={(e) => setName(e.target.value.slice(0, 10))} placeholder="짧은 이름이 부르기 편해요. 예) 수현" />
      </label>
      <label className="lt-field">
        <span>설명</span>
        <textarea value={description} onChange={(e) => setDescription(e.target.value)} rows={4}
          placeholder="캐릭터의 성격, 말투, 행동, 감정 표현에 대해 써주시면 개성 있는 캐릭터를 만들 수 있어요." />
      </label>
      <div className="lt-form-actions">
        <button className="lt-btn primary" onClick={submit}><Check size={15} /> {initial ? "수정 완료" : "추가하기"}</button>
        <button className="lt-btn" onClick={onCancel}>취소</button>
        {onDelete && <button className="lt-btn danger" onClick={onDelete}><Trash2 size={15} /></button>}
      </div>
      {adjusting && <ImageAdjustSheet image={adjusting} onChange={(patch) => updateImage(adjustingId, patch)} onClose={() => setAdjustingId(null)} />}
    </div>
  );
}

/* ============================================================
   백업 / 복원 (사이트를 나가도, 새 버전으로 넘어가도 코드로 되살릴 수 있게)

function BackupScreen({ onBack, onImported, showToast }) {
  const [busy, setBusy] = useState(false);
  const [code, setCode] = useState("");
  const codeRef = useRef(null);
  const fileRef = useRef(null);

  const downloadBackup = async () => {
    setBusy(true);
    try {
      const c = await exportAllData();
      const blob = new Blob([c], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `lamptalk-backup-${Date.now()}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast?.("백업 파일을 다운로드했어요");
    } catch (e) {
      console.error(e);
      showToast?.("다운로드에 실패했어요. 아래 '코드로 보기'를 이용해주세요.");
    }
    setBusy(false);
  };
  const showAsCode = async () => {
    setBusy(true);
    try {
      const c = await exportAllData();
      setCode(c);
      setTimeout(() => { codeRef.current?.focus(); codeRef.current?.select(); }, 50);
    } catch (e) { console.error(e); showToast?.("백업 코드를 만들지 못했어요"); }
    setBusy(false);
  };
  const onPickBackupFile = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    setBusy(true);
    try {
      const text = await file.text();
      await importAllData(text);
      onImported?.();
    } catch (err) {
      console.error(err);
      showToast?.("파일을 불러오지 못했어요. 백업 파일이 맞는지 확인해주세요.");
    }
    setBusy(false);
  };
  const [importText, setImportText] = useState("");
  const doImportText = async () => {
    if (!importText.trim()) return;
    setBusy(true);
    try { await importAllData(importText); onImported?.(); }
    catch (e) {
      console.error(e);
      showToast?.("코드를 불러오지 못했어요. 코드 전체가 빠짐없이 붙여넣어졌는지 확인해주세요.");
    }
    setBusy(false);
  };

  return (
    <div className="lt-screen-full">
      <div className="lt-form-topbar">
        <button className="lt-iconbtn" onClick={onBack}><ChevronLeft size={20} /></button>
        <div className="lt-form-topbar-title">데이터 백업 / 복원</div>
        <div style={{ width: 32 }} />
      </div>
      <div className="lt-form-scroll">
        <div className="lt-form-section">
          <div className="lt-section-title">백업하기 (추천: 파일로 저장)</div>
          <div className="lt-muted">모든 프로필・플롯・대화 내용을 파일 하나로 저장해요. 사이트를 나가기 전에 미리 받아두세요. 모바일에서는 파일로 저장하는 쪽이 코드 복사보다 훨씬 안전해요.</div>
          <button className="lt-btn primary" onClick={downloadBackup} disabled={busy}>
            {busy ? <Loader2 size={16} className="lt-spin" /> : <Download size={16} />} 백업 파일 다운로드
          </button>
          <button className="lt-btn" onClick={showAsCode} disabled={busy}>파일 다운로드가 안 되면 코드로 보기</button>
          {code && (
            <label className="lt-field">
              <span>백업 코드 (탭하면 전체 선택돼요 — 길게 눌러 복사하세요)</span>
              <textarea ref={codeRef} readOnly value={code} rows={6} onFocus={(e) => e.target.select()} />
            </label>
          )}
        </div>
        <div className="lt-form-section">
          <div className="lt-section-title">복원하기 (추천: 백업 파일 선택)</div>
          <div className="lt-muted">저장해둔 백업 파일을 선택하면 그 시점 데이터로 복원돼요. 지금 가지고 있는 데이터는 덮어써지니 주의하세요.</div>
          <button className="lt-btn primary" onClick={() => fileRef.current?.click()} disabled={busy}>
            {busy ? <Loader2 size={16} className="lt-spin" /> : <Upload size={16} />} 백업 파일 선택해서 불러오기
          </button>
          <input ref={fileRef} type="file" accept=".txt,text/plain" style={{ display: "none" }} onChange={onPickBackupFile} />
          <label className="lt-field">
            <span>또는 백업 코드를 직접 붙여넣기</span>
            <textarea value={importText} onChange={(e) => setImportText(e.target.value)} rows={6} placeholder="여기에 백업 코드를 붙여넣으세요" />
          </label>
          <button className="lt-btn" disabled={busy || !importText.trim()} onClick={doImportText}>코드로 불러오기</button>
        </div>
      </div>
    </div>
  );
}

function LoreForm({ loreId, loreBooks, onBack, onSaved }) {
  const initial = loreId ? loreBooks.find((l) => l.id === loreId) : null;
  const [title, setTitle] = useState(initial?.title || "");
  const [shortDesc, setShortDesc] = useState(initial?.shortDesc || "");
  const [entries, setEntries] = useState(
    initial?.entries?.length
      ? initial.entries.map((e) => ({ ...e, keywords: (e.keywords || []).join(", ") }))
      : [{ id: genId(), title: "", keywords: "", content: "" }]
  );
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  const updateEntry = (idx, patch) => setEntries((prev) => prev.map((e, i) => (i === idx ? { ...e, ...patch } : e)));
  const addEntry = () => setEntries((prev) => (prev.length >= 20 ? prev : [...prev, { id: genId(), title: "", keywords: "", content: "" }]));
  const removeEntry = (idx) => setEntries((prev) => prev.filter((_, i) => i !== idx));

  const save = async () => {
    if (!title.trim()) { setError("로어북 제목을 입력해주세요."); return; }
    const clean = entries
      .map((e) => ({ id: e.id, title: e.title.trim(), keywords: e.keywords.split(",").map((k) => k.trim()).filter(Boolean), content: e.content.trim() }))
      .filter((e) => e.keywords.length > 0 && e.content);
    if (clean.length === 0) { setError("키워드와 내용을 모두 입력한 항목이 1개 이상 필요해요."); return; }
    setError("");
    setSaving(true);
    await onSaved({ id: initial?.id || genId(), title: title.trim(), shortDesc: shortDesc.trim(), entries: clean, createdAt: initial?.createdAt || Date.now() });
    setSaving(false);
  };

  return (
    <div className="lt-screen-full">
      <div className="lt-form-topbar">
        <button className="lt-iconbtn" onClick={onBack}><ChevronLeft size={20} /></button>
        <div className="lt-form-topbar-title">로어북</div>
        <button className="lt-btn primary small" disabled={saving} onClick={save}>{saving ? <Loader2 size={14} className="lt-spin" /> : "등록"}</button>
      </div>
      <div className="lt-form-scroll">
        <div className="lt-form-section">
          <div className="lt-section-title">소개글</div>
          <div className="lt-muted">소개글은 AI에게 전달되지 않아요. 로어북을 관리하는 용도로만 사용돼요.</div>
          <label className="lt-field">
            <span>로어북 제목 <em>({title.length}/20)</em></span>
            <input value={title} onChange={(e) => setTitle(e.target.value.slice(0, 20))} placeholder="로어북 제목을 입력해주세요" />
          </label>
          <label className="lt-field">
            <span>짧은 소개 <em>({shortDesc.length}/50)</em></span>
            <textarea value={shortDesc} onChange={(e) => setShortDesc(e.target.value.slice(0, 50))} placeholder="제목과 함께 보일 짧은 소개를 입력해주세요" rows={2} />
          </label>
        </div>
        <div className="lt-form-section">
          <div className="lt-section-title">항목</div>
          <div className="lt-muted">키워드가 대화에서 언급되면 아래 내용이 AI에게 자동으로 전달돼요.</div>
          {entries.map((e, idx) => (
            <div key={e.id} className="lt-lore-entry">
              <div className="lt-lore-entry-head">
                <span>항목 {idx + 1}</span>
                {entries.length > 1 && <button onClick={() => removeEntry(idx)}><Trash2 size={13} /></button>}
              </div>
              <label className="lt-field">
                <span>제목 <em>(선택)</em></span>
                <input value={e.title} onChange={(ev) => updateEntry(idx, { title: ev.target.value.slice(0, 20) })} placeholder="제목을 입력하세요" />
              </label>
              <label className="lt-field">
                <span>키워드</span>
                <textarea value={e.keywords} onChange={(ev) => updateEntry(idx, { keywords: ev.target.value })} placeholder="키워드를 쉼표(,)로 구분해서 입력해주세요" rows={2} />
              </label>
              <label className="lt-field">
                <span>내용</span>
                <textarea value={e.content} onChange={(ev) => updateEntry(idx, { content: ev.target.value })} placeholder="키워드가 언급됐을 때 AI에게 전달할 설정을 적어주세요" rows={4} />
              </label>
            </div>
          ))}
          <button className="lt-add-char-tile" onClick={addEntry}><Plus size={18} /><span>항목 추가</span></button>
        </div>
        {error && <div className="lt-error" style={{ margin: "0 16px 16px" }}>{error}</div>}
        <div className="lt-form-bottom-actions">
          <button className="lt-btn primary" disabled={saving} onClick={save}>{saving ? <Loader2 size={16} className="lt-spin" /> : <Check size={16} />} 등록</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   캐릭터 상세 시트 (설명 / 약속 / 기억 + 검색)
============================================================ */
function CharacterDetailSheet({ character, memory, characters, jobs, jobLog, currentDate, onCompletePromise, onClose }) {
  const [query, setQuery] = useState("");
  if (!character) return null;
  const q = query.trim();
  const matches = (text) => !q || (text || "").includes(q);
  const sharedBullets = bulletLines(memory?.shared).filter(matches);
  const ownBullets = bulletLines(memory?.byChar?.[character.id]).filter(matches);

  const promiseLabel = (p) => {
    const others = (p.characterIds || []).filter((id) => id !== character.id).map((id) => characters.find((c) => c.id === id)?.name).filter(Boolean);
    const withParts = [...(p.withUser ? ["나"] : []), ...others];
    return withParts.length ? `${withParts.join(", ")}와(과)` : "";
  };
  const memoryPromiseItems = (memory?.promises || [])
    .map((p, idx) => ({ p, idx }))
    .filter(({ p }) => (p.characterIds || []).includes(character.id))
    .map(({ p, idx }) => ({
      id: `mem-${idx}`, memIndex: idx, description: p.description,
      label: `${promiseLabel(p)} ${p.description}`.trim(), when: p.when || "언제일지 모름",
    }));

  const isJobDone = (j) => (jobLog || []).some((e) => e.jobId === j.id && e.date === (j.date || currentDate));
  const jobPromiseItems = (jobs || [])
    .filter((j) => (j.companionIds || []).includes(character.id))
    .filter((j) => !isJobDone(j))
    .map((j) => {
      const names = ["나", ...(j.companionIds || []).filter((id) => id !== character.id).map((id) => characters.find((c) => c.id === id)?.name).filter(Boolean)];
      return {
        id: `job-${j.id}`,
        label: `${j.name || "일감"}(${names.join(", ")})`,
        when: j.date ? `${formatDateLabel(j.date)}${j.time ? " " + j.time : ""}` : (j.time || "예정"),
      };
    });

  const allPromises = [...jobPromiseItems, ...memoryPromiseItems];
  const filteredPromises = allPromises.filter((p) => matches(p.label) || matches(p.when));

  return (
    <div className="lt-menu-overlay" onClick={onClose}>
      <div className="lt-detail-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="lt-detail-head">
          <Avatar name={character.name} image={character.images?.[0]} size={56} />
          <div className="lt-detail-name">{character.name}</div>
          <button className="lt-iconbtn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="lt-detail-body">
          <div className="lt-detail-search">
            <Search size={14} />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="기억・약속 검색" />
            {query && <button onClick={() => setQuery("")}><X size={13} /></button>}
          </div>

          {!q && (
            <>
              <div className="lt-section-title" style={{ margin: "4px 0" }}>캐릭터 설명</div>
              <div className="lt-detail-desc">{character.description || "설명이 없어요."}</div>
            </>
          )}

          <div className="lt-section-title" style={{ margin: "16px 0 8px" }}>약속</div>
          {filteredPromises.length === 0 && <div className="lt-muted">{q ? "검색 결과가 없어요." : "아직 잡힌 약속이 없어요."}</div>}
          {filteredPromises.length > 0 && (
            <div>
              {filteredPromises.map((p) => (
                <div key={p.id} className="lt-promise-row">
                  <div style={{ flex: 1 }}><b>{p.when}</b> · {p.label}</div>
                  {p.memIndex !== undefined ? (
                    <button className="lt-promise-done" onClick={() => onCompletePromise?.(p.memIndex, p.description)}>완료</button>
                  ) : (
                    <span className="lt-muted" style={{ fontSize: 10, flex: "0 0 auto" }}>일정</span>
                  )}
                </div>
              ))}
            </div>
          )}

          <div className="lt-section-title" style={{ margin: "16px 0 8px" }}>기억</div>
          {ownBullets.length === 0 && sharedBullets.length === 0 && (
            <div className="lt-muted">{q ? "검색 결과가 없어요." : "아직 기억하는 내용이 없어요. 대화를 더 나눠보세요."}</div>
          )}
          {ownBullets.length > 0 && (
            <>
              <div className="lt-detail-memory-label">{character.name}만 기억하는 것</div>
              <ul className="lt-memory-list">{ownBullets.map((b, i) => <li key={i}>{b}</li>)}</ul>
            </>
          )}
          {sharedBullets.length > 0 && (
            <>
              <div className="lt-detail-memory-label">함께 기억하는 것</div>
              <ul className="lt-memory-list">{sharedBullets.map((b, i) => <li key={i}>{b}</li>)}</ul>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// 같은 이름의 아이템을 하나로 묶어서 "이름 ×N" 형태로 보여주기 위한 그룹핑
function groupInventory(inventory) {
  const map = new Map();
  for (const it of inventory) {
    const key = `${it.name}|${it.image || ""}`;
    if (!map.has(key)) map.set(key, { name: it.name, image: it.image, count: 1, ids: [it.id] });
    else { const g = map.get(key); g.count += 1; g.ids.push(it.id); }
  }
  return Array.from(map.values());
}
